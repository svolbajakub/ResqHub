role sdělování údajů do Národního zdravotnického informačního systému podle tohoto zákona,","i) soudní znalci ve zdravotnických oborech a osoby se způsobilostí k výkonu zdravotnického povolání, které byly pověřeny vypracováním znaleckého posudku znaleckým ústavem nebo znaleckou kanceláří, poskytovatelem nebo zdravotnickým pracovníkem, v rozsahu nezbytném pro vypracování znaleckého posudku zadaného orgánem činným v trestním řízení, obhajobou nebo zmocněncem v trestním řízení nebo soudem,","j) zdravotničtí pracovníci způsobilí k ověřování podmínek vzniku nemocí z povolání pověření k této činnosti Státním úřadem pro jadernou bezpečnost, jde-li o podezření na vznik nemoci z povolání v souvislosti s prací v podmínkách ionizujícího záření,","k) osoby se způsobilostí k výkonu zdravotnického povolání, které jsou zaměstnanci orgánů ochrany veřejného zdraví, při výkonu státního zdravotního dozoru,","l) osoby se způsobilostí k výkonu zdravotnického povolání provádějící hodnocení kvality a bezpečí podle tohoto zákona a osoby se způsobilostí k výkonu zdravotnického povolání provádějící externí klinické audity lékařského ozáření podle zákona o specifických zdravotních službách,","m) veřejný ochránce práv, ochránce práv dětí, jejich zástupce a jimi pověření zaměstnanci Kanceláře veřejného ochránce práv a ochránce práv dětí v souvislosti s plněním úkolů při výkonu jim svěřené působnosti podle jiného zákona tak, aby byla zajištěna ochrana citlivých údajů třetích osob,","n) členové delegace Evropského výboru pro zabránění mučení a nelidskému či ponižujícímu zacházení nebo trestání nebo členové delegace Podvýboru pro prevenci mučení a jiného krutého, nelidského či ponižujícího zacházení nebo trestání, a to v rozsahu nezbytném pro splnění úkolu vyplývajícího z mezinárodních smluv, kterými je Česká republika vázána a které upravují činnost výboru nebo podvýboru,","o) inspektoři oprávnění k provádění inspekcí souvisejících s klinickým hodnocením humánních léčivých přípravků v souladu s přímo použitelným předpisem Evropské unie upravujícím podrobná pravidla pro provádění inspekčních postupů správné klinické praxe,","p) jde-li o pacientský souhrn nebo část zdravotnické dokumentace jinou než pacientský souhrn, pracovníci poskytovatele jiného státu Evropské unie prostřednictvím příslušného národního kontaktního místa státu Evropské unie, a to za účelem poskytnutí zdravotních služeb pacientovi, který se nachází v péči poskytovatele jiného státu Evropské unie a o němž jsou pacientský souhrn nebo část zdravotnické dokumentace jiná než pacientský souhrn, vedeny, pokud pacient, popřípadě jiná k tomu oprávněná osoba, nevyslovil nesouhlas podle § 56c odst. 2 nebo 3,","q) státní zástupci při výkonu dozoru nad dodržováním právních předpisů při výkonu ústavní výchovy a ochranné výchovy,","r) pověřený člen nebo zaměstnanec komory v rámci výkonu disciplinární pravomoci podle zákona o České lékařské komoře, České stomatologické komoře a České lékárnické komoře,","s) osoby provádějící monitoring nebo audit klinického hodnocení humánních léčivých přípravků podle přímo použitelného předpisu Evropské unie upravujícího klinická hodnocení humánních léčivých přípravků a členové etické komise, která vykonává dohled nad klinickým hodnocením léčivého přípravku, klinickou zkouškou zdravotnického prostředku nebo studií funkční způsobilosti diagnostického zdravotnického prostředku in vitro.","Osoby uvedené v písmenech b) až o), q) až s) si mohou pořizovat výpisy nebo kopie zdravotnické dokumentace v rozsahu nezbytném pro splnění účelu nahlížení.","(3) Osoby získávající způsobilost k výkonu povolání zdravotnického pracovníka nebo jiného odborného pracovníka a zdravotničtí pracovníci uvedení v § 46 odst. 2 mohou do zdravotnické dokumentace vedené o pacientovi nahlížet v rozsahu nezbytně nutném pro zajištění výuky; to neplatí, jestliže pacient nahlížení prokazatelně zakázal."]},"L/12":{"t":"","h":"","b":["(1) Obydlí je nedotknutelné. Není dovoleno do něj vstoupit bez souhlasu toho, kdo v něm bydlí.","(2) Domovní prohlídka je přípustná jen pro účely trestního řízení, a to na písemný odůvodněný příkaz soudce. Způsob provedení domovní prohlídky stanoví zákon.","(3) Jiné zásahy do nedotknutelnosti obydlí mohou být zákonem dovoleny, jen je-li to v demokratické společnosti nezbytné pro ochranu života nebo zdraví osob, pro ochranu práv a svobod druhých anebo pro odvrácení závažného ohrožení veřejné bezpečnosti a pořádku. Pokud je obydlí užíváno také pro podnikání nebo provozování jiné hospodářské činnosti, mohou být takové zásahy zákonem dovoleny, též je-li to nezbytné pro plnění úkolů veřejné správy."]},"273/40":{"t":"Vstup do obydlí, jiného prostoru nebo na pozemek","h":"","b":["(1) Policista je oprávněn vstoupit bez souhlasu uživatele do obydlí, jiného prostoru nebo na pozemek a provést tam potřebné úkony nebo jiná opatření jen tehdy, jestliže věc nesnese odkladu a vstup tam je nezbytný pro ochranu života nebo zdraví osob anebo pro odvrácení závažného ohrožení veřejného pořádku a bezpečnosti.","(2) Oprávnění podle odstavce 1 má policista také v případě","a) důvodného podezření, že se na místě uvedeném v odstavci 1 nachází zemřelý,","b) pronásledování osoby, nebo","c) vstupu do jiného prostoru nebo na pozemek, má-li důvodné podezření, že se tam nachází týrané zvíře.","(3) Policista je oprávněn za účelem vstupu na místo uvedené v odstavci 1 toto místo otevřít nebo jiným způsobem si do něj zjednat přístup, v případě nutnosti i za použití síly.","(4) Policista je povinen při vstupu do obydlí, jiného prostoru nebo na pozemek a při následných úkonech zajistit přítomnost nezúčastněné osoby; nemusí tak učinit, hrozí-li nebezpečí z prodlení nebo by mohlo dojít k ohrožení života anebo zdraví nezúčastněné osoby.","(5) Po provedení úkonů nebo jiných opatření je policista povinen bez zbytečného odkladu vyrozumět uživatele obydlí, jiného prostoru nebo pozemku a zajistit zabezpečení tohoto místa, nemůže-li tak učinit uživatel nebo jiná oprávněná osoba."]},"239/19":{"t":"","h":"Velitel zásahu","b":["(1) Koordinování záchranných a likvidačních prací v místě nasazení složek integrovaného záchranného systému a v prostoru předpokládaných účinků mimořádné události (dále jen „místo zásahu“) a řízení součinnosti těchto složek provádí velitel zásahu, který vyhlásí podle závažnosti mimořádné události odpovídající stupeň poplachu podle příslušného poplachového plánu integrovaného záchranného systému. Pokud zvláštní právní předpis nestanoví jinak, je velitelem zásahu velitel jednotky požární ochrany nebo příslušný funkcionář hasičského záchranného sboru s právem přednostního velení.","(2) Pokud na místě zásahu není ustanoven velitel zásahu podle odstavce 1, řídí součinnost těchto složek velitel nebo vedoucí zasahujících sil a prostředků složky integrovaného záchranného systému, která v místě zásahu provádí převažující činnost.","(3) Velitel zásahu je při provádění záchranných a likvidačních prací oprávněn","a) zakázat nebo omezit vstup osob na místo zásahu a nařídit, aby místo zásahu opustila osoba, jejíž přítomnost není potřebná, nařídit evakuaci osob, popřípadě stanovit i jiná dočasná omezení k ochraně života, zdraví, majetku a životního prostředí a vyzvat osobu, která se nepodřídí stanoveným omezením, aby prokázala svoji totožnost; tato osoba je povinna výzvě vyhovět,","b) nařídit bezodkladné provádění nebo odstraňování staveb, terénních úprav za účelem zmírnění nebo odvrácení rizik vzniklých mimořádnou událostí,","c) vyzvat právnické osoby nebo fyzické osoby k poskytnutí osobní nebo věcné pomoci,","d) zřídit štáb velitele zásahu jako svůj výkonný orgán a určit náčelníka a členy štábu. Členy štábu jsou zejména velitelé a vedoucí složek integrovaného záchranného systému. Členy tohoto štábu mohou být dále fyzické osoby a zástupci právnických osob, se kterými složky integrovaného záchranného systému spolupracují nebo které poskytují osobní nebo věcnou pomoc,","e) rozdělit místo zásahu na sektory, popřípadě úseky a stanovit jejich velitele, kterým je oprávněn ukládat úkoly a rozhodovat o přidělování sil a prostředků do podřízenosti velitelů sektorů a úseků."]},"239/25":{"t":"Fyzické osoby","h":"","b":["(1) Fyzická osoba pobývající na území České republiky má právo na informace o opatřeních k zabezpečení ochrany obyvatelstva a na poskytnutí instruktáže a školení ke své činnosti při mimořádných událostech.","(2) Fyzická osoba je povinna","a) strpět omezení vyplývající z opatření stanovených při mimořádné události a omezení nařízená velitelem zásahu při provádění záchranných a likvidačních prací,","b) poskytnout na výzvu starosty obce nebo velitele zásahu osobní nebo věcnou pomoc,","c) strpět, pokud je to nutné k provádění záchranných a likvidačních prací a pokud je vlastníkem, uživatelem nebo správcem nemovitosti, vstup osob provádějících záchranné nebo likvidační práce na pozemky nebo do objektů, použití nezbytné techniky, provedení terénních úprav, budování ochranných staveb, vyklizení pozemku a odstranění staveb, jejich částí, zařízení a porostů,","d) poskytnout veliteli zásahu informace o skutečnostech, které by mohly ohrozit životy nebo zdraví osob provádějících zásah nebo ostatního obyvatelstva, zejména informace o výbušninách, nebezpečných chemických látkách, zdrojích ionizujícího záření, dravých či nebezpečných zvířatech,","e) strpět umístění zařízení systému varování a vyrozumění na nemovitostech, které má ve vlastnictví, a umožnit k nim přístup hasičskému záchrannému sboru kraje nebo jím zmocněným osobám za účelem používání, kontroly, údržby a oprav,","f) pokud je vlastníkem stavby civilní ochrany nebo stavby dotčené požadavky civilní ochrany, dbát při užívání těchto nemovitostí a veškerých činnostech s tím spojených, aby nedošlo ke změně charakteru této stavby ve vztahu k jejímu účelu, a umožnit její využití pro potřeby civilní ochrany a přístup hasičskému záchrannému sboru kraje nebo jím zmocněným osobám do těchto staveb za účelem používání, kontroly, údržby a oprav.","(3) Plnění povinností uvedených v odstavci 2 může fyzická osoba odmítnout, pokud by tím ohrozila život nebo zdraví vlastní nebo jiných osob anebo pokud ji v tom brání důležité okolnosti, které by zjevně způsobily závažnější následek než ohrožení, kterému se má předcházet."]},"372/36":{"t":"Dříve vyslovené přání","h":"","b":["(1) Pacient může pro případ, kdy by se dostal do takového zdravotního stavu, ve kterém nebude schopen vyslovit souhlas nebo nesouhlas s poskytnutím zdravotních služeb a způsobem jejich poskytnutí, tento souhlas nebo nesouhlas předem vyslovit (dále jen „dříve vyslovené přání“).","(2) Poskytovatel bude brát zřetel na dříve vyslovené přání pacienta, má-li ho k dispozici, a to za podmínky, že v době poskytování zdravotních služeb nastala předvídatelná situace, k níž se dříve vyslovené přání vztahuje, a pacient je v takovém zdravotním stavu, kdy není schopen vyslovit nový souhlas nebo nesouhlas. Bude respektováno jen takové dříve vyslovené přání, které bylo učiněno na základě písemného poučení pacienta o důsledcích jeho rozhodnutí, a to ošetřujícím lékařem se specializovanou způsobilostí.","(3) Dříve vyslovené přání musí mít písemnou formu a musí být opatřeno úředně ověřeným podpisem pacienta. Součástí dříve vysloveného přání je písemné poučení podle odstavce 2.","(4) Pacient může učinit dříve vyslovené přání též při přijetí do péče poskytovatelem nebo kdykoliv v průběhu hospitalizace, a to pro poskytování zdravotních služeb zajišťovaných tímto poskytovatelem. Takto vyslovené přání se zaznamená do zdravotnické dokumentace vedené o pacientovi; záznam podepíše pacient, zdravotnický pracovník a svědek; v tomto případě se nepostupuje podle odstavce 3.","(5) Dříve vyslovené přání nelze respektovat, pokud by jeho splnění mohlo ohrozit jiné osoby nebo pokud nabádá k takovému jednání, jehož výsledkem je aktivní způsobení smrti.","(6) Dříve vyslovení přání nemůže učinit","a) nezletilý pacient,","b) pacient, jehož svéprávnost byla omezena tak, že není způsobilý posoudit poskytnutí zdravotních služeb, popřípadě důsledky jejich poskytnutí; tím není dotčeno právo takového pacienta odvolat dříve vyslovené přání učiněné v době před omezením jeho svéprávnosti."]},"U/9":{"t":"Dříve vyslovená přání","h":"","b":["Bude brán zřetel na dříve vyslovená přání pacienta ohledně lékařského zákroku, pokud pacient v době zákroku není ve stavu, kdy může vyjádřit své přání."]},"372/83":{"t":"","h":"Postup při úmrtí","b":["(1) Úmrtí osoby nebo nález těla zemřelého mimo zdravotnické zařízení poskytovatele se oznamuje poskytovateli nebo lékaři uvedenému v § 84 odst. 2 písm. a) nebo b). Nejsou-li poskytovatelé nebo lékaři podle věty první známi, oznámí se úmrtí nebo nález těla zemřelého na jednotné evropské tísňové číslo 112. Nález části těla zemřelého mimo zdravotnické zařízení poskytovatele se oznamuje na jednotné evropské tísňové číslo 112.","(2) Oznamovací povinnost podle odstavce 1 má každý, kdo se o úmrtí dozvěděl nebo nalezl tělo zemřelého nebo jeho část a neví, zda úmrtí nebo nález těla nebo jeho části již bylo oznámeno."]},"372/84":{"t":"","h":"","b":["(1) Prohlídku těla zemřelého je třeba provést vždy; jejím účelem je zjistit smrt osoby, pravděpodobné datum a čas úmrtí, pravděpodobnou příčinu smrti a dále určit, zda bude provedena pitva. V rámci provedení prohlídky těla zemřelého je provedeno označení těla zemřelého.","(2) Prohlídky těl zemřelých jsou povinni zajišťovat","a) poskytovatelé v oboru všeobecné praktické lékařství a v oboru praktické lékařství pro děti a dorost nebo pediatrie u svých registrovaných pacientů v rámci ordinační doby a v rozsahu provádění návštěvních služeb; provedení prohlídky nesmí vést k narušení poskytování zdravotních služeb,","b) nejde-li o postup podle písmene a), poskytovatel, se kterým kraj uzavřel za účelem zajišťování prohlídky těl zemřelých smlouvu,","c) poskytovatel, v jehož zdravotnickém zařízení došlo k úmrtí,","d) poskytovatel zdravotnické záchranné služby v případě, kdy k úmrtí došlo při poskytování přednemocniční neodkladné péče,","e) poskytovatel domácí paliativní péče v případě, kdy k úmrtí došlo při poskytování této péče a na místě poskytování této péče je přítomen zdravotnický pracovník způsobilý k provedení prohlídky těla zemřelého."]},"372/86":{"t":"","h":"","b":["(1) Lékař provádějící prohlídku těla zemřelého","a) vyplní příslušné části Listu o prohlídce zemřelého a zajistí předání jeho jednotlivých částí subjektům stanoveným prováděcím právním předpisem,","b) určí, zda bude provedena patologicko-anatomická nebo zdravotní pitva podle tohoto zákona,","c) o úmrtí nebo nálezu těla zemřelého informuje osobu blízkou zemřelému, je-li mu tato osoba známa; součástí informace je sdělení o určení provedení pitvy a identifikační údaje poskytovatele, který pitvu provede,","d) vyznačí v Listu o prohlídce zemřelého provedení patologicko-anatomické nebo zdravotní pitvy určené podle písmene b),","e) v případech, kdy určil provedení pitvy, zajistí převoz těla zemřelého k pitvě,","f) v případech, kdy neurčil provedení pitvy, předá zprávu o úmrtí registrujícímu poskytovateli v oboru všeobecné praktické lékařství, praktické lékařství pro děti a dorost nebo pediatrie, je-li mu znám, pokud lékař provádějící prohlídku těla zemřelého není současně tímto registrujícím poskytovatelem,","g) neprodleně informuje Policii České republiky, jde-li o","1. podezření, že úmrtí bylo způsobeno trestným činem nebo sebevraždou,","2. zemřelého neznámé totožnosti,","3. úmrtí, ke kterému došlo za nejasných okolností; lékař provádějící prohlídku těla zemřelého provede jen nezbytné úkony tak, aby nedošlo ke zničení nebo poškození možných důkazů nasvědčujících tomu, že byl spáchán trestný čin, nebo že jde o sebevraždu,","h) informuje Policii České republiky, jestliže mu není známa osoba blízká zemřelému nebo ji nebylo možné o úmrtí vyrozumět, a to za účelem vyhledání osoby blízké zemřelému a předání informace o úmrtí.","(2) Prostřednictvím Listu o prohlídce zemřelého je rodné číslo zemřelého pacienta předáváno matrice ve lhůtě podle jiného právního předpisu, statistickému ústavu, Českému statistickému úřadu a provozovateli pohřební služby.","(3) Má-li lékař provádějící prohlídku těla zemřelého podezření, že příčinou úmrtí je nebezpečná infekční nemoc nebo že jde o pacienta s touto nemocí, byla-li příčinou úmrtí taková nemoc, nebo jde-li o úmrtí pacienta s touto nemocí, neprodleně oznámí tuto skutečnost příslušnému orgánu ochrany veřejného zdraví. Orgán ochrany veřejného zdraví neprodleně stanoví podmínky pro přepravu zemřelého, provedení pitvy a pro pohřbení; do doby stanovení těchto podmínek nesmí být tělo pohřební službě vydáno.","(4) Má-li lékař provádějící prohlídku těla zemřelého podezření na kontaminaci zemřelého radioaktivní látkou, nebo v případě, že má podezření, že byla příčinou úmrtí pacienta kontaminace radioaktivní látkou, nebo jde-li o úmrtí pacienta kontaminovaného radioaktivní látkou, neprodleně oznámí tuto skutečnost Státnímu úřadu pro jadernou bezpečnost a orgánu ochrany veřejného zdraví. Státní úřad pro jadernou bezpečnost neprodleně stanoví podmínky pro přepravu zemřelého, provedení pitvy a pro pohřbení; do doby stanovení těchto podmínek nesmí být tělo pohřební službě vydáno."]},"372/79":{"t":"Úkony na těle zemřelého","h":"","b":["(1) Na těle zemřelého lze provádět pouze tyto úkony","a) prohlídku těla zemřelého,","b) pitvu, včetně odběru biologického materiálu pro diagnostické účely,","c) odběr orgánů pro transplantace podle transplantačního zákona,","d) odběr tkání a buněk určených k použití u člověka, a to","1. při léčbě příjemce lidských tkání a buněk podle transplantačního zákona a podle zákona o lidských tkáních a buňkách,","2. pro výrobu léčiv podle zákona o léčivech a zákona o lidských tkáních a buňkách,","e) odběr částí lidského těla, včetně tkání a buněk za účelem jejich použití pro lékařskou vědu, výzkum nebo k výukovým účelům, a dalším účelům, stanoví-li tak jiný právní předpis,","f) vyjmutí implantabilních zdravotnických prostředků a aktivních implantabilních zdravotnických prostředků, je-li to účelné; vyjímání stomatologických pevných protetických výrobků je zakázáno,","g) další úkony stanovené zákonem o pohřebnictví.","(2) Úkony na těle zemřelého, s výjimkou prohlídky těla zemřelého, postupů podle transplantačního zákona a případů nařízení pitvy orgány činnými v trestním řízení podle jiného právního předpisu, mohou být provedeny nejdříve za 2 hodiny poté, kdy k úmrtí došlo.","(3) Odběr biologického materiálu z těla zemřelého lze provést pouze v souvislosti s pitvou, a to i mimo zdravotnické zařízení; to neplatí při postupu podle jiných právních předpisů upravujících transplantace a upravujících postupy pro zajištění jakosti a bezpečnosti lidských orgánů, tkání a buněk."]},"297/1":{"t":"","h":"","b":["(1) List o prohlídce zemřelého (dále jen „List“) se člení na části A a B.","(2) List se vyplňuje","a) do elektronické šablony umožňující elektronické předání, nebo","b) do vytištěné podoby elektronické šablony nebo do propisovacího formuláře (dále jen „listinná podoba“).","(3) Náležitosti Listu a způsob jeho vyplňování jsou stanoveny v příloze k této vyhlášce. Zemřelým se pro potřeby vyplnění Listu rozumí i mrtvě narozené dítě."]},"TZ/150":{"t":"Neposkytnutí pomoci","h":"","b":["(1) Kdo osobě, která je v nebezpečí smrti nebo jeví známky vážné poruchy zdraví nebo jiného vážného onemocnění, neposkytne potřebnou pomoc, ač tak může učinit bez nebezpečí pro sebe nebo jiného, bude potrestán odnětím svobody až na dvě léta.","(2) Kdo osobě, která je v nebezpečí smrti nebo jeví známky vážné poruchy zdraví nebo vážného onemocnění, neposkytne potřebnou pomoc, ač je podle povahy svého zaměstnání povinen takovou pomoc poskytnout, bude potrestán odnětím svobody až na tři léta nebo zákazem činnosti."]},"TZ/151":{"t":"Neposkytnutí pomoci řidičem dopravního prostředku","h":"","b":["Řidič dopravního prostředku, který po dopravní nehodě, na níž měl účast, neposkytne osobě, která při nehodě utrpěla újmu na zdraví, potřebnou pomoc, ač tak může učinit bez nebezpečí pro sebe nebo jiného, bude potrestán odnětím svobody až na pět let nebo zákazem činnosti."]},"372/49":{"t":"Povinnosti zdravotnického pracovníka","h":"","b":["(1) Zdravotnický pracovník je povinen","a) poskytovat zdravotní služby, ke kterým získal odbornou nebo specializovanou způsobilost podle jiných právních předpisů, v rozsahu odpovídajícím jeho způsobilosti, zdravotnímu stavu pacienta, na náležité odborné úrovni a řídit se etickými principy,","b) poskytovat neprodleně odbornou první pomoc každému, jestliže by bez této pomoci byl ohrožen jeho život nebo vážně ohroženo zdraví a není-li pomoc včas dosažitelná obvyklým způsobem, a zajistit mu podle potřeby poskytnutí zdravotních služeb,","c) plnit další povinnosti stanovené tímto zákonem nebo jinými právními předpisy.","(2) Povinnosti podle odstavce 1","a) písm. a) a c) se vztahují i na jiné odborné pracovníky, kteří se podílejí na poskytování zdravotních služeb,","b) písm. c) se vztahují i na jiné odborné pracovníky vykonávající činnosti v přímé souvislosti s poskytováním zdravotních služeb.","(3) Zdravotnický pracovník, který se podílel na konziliu podle § 2 odst. 5, provede o této skutečnosti a dále o průběhu a výsledku konzilia záznam do zdravotnické dokumentace pacienta, jehož se konzilium týká. Záznam musí kromě obecných náležitostí zdravotnické dokumentace obsahovat také identifikační údaje poskytovatele nebo zdravotnického pracovníka, který se na konziliu podílel. Záznam obdrží rovněž poskytovatel, který o konzilium požádal."]},"361/41":{"t":"","h":"Jízda vozidel s právem přednostní jízdy","b":["(1) Řidič vozidla, který při plnění úkolů souvisejících s výkonem zvláštních povinností užívá zvláštního výstražného světla modré nebo modré a červené barvy, případně doplněného o zvláštní zvukové výstražné znamení (dále jen „vozidlo s právem přednostní jízdy“), není povinen dodržovat § 4 písm. c), § 5 odst. 1 písm. h) a odst. 2 písm. f), § 7 odst. 1 písm. b), § 11, § 12 odst. 1, 2, 4, 5 a 7, § 13 až 17, § 18 odst. 2, 3, 4 a 8, § 19, § 20, § 21 odst. 2, 3, 4, 5 a 6, § 22, 23, § 24 odst. 3 a 4, § 25 odst. 1, 3, 4 a 5, § 26, § 27 odst. 1, 2, 3 a 4, § 28 odst. 2, 3 a 5, § 31, § 35 odst. 1 a 2, § 36 odst. 1, 2 a 4, § 39 odst. 4 a 5, § 39a odst. 3 a 4, § 39b odst. 2 a 4, § 47 odst. 2 písm. a) a c), odst. 3 písm. a), c), d), f) a g) a odst. 5, § 48 odst. 1, 2, 3, 4 a 5, § 53 odst. 2 a § 67 odst. 8; je však povinen dbát potřebné opatrnosti, aby neohrozil bezpečnost provozu na pozemních komunikacích.","(2) Zvláštním zvukovým výstražným zařízením doplněným zvláštním výstražným světlem modré barvy mohou být vybavena vozidla","a) používaná policií a označená podle zvláštního právního předpisu,","b) Vězeňské služby,","c) vojenské policie označená podle zvláštního právního předpisu,","d) obecní policie, která určí obec,","e) používaná Hasičským záchranným sborem České republiky nebo jednotkami požární ochrany, které nejsou součástí Hasičského záchranného sboru České republiky,","f) důlní záchranné služby,","g) poruchové služby plynárenských zařízení,","h) používaná zdravotnickou záchrannou službou a vozidla, poskytovatele zdravotnické dopravní služby a poskytovatele přepravy pacientů neodkladné péče,","i) ozbrojených sil používaná u vojenských záchranných útvarů pro plnění humanitárních úkolů civilní ochrany,","j) celní správy označená podle zvláštního právního předpisu,","k) Generální inspekce bezpečnostních sborů označená podle zvláštního právního předpisu,","l) zpravodajských služeb při přepravě nosičů utajovaných informací nebo osob, kterým poskytují ochranu,","m) používaná Inspekcí silniční dopravy a označená podle zvláštního právního předpisu.","(3) Vláda může stanovit nařízením další vozidla, která pro plnění úkolů souvisejících s výkonem zvláštních povinností mohou být vybavena zvláštním zvukovým výstražným zařízením doplněným zvláštním výstražným světlem modré barvy.","(4) Řidičem vozidla s právem přednostní jízdy smí být osoba starší 21 let, která musí splňovat podmínky stanovené tímto zákonem.","(5) Řidič vozidla s právem přednostní jízdy nesmí za jízdy jíst, pít a kouřit.","(6) Odstavce 1 a 4 platí obdobně i pro řidiče vozidel doprovázených vpředu, a jde-li o více než tři vozidla, i vzadu vozidly ozbrojených sil nebo ozbrojených sborů s právem přednostní jízdy. Doprovázená vozidla musí mít rozsvícena obrysová a potkávací světla.","(7) Řidiči ostatních vozidel musí vozidlům s právem přednostní jízdy a vozidlům jimi doprovázeným umožnit bezpečný a plynulý průjezd, a jestliže je to nutné, i zastavit vozidla na takovém místě, aby jim nepřekážela. Do skupiny tvořené vozidly s právem přednostní jízdy a vozidly jimi doprovázenými se řidiči ostatních vozidel nesmějí zařazovat.","(8) Není-li dálnice nebo silnice pro motorová vozidla s nejméně dvěma jízdními pruhy volně průjezdná z důvodu kolony stojících nebo pomalu jedoucích vozidel, jsou řidiči vozidel povinni vytvořit mezi jízdními pruhy prostor pro průjezd vozidel s právem přednostní jízdy; při tom smějí vjet na krajnici nebo na střední dělící pás. Jsou-li v jednom směru jízdy více než dva jízdní pruhy, vytváří se tento prostor mezi jízdním pruhem, který je nejvíce vlevo, a k němu přiléhajícím jízdním pruhem. Do tohoto prostoru smějí vjet pouze vozidla s právem přednostní jízdy, vozidla správce pozemní komunikace a vozidla sloužící k odstranění následků dopravní nehody nebo překážky provozu na pozemních komunikacích.","(9) Svítí-li zvláštní výstražné světlo modré nebo modré a červené barvy na stojícím vozidle, musí řidiči ostatních vozidel podle okolností snížit rychlost jízdy a popřípadě i zastavit vozidlo.","(10) V provozu na pozemních komunikacích je zakázáno neoprávněně užívat zvláštních výstražných světel a zvláštního zvukového výstražného znamení, které užívá vozidlo s právem přednostní jízdy, nebo je napodobovat.","(11) Zvláštním výstražným světlem modré a červené barvy mohou být vybavena vozidla používaná policií a označená podle zvláštního právního předpisu, vozidla používána Hasičským záchranným sborem České republiky nebo jednotkami požární ochrany, které nejsou součástí Hasičského záchranného sboru České republiky, a vozidla poskytovatele zdravotnické záchranné služby."]},"374/3":{"t":"Vymezení některých pojmů","h":"","b":["Pro účely tohoto zákona se rozumí","a) závažným postižením zdraví náhle vzniklé onemocnění, úraz nebo jiné zhoršení zdravotního stavu, které působí prohlubování chorobných změn, jež mohou vést bez neprodleného poskytnutí zdravotnické záchranné služby ke vzniku dlouhodobých nebo trvalých následků, případně až k náhlé smrti, nebo náhle vzniklá intenzivní bolest nebo náhle vzniklé změny chování a jednání postiženého ohrožující zdraví nebo život jeho samého nebo jiných osob,","b) přímým ohrožením života náhle vzniklé onemocnění, úraz nebo jiné zhoršení zdravotního stavu, které vede nebo bez neprodleného poskytnutí zdravotnické záchranné služby by mohlo vést k náhlému selhání některé ze základních životních funkcí lidského organismu,","c) tísňovou výzvou vyhodnocená tísňová komunikace na národní tísňové číslo 155 nebo výzva předaná operačním střediskem jiné složky integrovaného záchranného systému,","d) cílovým poskytovatelem akutní lůžkové péče nejblíže dostupný poskytovatel akutní lůžkové péče, který je způsobilý odborně zajistit pokračování poskytování zdravotní péče pacientovi, odpovídající závažnosti postižení zdraví nebo přímému ohrožení života,","e) přednemocniční neodkladnou péčí neodkladná péče poskytovaná pacientovi na místě vzniku závažného postižení zdraví nebo přímého ohrožení života (dále jen „místo události“) a během jeho přepravy k cílovému poskytovateli akutní lůžkové péče."]},"374/4":{"t":"Vymezení zdravotnické záchranné služby","h":"","b":["Zdravotnická záchranná služba zahrnuje tyto činnosti:","a) nepřetržitý kvalifikovaný bezodkladný příjem tísňové komunikace na národní tísňové číslo 155 a výzev předaných operačním střediskem jiné základní složky integrovaného záchranného systému operátorem zdravotnického operačního střediska nebo pomocného operačního střediska,","b) vyhodnocování stupně naléhavosti tísňové komunikace, rozhodování o nejvhodnějším okamžitém řešení tísňové výzvy podle zdravotního stavu pacienta, rozhodování o vyslání výjezdové skupiny, rozhodování o přesměrování výjezdové skupiny a operační řízení výjezdových skupin,","c) řízení a organizaci přednemocniční neodkladné péče na místě události a spolupráci s velitelem zásahu složek integrovaného záchranného systému,","d) spolupráci s cílovým poskytovatelem akutní lůžkové péče,","e) poskytování instrukcí k zajištění první pomoci prostřednictvím sítě elektronických komunikací v případě, že je nezbytné poskytnout první pomoc do příjezdu výjezdové skupiny na místo události,","f) vyšetření pacienta a poskytnutí zdravotní péče, včetně případných neodkladných výkonů k záchraně života, provedené na místě události, které směřují k obnovení nebo stabilizaci základních životních funkcí pacienta,","g) soustavnou zdravotní péči a nepřetržité sledování ukazatelů základních životních funkcí pacienta během jeho přepravy k cílovému poskytovateli akutní lůžkové péče, a to až do okamžiku osobního předání pacienta zdravotnickému pracovníkovi cílového poskytovatele akutní lůžkové péče,","h) přepravu pacienta letadlem mezi poskytovateli akutní lůžkové péče za podmínek soustavného poskytování neodkladné péče během přepravy, hrozí-li nebezpečí z prodlení a nelze-li přepravu zajistit jinak,","i) přepravu tkání a orgánů k transplantaci letadlem, hrozí-li nebezpečí z prodlení a nelze-li přepravu zajistit jinak,","j) třídění osob postižených na zdraví podle odborných hledisek urgentní medicíny při hromadném postižení osob v důsledku mimořádných událostí nebo krizových situací."]},"374/5":{"t":"Dostupnost zdravotnické záchranné služby","h":"","b":["(1) Dostupnost zdravotnické záchranné služby je dána zejména plánem pokrytí území kraje výjezdovými základnami zdravotnické záchranné služby (dále jen „výjezdová základna“).","(2) Plán pokrytí území kraje výjezdovými základnami stanoví počet a rozmístění výjezdových základen v závislosti na demografických, topografických a rizikových parametrech území jednotlivých obcí a městských částí hlavního města Prahy tak, aby místo události na území jednotlivých obcí a městských částí bylo dosažitelné z nejbližší výjezdové základny v dojezdové době do 20 minut. Při stanovení počtu a rozmístění výjezdových základen se zohlední případné poskytování zdravotnické záchranné služby na území kraje také poskytovatelem zdravotnické záchranné služby zřízeným jiným krajem podle odstavce 5.","(3) Dojezdová doba se počítá od okamžiku převzetí pokynu k výjezdu výjezdovou skupinou od operátora zdravotnického operačního střediska nebo pomocného operačního střediska. Dojezdová doba musí být dodržena s výjimkou případů nenadálých nepříznivých dopravních nebo povětrnostních podmínek nebo jiných případů hodných zvláštního zřetele; v těchto případech si poskytovatel zdravotnické záchranné služby vyžádá pomoc od ostatních složek integrovaného záchranného systému podle § 11 odst. 4, je-li podle okolností tato pomoc možná a účelná.","(4) Výjezdovou základnu leteckých výjezdových skupin lze zřídit, jsou-li pro tuto základnu zajištěna letadla podle § 21.","(5) Na poskytování zdravotnické záchranné služby na území kraje se může podílet také poskytovatel zdravotnické záchranné služby zřízený jiným krajem, a to na základě písemné smlouvy uzavřené kraji.","(6) Plán pokrytí území kraje výjezdovými základnami vydává kraj; plán musí být krajem aktualizován nejméně jednou za 2 roky. Před vydáním plánu pokrytí území kraje výjezdovými základnami a před jeho aktualizací kraj projedná návrh plánu a návrh jeho aktualizace s bezpečnostní radou kraje a vyžádá si k návrhu stanovisko Ministerstva zdravotnictví (dále jen „ministerstvo“). Podklady pro plán pokrytí území kraje výjezdovými základnami a pro jeho aktualizaci zpracovává poskytovatel zdravotnické záchranné služby."]},"374/6":{"t":"Součinnost poskytovatelů akutní lůžkové péče při poskytovaní zdravotnické záchranné služby","h":"","b":["(1) K zajištění plynulé návaznosti zdravotních služeb na zdravotnickou záchrannou službu je poskytovatel akutní lůžkové péče povinen","a) zřídit kontaktní místo pro spolupráci s poskytovatelem zdravotnické záchranné služby za účelem zajištění příjmu pacienta a neodkladného pokračování v poskytování zdravotních služeb; zřídí-li poskytovatel akutní lůžkové péče urgentní příjem, je kontaktní místo jeho součástí,","b) zajistit nepřetržité předávání informací o počtu volných akutních lůžek svému kontaktnímu místu,","c) nepřetržitě spolupracovat prostřednictvím kontaktního místa se zdravotnickým operačním střediskem nebo pomocným operačním střediskem,","d) bezodkladně informovat zdravotnické operační středisko nebo pomocné operační středisko o provozních závadách a jiných skutečnostech, které podstatně omezují poskytování neodkladné péče,","e) poskytnout na výzvu poskytovatele zdravotnické záchranné služby součinnost při záchranných a likvidačních pracích při řešení mimořádných událostí a krizových situací.","(2) Cílový poskytovatel akutní lůžkové péče je povinen převzít pacienta do své péče, pokud jeho kontaktním místem byla možnost přijmout pacienta potvrzena zdravotnickému operačnímu středisku nebo pomocnému operačnímu středisku. Cílový poskytovatel akutní lůžkové péče je povinen na výzvu zdravotnického operačního střediska nebo pomocného operačního střediska převzít pacienta do své péče vždy, je-li pacient v přímém ohrožení života. Převzetí pacienta do své péče je cílový poskytovatel akutní lůžkové péče povinen písemně potvrdit vedoucímu výjezdové skupiny.","(3) Kontaktní místo je pracoviště poskytovatele akutní lůžkové péče s nepřetržitým provozem, které přijímá výzvy od zdravotnického operačního střediska nebo pomocného operačního střediska k přijetí pacienta, trvale eviduje počet volných akutních lůžek poskytovatele akutní lůžkové péče a koordinuje převzetí pacienta mezi poskytovatelem zdravotnické záchranné služby a cílovým poskytovatelem akutní lůžkové péče.","(4) Ustanovení odstavců 1 a 2 se nevztahují na poskytovatele akutní lůžkové péče ve zdravotnických zařízeních Vězeňské služby České republiky."]},"240v/2":{"t":"Stupně naléhavosti tísňového volání","h":"","b":["(1) Tísňové volání má tyto stupně naléhavosti:","a) první stupeň, jde-li o","1. osobu, u které došlo k selhání nebo bezprostředně hrozí selhání základních životních funkcí, nebo","2. mimořádnou událost s hromadným postižením osob,","b) druhý stupeň, jde-li o osobu, u které pravděpodobně hrozí selhání základních životních funkcí,","c) třetí stupeň, jde-li o osobu, které bezprostředně nehrozí selhání základních životních funkcí, ale jejíž stav vyžaduje poskytnutí zdravotnické záchranné služby,","d) čtvrtý stupeň, nejde-li o případy uvedené pod písmeny a) až c), pokud operátor zdravotnického operačního střediska nebo pomocného operačního střediska rozhodne o vyslání výjezdové skupiny.","(2) Operátor zdravotnického operačního střediska nebo pomocného operačního střediska vysílá výjezdové skupiny na místo události podle stupně naléhavosti tísňového volání, a to v pořadí od prvního stupně naléhavosti. V případě prvního stupně naléhavosti tísňového volání je na místo události přednostně vyslána nebo přesměrována nejbližší dostupná výjezdová skupina; je-li touto výjezdovou skupinou výjezdová skupina rychlé zdravotnické pomoci, je na místo události současně vyslána nebo přesměrována výjezdová skupina rychlé lékařské pomoci.","(3) Při převzetí tísňového volání s vyhodnoceným stupněm naléhavosti od zdravotnického operačního střediska nebo pomocného operačního střediska jiného poskytovatele zdravotnické záchranné služby se přejímá již určený stupeň naléhavosti."]},"240v/6":{"t":"","h":"Činnost zdravotnické složky v místě mimořádné události s hromadným postižením osob","b":["(1) Vedoucí výjezdové skupiny, která přijede na místo mimořádné události s hromadným postižením osob jako první, upřesní zdravotnickému operačnímu středisku způsob dosažení místa mimořádné události dalšími výjezdovými skupinami a zajistí orientační zdravotnický průzkum místa mimořádné události za účelem provedení odhadu počtu osob postižených na zdraví (dále jen „postižená osoba“) a zemřelých a určení možných rizik a míry nebezpečí pro členy výjezdových skupin. Na základě průzkumu provedeného podle věty první vedoucí výjezdové skupiny stanoví předběžný požadavek na vyslání dalších výjezdových skupin a prostředků poskytovatele zdravotnické záchranné služby a případně i na vyžádání spolupráce a pomoci dalších poskytovatelů zdravotních služeb a ostatních složek integrovaného záchranného systému a předá jej neprodleně zdravotnickému operačnímu středisku.","(2) Činnost zdravotnické složky v místě mimořádné události s hromadným postižením osob je organizována v rámci","a) třídících skupin,","b) skupiny přednemocniční neodkladné péče,","c) skupiny odsunu postižených osob.","(3) Činnost skupin uvedených v odstavci 2 řídí jejich vedoucí. Třídící skupiny a skupina přednemocniční neodkladné péče mají společného vedoucího, kterým je lékař."]},"374/7":{"t":"Traumatologický plán poskytovatele zdravotnické záchranné služby","h":"","b":["(1) Traumatologický plán poskytovatele zdravotnické záchranné služby (dále jen „traumatologický plán“) stanoví opatření a postupy uplatňované poskytovatelem zdravotnické záchranné služby při zajišťování a poskytování přednemocniční neodkladné péče v případě hromadných neštěstí. Součástí traumatologického plánu je přehled a hodnocení možných zdrojů rizik ohrožení života a zdraví osob. Traumatologický plán vychází z místních podmínek a možností a ze závěrů projednání návrhu plánu podle odstavce 2.","(2) Poskytovatel zdravotnické záchranné služby je povinen zpracovat traumatologický plán, aktualizovat jej nejméně jednou za 2 roky a jedno vyhotovení plánu předat do 30 dnů ode dne jeho zpracování nebo aktualizace krajskému úřadu kraje, na jehož území poskytuje zdravotnickou záchrannou službu. Návrh traumatologického plánu a návrh jeho změny je poskytovatel zdravotnické záchranné služby povinen projednat s krajským úřadem.","(3) Prováděcí právní předpis stanoví podrobnosti o obsahu traumatologického plánu a o postupu při jeho zpracování a projednání s krajským úřadem."]},"372/87":{"t":"Postup při mimořádné události s hromadným úmrtím","h":"","b":["(1) Mimořádná událost s hromadným úmrtím je událost, při níž zemře zpravidla více než 10 osob. Lékaři poskytovatele zdravotnické záchranné služby, kteří se dostaví k místu nálezu obětí, zasahují","a) v místě nálezu těl, nebo","b) ve vnější zóně, kde","1. třídí oběti podle stupně postižení, nebo","2. konstatují smrt.","(2) Policie České republiky provede identifikaci zemřelých, zajištění místa jejich nálezu nebo místa shromáždění těl zemřelých. Velitel složky Policie České republiky zajistí přivolání lékaře se způsobilostí v oboru soudní lékařství a lékaře podle § 84 odst. 2 písm. b), který zajistí prohlídky těl zemřelých. V případě, že je důvodné podezření, že těla zemřelých jsou kontaminována chemickými, radioaktivními nebo nebezpečnými biologickými materiály, zajistí přivolání policejního nebo armádního specialisty na danou problematiku."]},"55/3":{"t":"Činnosti zdravotnického pracovníka s odbornou způsobilostí","h":"","b":["(1) Zdravotnický pracovník uvedený v § 4 až 29 bez odborného dohledu a bez indikace v rozsahu své odborné způsobilosti","a) poskytuje zdravotní péči v souladu s právními předpisy a standardy,","b) dbá na dodržování hygienicko-epidemiologického režimu v souladu s právními předpisy upravujícími ochranu veřejného zdraví,","c) provádí zápisy do zdravotnické dokumentace a další dokumentace vyplývající z jiných právních předpisů, pracuje s informačním systémem poskytovatele zdravotních služeb,","d) poskytuje pacientovi informace v souladu se svou odbornou způsobilostí, případně pokyny lékaře, zubního lékaře, farmaceuta, klinického psychologa nebo klinického logopeda,","e) podílí se na praktickém vyučování ve studijních oborech k získání způsobilosti k výkonu zdravotnického povolání uskutečňovaných středními školami a vyššími odbornými školami, v akreditovaných zdravotnických studijních programech k získání způsobilosti k výkonu zdravotnického povolání uskutečňovaných vysokými školami v České republice a ve vzdělávacích programech akreditovaných kvalifikačních kurzů,","f) podílí se na přípravě standardů,","g) motivuje a edukuje jednotlivce, rodiny a skupiny osob k přijetí zdravého životního stylu a k péči o sebe,","h) podílí se na zajištění zapracování nově nastupujících zdravotnických pracovníků,","i) provádí opatření při řešení následků mimořádné události nebo krizové situace.","(2) Zdravotnický pracovník uvedený v § 30 až 43 po získání odborné způsobilosti pod odborným dohledem zdravotnického pracovníka způsobilého k výkonu povolání bez odborného dohledu v rozsahu své odborné způsobilosti","a) poskytuje zdravotní péči v souladu s právními předpisy a standardy,","b) pracuje se zdravotnickou dokumentací a s informačním systémem zdravotnického zařízení.","(3) Zdravotnický pracovník, který vykonává činnosti pod odborným dohledem zdravotnického pracovníka se specializovanou způsobilostí, může také vykonávat z těchto činností úzce vymezené činnosti pod odborným dohledem zdravotnického pracovníka, který je v rozsahu své zvláštní odborné způsobilosti k výkonu takových úzce vymezených činností způsobilý."]},"55/17":{"t":"Zdravotnický záchranář","h":"","b":["(1) Zdravotnický záchranář vykonává činnosti podle § 3 odst. 1 a dále bez odborného dohledu a bez indikace vykonává činnosti v rámci specifické ošetřovatelské péče při poskytování přednemocniční neodkladné péče, a dále při poskytování akutní lůžkové péče intenzivní, včetně péče na urgentním příjmu. Přitom zejména může","a) sledovat, monitorovat a hodnotit vitální funkce včetně snímání elektrokardiografického záznamu, průběžného sledování a hodnocení poruch rytmu, vyšetření a monitorování dalších tělesných parametrů za použití zdravotnických prostředků,","b) vyhodnocovat projevy onemocnění a rizikových faktorů a na základě diferenciální diagnostiky stanovit předběžnou diagnózu,","c) zahajovat a provádět kardiopulmonální resuscitaci s použitím ručních křísicích vaků, včetně defibrilace srdce elektrickým výbojem po provedení záznamu elektrokardiogramu,","d) zajišťovat periferní žilní nebo intraoseální vstup, aplikovat krystaloidní roztoky a provádět nitrožilní aplikaci roztoků glukózy u pacienta s ověřenou hypoglykemií,","e) provádět laboratorní vyšetření určená pro neodkladnou péči a hodnotit je,","f) obsluhovat a udržovat vybavení všech kategorií dopravních prostředků, řídit pozemní dopravní prostředky, a to i v obtížných podmínkách jízdy s využitím výstražných zvukových a světelných zařízení,","g) provádět první ošetření ran, včetně zástavy krvácení,","h) zajišťovat nebo provádět bezpečné vyproštění, polohování, imobilizaci, transport pacientů a zajišťovat bezpečnost pacientů během transportu,","i) vykonávat v rozsahu své odborné způsobilosti činnosti při řešení následků mimořádných událostí při provádění záchranných a likvidačních prací v rámci integrovaného záchranného systému,","j) zajišťovat v případě potřeby péči o tělo zemřelého,","k) přejímat, kontrolovat a ukládat léčivé přípravky, manipulovat s nimi a zajišťovat jejich dostatečnou zásobu,","l) přejímat, kontrolovat a ukládat zdravotnické prostředky a prádlo, manipulovat s nimi a zajišťovat jejich dezinfekci a sterilizaci a jejich dostatečnou zásobu,","m) provádět neodkladné výkony v rámci probíhajícího porodu a první ošetření novorozence,","n) přijímat, evidovat a vyhodnocovat tísňové výzvy z hlediska závažnosti zdravotního stavu pacienta a podle stupně naléhavosti, zabezpečovat odpovídající způsob jejich řešení za použití telekomunikační a sdělovací techniky,","o) provádět telefonní instruktáž k poskytování první pomoci a poskytovat další potřebné rady za použití vhodného psychologického přístupu,","p) zavádět a udržovat inhalační a kyslíkovou terapii.","(2) Zdravotnický záchranář při poskytování přednemocniční neodkladné péče, a dále při poskytování akutní lůžkové péče intenzivní, včetně péče na urgentním příjmu může bez odborného dohledu na základě indikace lékaře vykonávat činnosti při poskytování diagnostické a léčebné péče. Přitom zejména může","a) zajišťovat dýchací cesty dostupnými pomůckami, zavádět a udržovat inhalační kyslíkovou terapii, zajišťovat přístrojovou ventilaci s parametry určenými lékařem, pečovat o dýchací cesty pacientů i při umělé plicní ventilaci,","b) podávat léčivé přípravky, včetně krevních derivátů,","c) asistovat při zahájení aplikace transfuzních přípravků a ošetřovat pacienta v průběhu aplikace a ukončovat ji,","d) provádět katetrizaci močového měchýře žen a dívek starších 3 let věku,","e) odebírat biologický materiál na vyšetření.","(3) Zdravotnický záchranář dále při poskytování přednemocniční neodkladné péče, a dále při poskytování akutní lůžkové péče intenzivní, včetně péče na urgentním příjmu, vykonává činnosti podle § 4 odst. 1 písm. d), f), n), r), u) a v) a § 4a odst. 1 písm. b) až n)."]},"55/109":{"t":"Zdravotnický záchranář pro urgentní medicínu","h":"","b":["Zdravotnický záchranář pro urgentní medicínu vykonává činnosti podle § 17 a § 54 písm. a) a dále poskytuje specifickou ošetřovatelskou péči a neodkladnou diagnosticko-léčebnou péči při poskytování přednemocniční neodkladné péče, a dále při poskytování akutní lůžkové péče intenzivní, včetně péče na urgentním příjmu. Přitom zejména může","a) bez odborného dohledu a bez indikace lékaře","1. zajišťovat dýchací cesty dostupnými pomůckami u pacienta staršího 10 let při prováděné kardiopulmonální resuscitaci,","2. zahájit a provádět kardiopulmonální resuscitaci pomocí použití přístrojů k automatické srdeční masáži, včetně defibrilace srdce elektrickým výbojem po provedení záznamu elektrokardiogramu, a podání léčiv pro resuscitaci bezprostředně nezbytných,","3. odebírat biologický materiál na vyšetření,","4. zajišťovat stálou připravenost pracoviště, včetně funkčnosti speciální přístrojové techniky a materiálního vybavení; sledovat a analyzovat údaje na speciální přístrojové technice, rozpoznávat technické komplikace a řešit je,","5. v rozsahu své specializované způsobilosti provádět v místě mimořádné události záchranné a likvidační práce,","6. být vedoucím zdravotnické složky za podmínek stanovených podle § 1 písm. d) vyhlášky č. 240/2012 Sb., kterou se provádí zákon o zdravotnické záchranné službě,","7. zahájit a provádět poresuscitační péči v přednemocniční neodkladné péči, včetně analgosedace;","b) bez odborného dohledu na základě indikace lékaře","1. provádět měření a analýzu fyziologických funkcí pomocí přístrojové techniky, včetně využití invazivních metod,","2. provádět externí kardiostimulaci,","3. pečovat o dýchací cesty pacienta i při umělé plicní ventilaci, včetně odsávání z dolních cest dýchacích, provádět tracheobronchiální laváže u pacienta se zajištěnými dýchacími cestami,","4. zavádět gastrickou sondu a provádět výplach žaludku u pacienta při vědomí,","5. zavádět gastrickou sondu a provádět výplach žaludku u pacienta staršího 10 let v bezvědomí se zajištěnými dýchacími cestami,","6. provádět extubaci tracheální kanyly,","7. provádí další život zachraňující úkony;","c) pod odborným dohledem lékaře aplikovat transfuzní přípravky a přetlakové objemové náhrady."]},"96/18":{"t":"Odborná způsobilost k výkonu povolání zdravotnického záchranáře","h":"","b":["(1) Odborná způsobilost k výkonu povolání zdravotnického záchranáře se získává absolvováním","a) akreditovaného zdravotnického bakalářského studijního oboru pro přípravu zdravotnických záchranářů,","b) nejméně tříletého studia v oboru diplomovaný zdravotnický záchranář na vyšších zdravotnických školách, pokud bylo studium prvního ročníku zahájeno nejpozději ve školním roce 2018/2019, nebo","c) střední zdravotnické školy v oboru zdravotnický záchranář, pokud bylo studium prvního ročníku zahájeno nejpozději ve školním roce 1998/1999.","(2) Odbornou způsobilost k výkonu povolání zdravotnického záchranáře má také zdravotnický pracovník, který získal odbornou způsobilost k výkonu povolání všeobecná sestra podle § 5 a specializovanou způsobilost v oboru sestra pro intenzivní péči a byl členem výjezdové skupiny zdravotnické záchranné služby nejméně v rozsahu alespoň poloviny týdenní pracovní doby po dobu 5 let v posledních 6 letech.","(3) Za výkon povolání zdravotnického záchranáře se považuje činnost v rámci specifické ošetřovatelské péče při poskytování přednemocniční neodkladné péče, a dále při poskytování akutní lůžkové péče intenzivní, včetně péče na urgentním příjmu. Dále se zdravotnický záchranář podílí na neodkladné, léčebné a diagnostické péči.","(4) Zdravotnický záchranář, který získal odbornou způsobilost podle odstavce 1, může bez odborného dohledu provádět činnosti v rámci specifické ošetřovatelské péče při poskytování přednemocniční neodkladné péče až po 1 roce výkonu povolání v rozsahu nejméně poloviny stanovené týdenní pracovní doby při poskytování","a) akutní lůžkové péče intenzivní, včetně péče na urgentním příjmu bez odborného dohledu, nebo","b) přednemocniční neodkladné péče pod odborným dohledem.","Doby výkonu povolání u poskytovatele zdravotních služeb, který poskytuje zdravotní péči uvedenou v písmenu a) nebo b), lze sčítat.","(5) Podmínky uvedené v odstavci 4 neplatí, pokud odbornou způsobilost podle odstavce 1 získal zdravotnický pracovník, který získal odbornou způsobilost k výkonu povolání řidiče vozidla zdravotnické záchranné služby podle § 35 a toto povolání vykonával v rozsahu alespoň poloviny stanovené týdenní pracovní doby nejméně po dobu 5 let v posledních 7 letech předcházejících získání odborné způsobilosti podle odstavce 1."]},"167/5":{"t":"Zacházení s návykovými látkami a přípravky bez povolení k zacházení","h":"","b":["(1) Návykové látky uvedené v příloze č. 1, 2, 5, 6 nebo 7 nařízení vlády o seznamu návykových látek a přípravky je obsahující nebo léčivé přípravky s obsahem uvedené látky kategorie 1 mohou bez povolení k zacházení","a) nabývat, pozbývat a skladovat osoby poskytující lékárenskou péči pouze pro provoz lékárny,","b) zneškodňovat, pokud nejsou skladovány, osoby oprávněné k tomu podle zvláštního zákona,","c) připravovat do lékových forem v lékárnách farmaceuti nebo farmaceutičtí asistenti pod dohledem farmaceuta.","(2) Přípravky obsahující návykové látky uvedené v příloze č. 1, 2, 5, 6 nebo 7 nařízení vlády o seznamu návykových látek a léčivé přípravky s obsahem uvedené látky kategorie 1 mohou bez povolení k zacházení","a) pouze pro poskytování zdravotních služeb nabývat, pozbývat a skladovat poskytovatelé zdravotních služeb,","b) pouze pro poskytování veterinární péče nabývat, pozbývat a skladovat fyzické nebo právnické osoby oprávněné k výkonu odborných veterinárních činností,","c) předepisovat lékaři při poskytování zdravotních služeb,","d) používat pro terapeutické účely lékaři a jiní zdravotničtí pracovníci ve zdravotnických zařízeních lůžkové a ambulantní péče a v zařízeních poskytujících pobytové sociální služby nebo lékaři, kteří mají uzavřenu smlouvu o preskripci léčivých přípravků se zdravotní pojišťovnou,","e) předepisovat a používat pro účely veterinární péče veterinární lékaři,","f) připravovat a vydávat farmaceuti v lékárně na základě lékařského předpisu,","g) přejímat v lékárnách farmaceuti nebo farmaceutičtí asistenti pod dohledem farmaceuta,","h) pro vlastní potřebu","1. nabývat, a to i v zastoupení, na základě receptu vystaveného podle zákona o léčivech (dále jen „recept“) fyzické osoby,","2. nabývat na základě vybavení poskytovatelem zdravotních služeb podle zákona o léčivech fyzické osoby,","3. nabývat v případě registrovaných léčivých přípravků s obsahem uvedené látky kategorie 1 za podmínek stanovených v rozhodnutí o registraci fyzické osoby,","4. uchovávat a používat podle vydaného receptu nebo podle pokynu lékaře fyzické osoby,","i) nabývat, a to i v zastoupení, na základě receptu veterinárního lékaře nebo nabývat od fyzické nebo právnické osoby oprávněné k výkonu veterinárních činností, uchovávat a používat podle vydaného receptu nebo podle stanovené diagnózy pro účely poskytování veterinární péče fyzické a právnické osoby,","j) nabývat, pozbývat, skladovat, přepravovat a používat zadavatelé a zkoušející při přípravě a provádění klinického hodnocení humánních léčiv podle zvláštního zákona,","k) nabývat, pozbývat, skladovat, přepravovat nebo používat zadavatelé nebo zkoušející při přípravě nebo provádění klinického hodnocení veterinárních léčiv podle zvláštního právního předpisu,","l) skladovat osoby provozující zařízení poskytující pobytové sociální služby.","(3) Povolení k zacházení se nevyžaduje při dopravě návykových látek a přípravků, uskutečňované pro osobu, která je oprávněna k zacházení s návykovými látkami a přípravky.","(4) Bez povolení k zacházení lze přepravovat v dopravních prostředcích určených k mezinárodní dopravě omezená množství přípravků obsahujících návykové látky uvedené v příloze č. 2, 6 nebo 7 nařízení vlády o seznamu návykových látek a léčivé přípravky s obsahem uvedené látky kategorie 1 pro poskytnutí první pomoci a pro naléhavé případy.","(5) Povolení k zacházení se nevyžaduje k zacházení s rostlinami technického konopí, nebo s technickým konopím, zejména k účelům průmyslovým, potravinářským, kosmetickým, technickým nebo zahradnickým.","(6) Povolení k zacházení se nevyžaduje pro činnost státních orgánů v rámci jejich působnosti, pro činnost územních samosprávných celků v rámci jejich přenesené působnosti a při zajišťování místních záležitostí veřejného pořádku v jejich samostatné působnosti a pro činnost Armády České republiky, Policie České republiky, Generální inspekce bezpečnostních sborů, Vězeňské služby České republiky a Celní správy České republiky při plnění jejich úkolů.","(7) Povolení k zacházení se nevyžaduje pro činnost právnických nebo fyzických osob, které zřizují soudně toxikologické laboratoře, laboratoře zdravotních ústavů, specializovaná diagnostická, vědecko-výzkumná a výuková pracoviště vysokých škol a specializovaná diagnostická a vědecko-výzkumná pracoviště Akademie věd České republiky, jejichž seznam stanoví Ministerstvo zdravotnictví vyhláškou. Žádost o zařazení do tohoto seznamu a žádost o změnu údajů uvedených v seznamu se podává na formuláři vydaném Ministerstvem zdravotnictví.","(8) Jakékoliv změny údajů uvedených v seznamu podle odstavce 7 je osoba zařazená v seznamu povinna neprodleně písemně sdělit Ministerstvu zdravotnictví.","(9) Povolení k zacházení se nevyžaduje pro osoby provozující lékárnu, které nabývají, pozbývají a skladují návykové látky uvedené v přílohách č. 3 a 4 nařízení vlády o seznamu návykových látek za účelem jejich dodání osobám uvedeným v odstavci 7.","(10) Návykové látky uvedené v příloze č. 3 nebo 4 nařízení vlády o seznamu návykových látek a přípravky je obsahující mohou bez povolení k zacházení zneškodňovat, pokud nejsou skladovány, osoby na základě souhlasu uděleného krajským úřadem. O udělení souhlasu informuje krajský úřad, který souhlas udělil, Ministerstvo zdravotnictví. Tato informace se podává na formuláři vydaném Ministerstvem zdravotnictví.","(11) Přípravky obsahující návykové látky uvedené v příloze č. 2, 6 nebo 7 nařízení vlády o seznamu návykových látek mohou bez povolení k zacházení vydávat farmaceutičtí asistenti v lékárně na základě žádanky vystavené lékařem podle zákona o léčivech (dále jen „žádanka“).","(12) Povolení k zacházení se nevyžaduje k přechovávání omamné látky konopí nebo jiné návykové látky získané zpracováním rostliny konopí obsahující více než 1 % látek ze skupiny tetrahydrokanabinolů fyzickými osobami staršími 21 let pro vlastní potřebu v množství nejvýše","a) 100 g ve svém domě, bytě nebo jiné prostoře sloužící k bydlení nebo příslušenství k nim náležejícímu (dále jen „obydlí“), nebo","b) 25 g mimo své obydlí.","(13) Povolení k zacházení se nevyžaduje pro pěstování, sklízení nebo zpracování rostliny konopí fyzickými osobami staršími 21 let pro vlastní potřebu v celkovém množství do 3 rostlin konopí, a to v nemovitosti, kterou vlastní nebo k níž mají jiný právní vztah."]},"167/32":{"t":"Evidence a dokumentace","h":"","b":["(1) O zacházení s návykovými látkami a přípravky, jakož i o jejich dovozu a vývozu se vede stanoveným způsobem evidence. Evidenci jsou povinny vést osoby, které uskutečňují činnosti, k nimž je třeba povolení k zacházení, vývozního povolení nebo dovozního povolení, osoby, které provozují zdravotnické zařízení, osoby, které provozují zařízení poskytující pobytové sociální služby, osoby, které poskytují veterinární péči, a osoby uvedené v § 5 odst. 6 a v § 5 odst. 7.","(2) Náležitosti a obsah evidence a dokumentace, jejich druhy, formy vedení dokumentace a způsob jejího uchovávání a ověřování stanoví Ministerstvo zdravotnictví vyhláškou."]},"240/31":{"t":"Fyzické osoby","h":"","b":["(1) Fyzická osoba pobývající na území České republiky má právo na nezbytné informace o připravovaných krizových opatřeních k ochraně jejího života, zdraví a majetku.","(2) Na výzvu příslušného orgánu krizového řízení je fyzická osoba povinna bezplatně poskytnout a aktualizovat požadované podklady uvedené v § 15 odst. 2 a další související údaje.","(3) Fyzická osoba je v době krizového stavu povinna","a) uposlechnout výzvy oprávněných orgánů krizového řízení k zaevidování na stanoveném místě z důvodu uložení pracovní povinnosti nebo pracovní výpomoci,","b) hlásit v obci, v jejímž správním obvodu bude pobývat, přechodnou změnu pobytu na základě povinného hlášení podle § 6 odst. 2 písm. a) a § 14 odst. 4 písm. f),","c) strpět omezení vyplývající z krizových opatření stanovených v době krizového stavu,","d) vykonávat uloženou pracovní povinnost nebo pracovní výpomoc,","e) poskytnout požadované věcné prostředky,","f) zdržet se činností zakázaných krizovým opatřením vydaným na základě § 6 odst. 3.","(4) Plnění povinností uvedených v odstavci 3 může fyzická osoba odmítnout, pokud by jejich plněním ohrozila život nebo zdraví vlastní nebo jiných osob anebo pokud jsou povinnosti jí ukládané v rozporu se zákonem.","(5) Obsah, rozsah a místo prací v rámci pracovní povinnosti v době nouzového stavu a stavu ohrožení státu stanoví fyzické osobě hejtman pracovním příkazem. Pracovní příkaz obsahuje jméno, popřípadě jména, příjmení, datum narození a bydliště, den a místo nástupu pracovní povinnosti, druh práce, předpokládanou délku plnění povinnosti, poučení a označení orgánu, který pracovní příkaz vydal.","(6) Ten, kdo v době krizového stavu uložil pracovní výpomoc, vydá po jejím skončení fyzické osobě potvrzení. Potvrzení obsahuje jméno, popřípadě jména, příjmení, datum narození a bydliště, den zahájení a ukončení pracovní výpomoci, počet odpracovaných hodin, druh a místo práce, poučení o náhradě a označení orgánu, který potvrzení vydal.","(7) V případě, že fyzická osoba není schopna ze zdravotních důvodů uloženou pracovní povinnost nebo pracovní výpomoc konat, doloží tuto skutečnost lékařským posudkem, který vystaví poskytovatel zdravotních služeb určený orgánem, jenž vydal pracovní příkaz nebo uložil pracovní výpomoc. Tento poskytovatel je povinen přednostně provést lékařskou prohlídku příslušné fyzické osoby a posoudit zdravotní způsobilost osoby k předpokládané práci. Úhrada nákladů vynaložených na provedení prohlídky bude vyúčtována k tíži orgánu, který vydal pracovní příkaz nebo uložil pracovní výpomoc.","(8) Při ukládání povinnosti poskytnout věcný prostředek se postupuje obdobně podle § 29 odst. 5."]},"L/6":{"t":"","h":"","b":["(1) Každý má právo na život. Lidský život je hoden ochrany již před narozením.","(2) Nikdo nesmí být zbaven života.","(3) Trest smrti se nepřipouští.","(4) Porušením práv podle tohoto článku není, jestliže byl někdo zbaven života v souvislosti s jednáním, které podle zákona není trestné. Právo bránit život svůj či život jiného člověka i se zbraní je zaručeno za podmínek, které stanoví zákon."]},"L/7":{"t":"","h":"","b":["(1) Nedotknutelnost osoby a jejího soukromí je zaručena. Omezena může být jen v případech stanovených zákonem.","(2) Nikdo nesmí být mučen ani podroben krutému, nelidskému nebo ponižujícímu zacházení nebo trestu."]},"L/31":{"t":"","h":"","b":["Každý má právo na ochranu zdraví. Občané mají na základě veřejného pojištění právo na bezplatnou zdravotní péči a na zdravotní pomůcky za podmínek, které stanoví zákon."]},"U/1":{"t":"Účel a předmět","h":"","b":["Smluvní strany budou chránit důstojnost a svébytnost všech lidských bytostí a každému bez diskriminace zaručí úctu k integritě jeho bytosti a ostatní práva a základní svobody při aplikaci biologie a medicíny.","Každá smluvní strana přijme do svého právního řádu opatření nezbytná pro zajištění účinnosti ustanovení této Úmluvy."]},"U/2":{"t":"Nadřazenost lidské bytosti","h":"","b":["Zájmy a blaho lidské bytosti jsou nadřazeny zájmům společnosti nebo vědy."]}},"S":[{"id":"souhlas","title":"Souhlas a odmítnutí péče","icon":"revers","desc":"negativní revers, informovaný souhlas, odvolání souhlasu","refs":[["372","28",[1]],["372","34",null],["372","31",[1,2]],["U","5",null]]},{"id":"nesvepravny","title":"Pacient neschopný projevit vůli","icon":"mind","desc":"bezvědomí, demence, intoxikace, zástupný souhlas","refs":[["372","34",[6,7]],["372","38",[3]],["372","33",[3]],["OZ","49",null],["U","6",null],["U","8",null]]},{"id":"nezletily","title":"Nezletilý pacient","icon":"child","desc":"zákonný zástupce, názor dítěte, neodkladná péče bez souhlasu","refs":[["372","35",null],["372","38",[4,5]],["372","31",[5]],["OZ","31",null],["U","6",null]]},{"id":"bezsouhlasu","title":"Péče a hospitalizace bez souhlasu","icon":"gavel","desc":"neodkladná péče, ohrožení sebe či okolí, oznámení soudu","refs":[["372","5",[1]],["372","38",null],["372","40",null]]},{"id":"omezeni","title":"Omezovací prostředky","i /* ---------- data ---------- */
const L = LEX.laws, P = LEX.P, S = LEX.S;
const lbl = (law, u) => (L[law].art ? 'Čl. ' : '§ ') + u;
const ttl = (p) => p.t || p.h || '';
const inSit = {};   // klíč ustanovení → situace, ve kterých je
S.forEach((s) => s.refs.forEach(([l, u]) => { (inSit[l + '/' + u] = inSit[l + '/' + u] || []).push(s.id); }));
const SIDX = Object.fromEntries(S.map((s) => [s.id, s]));
const pFold = Object.fromEntries(Object.entries(P).map(([k, p]) => [k, fold(p.b.join('\n'))]));

// rozdělení textu na odstavce: každý odstavec = [řádek „(N) …“, a) …, 1. …]
function paras(b) {
  const out = []; let cur = null;
  b.forEach((line) => { const m = line.match(/^\((\d+)[a-z]?\)\s/); if (m || !cur) { cur = { n: m ? +m[1] : null, lines: [] }; out.push(cur); } cur.lines.push(line); });
  return out;
}

/* ---------- zvýraznění ---------- */
let terms = [];
function hl(text) {
  const t = esc(text);
  if (!terms.length) return t;
  const f = fold(text), marks = new Array(text.length).fill(false);
  terms.forEach((w) => { let i = 0; while ((i = f.indexOf(w, i)) !== -1) { for (let k = i; k < i + w.length; k++) marks[k] = true; i += w.length; } });
  let out = '', on = false;
  Array.from(text).forEach((ch, i) => { if (marks[i] && !on) { out += '<mark>'; on = true; } if (!marks[i] && on) { out += '</mark>'; on = false; } out += esc(ch); });
  return out + (on ? '</mark>' : '');
}
function lineHtml(line, dim) {
  let cls = '', body = line, lead = '';
  const o = line.match(/^\((\d+[a-z]?)\)\s(.*)$/);
  if (o) { cls = 'o'; lead = `<span class="on">(${o[1]})</span>`; body = o[2]; }
  else if (/^[a-z]{1,2}\)\s/.test(line)) cls = 'l1';
  else if (/^\d{1,2}\.\s/.test(line)) cls = 'l2';
  return `<p class="${cls}${dim ? ' dim' : ''}">${lead}${hl(body)}</p>`;
}

/* ---------- ustanovení (karta) ---------- */
function card(law, u, od, ctx) {
  const key = law + '/' + u, p = P[key], lw = L[law];
  const ps = paras(p.b), full = !od || ctx.full;
  const shown = full ? ps : ps.filter((x) => x.n !== null && od.includes(x.n));
  const odTxt = od && !full ? ' odst. ' + od.join(', ') : '';
  const others = (inSit[key] || []).filter((id) => id !== ctx.sit);
  return `<article class="ex" id="ex-${key.replace('/', '-')}" data-key="${key}">
    <div class="ex-h"><span class="par">${lbl(law, u)}</span>
      <div class="grow"><b>${esc(ttl(p) || lw.name)}</b><span>${esc(lw.cit)}${ttl(p) ? ' · ' + esc(lw.name) : ''}${odTxt ? ' · ' + odTxt.trim() : ''}</span></div>
      <div class="act"><button type="button" data-copy="${key}" data-od="${od && !full ? od.join(',') : ''}" aria-label="Kopírovat text">${IC_COPY}</button><a href="${lw.url}" target="_blank" rel="noopener" aria-label="Otevřít v e-Sbírce">${IC_EXT}</a></div></div>
    <div class="tx">${shown.map((x) => x.lines.map((l) => lineHtml(l)).join('')).join('')}</div>
    ${od && ps.length > shown.length ? `<button type="button" class="more" data-full="${key}">Zobrazit celé ustanovení (${ps.length} odst.)</button>` : ''}
    ${od && ctx.full ? `<button type="button" class="more" data-part="${key}">Zobrazit jen odst. ${od.join(', ')}</button>` : ''}
    ${others.length ? `<div class="also">Také v:${others.map((id) => `<button type="button" class="chip p" data-sit="${id}">${esc(SIDX[id].title)}</button>`).join('')}</div>` : ''}
  </article>`;
}

/* ---------- pohledy ---------- */
const fullSet = new Set();
let view = { t: 'home' };

function renderHome() {
  const q = $('q').value.trim();
  $('q-x').hidden = !q;
  terms = fold(q).split(/\s+/).filter((w) => w.length > 1);
  if (terms.length) { $('home').innerHTML = renderSearch(); return; }
  const cur = view.t === 'sit' ? view.id : '';
  $('home').innerHTML = `<div class="grp">Situace</div>
    <div class="tiles">${S.map((s) => `<button type="button" class="tile" data-sit="${s.id}" aria-current="${s.id === cur}"><span class="ic">${ICON[s.icon] || ''}</span><b>${esc(s.title)}</b><small>${esc(s.desc)}</small></button>`).join('')}</div>
    <div class="home-extra">
      <div class="grp">Předpisy v aplikaci</div>
      ${Object.entries(L).map(([k, l]) => `<div class="law"><div class="grow"><b>${esc(l.cit)} · ${esc(l.name)}</b><span>Znění účinné od ${czDate(l.zn)}</span>
        <div class="chips">${Object.keys(P).filter((x) => x.startsWith(k + '/')).sort((a, b) => parseInt(a.split('/')[1]) - parseInt(b.split('/')[1])).map((x) => `<button type="button" class="chip" data-p="${x}">${lbl(k, x.split('/')[1])}</button>`).join('')}</div></div>
        <a class="ext" href="${l.url}" target="_blank" rel="noopener" aria-label="Plné znění v e-Sbírce">${IC_EXT}</a></div>`).join('')}
      <p class="foot">Doslovné texty z informativních znění e-Sbírky ke dni uvedenému u předpisu. Právně závazné je znění vyhlášené ve Sbírce zákonů. Aplikace neobsahuje komentáře ani právní výklad.</p>
    </div>`;
}

function renderSearch() {
  const sits = S.filter((s) => terms.every((w) => fold(s.title + ' ' + s.desc).includes(w)));
  const cnt = (t, w) => { let n = 0, i = 0; while ((i = t.indexOf(w, i)) !== -1) { n++; i += w.length; } return n; };
  const score = (k) => { const tt = fold(ttl(P[k])); return terms.reduce((a, w) => a + cnt(pFold[k], w) + (tt.includes(w) ? 20 : 0), 0); };
  const hits = Object.keys(P).filter((k) => { const t = pFold[k] + ' ' + fold(ttl(P[k])); return terms.every((w) => t.includes(w)); }).sort((a, b) => score(b) - score(a));
  let h = '';
  if (sits.length) h += `<div class="grp">Situace</div>` + sits.map((s) => `<button type="button" class="res" data-sit="${s.id}"><div class="rh"><b>${hl(s.title)}</b></div><div class="sn">${hl(s.desc)}</div></button>`).join('');
  if (hits.length) h += `<div class="grp">Ustanovení (${hits.length})</div>` + hits.map((k) => {
    const [law, u] = k.split('/'), p = P[k];
    const line = p.b.find((l) => terms.every((w) => fold(l).includes(w))) || p.b.find((l) => terms.some((w) => fold(l).includes(w))) || p.b[0];
    const f = fold(line), i = Math.max(0, Math.min(...terms.map((w) => { const x = f.indexOf(w); return x < 0 ? 1e9 : x; })) - 60);
    const snip = (i > 0 ? '…' : '') + line.slice(i, i + 220) + (line.length > i + 220 ? '…' : '');
    return `<button type="button" class="res" data-p="${k}"><div class="rh"><b>${lbl(law, u)}${ttl(p) ? ' · ' + esc(ttl(p)) : ''}</b><span>${esc(L[law].cit)}</span></div><div class="sn">${hl(snip)}</div></button>`;
  }).join('');
  return h || `<div class="empty">Nic nenalezeno.<br>Zkus jiné slovo nebo jeho část (např. „souhlas“, „mlčenl“).</div>`;
}

function renderMain() {
  document.body.classList.toggle('det', view.t !== 'home');
  const m = $('main');
  if (view.t === 'sit') {
    const s = SIDX[view.id];
    m.innerHTML = `<button type="button" class="back" data-home>${IC_BACK}Situace</button>
      <div class="dhead"><span class="ic">${ICON[s.icon] || ''}</span><div><h2>${esc(s.title)}</h2><p>${esc(s.desc)}</p></div></div>
      ${s.refs.length > 2 ? `<div class="toc">${s.refs.map(([l, u]) => `<button type="button" class="chip p" data-jump="${l}-${u}">${lbl(l, u)} ${esc(L[l].cit.split(' ')[0])}</button>`).join('')}</div>` : '<div style="height:10px"></div>'}
      ${s.refs.map(([l, u, od]) => card(l, u, od, { sit: s.id, full: fullSet.has(s.id + ':' + l + '/' + u) })).join('')}`;
  } else if (view.t === 'p') {
    const [l, u] = view.key.split('/');
    m.innerHTML = `<button type="button" class="back" data-home>${IC_BACK}Zpět</button>${card(l, u, null, { sit: null })}`;
  } else m.innerHTML = '';
}

function go(v, push = true) {
  view = v;
  const h = v.t === 'sit' ? '#s/' + v.id : v.t === 'p' ? '#p/' + v.key : '#';
  if (push && location.hash !== h) history.pushState(null, '', h);
  renderMain(); renderHome();
  window.scrollTo(0, 0); $('main').scrollTop = 0;
  if (v.t === 'p' && terms.length) setTimeout(() => { const mk = $('main').querySelector('mark'); if (mk) mk.scrollIntoView({ block: 'center' }); }, 30);
}
function fromHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h.startsWith('s/') && SIDX[h.slice(2)]) go({ t: 'sit', id: h.slice(2) }, false);
  else if (h.startsWith('p/') && P[h.slice(2)]) go({ t: 'p', key: h.slice(2) }, false);
  else go({ t: 'home' }, false);
}
addEventListener('popstate', fromHash);

/* ---------- události ---------- */
document.addEventListener('click', (e) => {
  const t = e.target.closest('button, a'); if (!t) return;
  if (t.dataset.sit) { go({ t: 'sit', id: t.dataset.sit }); return; }
  if (t.dataset.p) { go({ t: 'p', key: t.dataset.p }); return; }
  if (t.hasAttribute('data-home')) { if (history.length > 1 && location.hash) history.back(); else go({ t: 'home' }); return; }
  if (t.dataset.jump) { const el = $('ex-' + t.dataset.jump); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  if (t.dataset.full || t.dataset.part) {
    const k = view.id + ':' + (t.dataset.full || t.dataset.part);
    if (t.dataset.full) fullSet.add(k); else fullSet.delete(k);
    const y = t.closest('.ex').getBoundingClientRect().top;
    renderMain();
    const el = $('ex-' + (t.dataset.full || t.dataset.part).replace('/', '-'));
    if (el) window.scrollBy(0, el.getBoundingClientRect().top - y);
    return;
  }
  if (t.dataset.copy !== undefined && t.dataset.copy) {
    const [law, u] = t.dataset.copy.split('/'), p = P[t.dataset.copy], od = t.dataset.od ? t.dataset.od.split(',').map(Number) : null;
    const ps = paras(p.b).filter((x) => !od || od.includes(x.n));
    const head = `${lbl(law, u)}${od ? ' odst. ' + od.join(', ') : ''} ${L[law].cit} (${L[law].name}), znění účinné od ${czDate(L[law].zn)}`;
    const txt = head + '\n' + ps.map((x) => x.lines.join('\n')).join('\n');
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast('Zkopírováno'), () => toast('Kopírování se nepodařilo'));
  }
});
let qT = null;
$('q').addEventListener('input', () => { clearTimeout(qT); qT = setTimeout(renderHome, 120); });
$('q').addEventListener('keydown', (e) => { if (e.key === 'Enter') e.target.blur(); });
$('q-x').onclick = () => { $('q').value = ''; renderHome(); if (view.t !== 'home') renderMain(); $('q').focus(); };

let toastT = null;
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 1800); }

try { const t = localStorage.getItem('resqlex:theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
$('b-theme').onclick = () => {
  const c = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const n = c === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = n; try { localStorage.setItem('resqlex:theme', n); } catch (e) {}
};
fromHash();
</script>
</body>
</html>
