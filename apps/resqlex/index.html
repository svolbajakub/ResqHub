<style>
/* ResqLex – legislativa pro zdravotnickou záchrannou službu. Vzhled sladěný s ResqHubem. */
:root {
  --bg: #E4EEEF; --ink: #0A1F23; --ink-2: rgba(10, 31, 35, .6); --ink-3: rgba(10, 31, 35, .36);
  --petrol: #0B6E79; --petrol-soft: rgba(11, 110, 121, .12); --on-petrol: #FFFFFF;
  --warn: #B26A00; --warn-soft: rgba(242, 154, 31, .17);
  --crit: #D0303A; --crit-soft: rgba(229, 56, 59, .14);
  --glow-a: rgba(11, 110, 121, .5); --glow-b: rgba(53, 194, 196, .4);
  --glass: rgba(255, 255, 255, .6); --glass-strong: rgba(250, 253, 253, .96);
  --glass-edge: rgba(255, 255, 255, .8); --glass-hi: rgba(255, 255, 255, .95); --glass-shadow: rgba(6, 55, 62, .13);
  --hairline: rgba(10, 31, 35, .1); --fill: rgba(10, 31, 35, .06);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", Roboto, sans-serif;
  --font-round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #03141A; --ink: #EAF6F7; --ink-2: rgba(234, 246, 247, .64); --ink-3: rgba(234, 246, 247, .34);
    --petrol: #3CC0CB; --petrol-soft: rgba(60, 192, 203, .14); --on-petrol: #03141A;
    --warn: #FFB45E; --warn-soft: rgba(255, 169, 77, .15); --crit: #FF6B6E; --crit-soft: rgba(255, 107, 110, .16);
    --glow-a: rgba(11, 110, 121, .6); --glow-b: rgba(28, 157, 163, .3);
    --glass: rgba(255, 255, 255, .075); --glass-strong: rgba(22, 38, 43, .97);
    --glass-edge: rgba(255, 255, 255, .13); --glass-hi: rgba(255, 255, 255, .15); --glass-shadow: rgba(0, 0, 0, .45);
    --hairline: rgba(255, 255, 255, .1); --fill: rgba(255, 255, 255, .08);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #03141A; --ink: #EAF6F7; --ink-2: rgba(234, 246, 247, .64); --ink-3: rgba(234, 246, 247, .34);
  --petrol: #3CC0CB; --petrol-soft: rgba(60, 192, 203, .14); --on-petrol: #03141A;
  --warn: #FFB45E; --warn-soft: rgba(255, 169, 77, .15); --crit: #FF6B6E; --crit-soft: rgba(255, 107, 110, .16);
  --glow-a: rgba(11, 110, 121, .6); --glow-b: rgba(28, 157, 163, .3);
  --glass: rgba(255, 255, 255, .075); --glass-strong: rgba(22, 38, 43, .97);
  --glass-edge: rgba(255, 255, 255, .13); --glass-hi: rgba(255, 255, 255, .15); --glass-shadow: rgba(0, 0, 0, .45);
  --hairline: rgba(255, 255, 255, .1); --fill: rgba(255, 255, 255, .08);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { position: relative; isolation: isolate; min-height: 100vh; overflow-x: hidden; font-family: var(--font); font-size: 17px; line-height: 1.3; -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
svg { display: block; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--petrol); outline-offset: 2px; border-radius: 12px; }
.ambient { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
.ambient::before, .ambient::after { content: ""; position: absolute; border-radius: 50%; filter: blur(60px); }
.ambient::before { width: 130vw; height: 60vh; left: -40vw; top: -30vh; background: var(--glow-a); }
.ambient::after { width: 90vw; height: 44vh; right: -42vw; top: 6vh; background: var(--glow-b); }
.glass { background: var(--glass); -webkit-backdrop-filter: blur(26px) saturate(180%); backdrop-filter: blur(26px) saturate(180%); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-hi), 0 10px 30px -12px var(--glass-shadow); }

/* ---- ResqLex ---- */
html { touch-action: manipulation; }
.wrap { max-width: 1180px; margin: 0 auto; padding: max(12px, var(--st)) 14px calc(60px + var(--sb)); }
.head { display: flex; align-items: center; gap: 8px; padding: 6px 2px 12px; }
.head h1 { margin: 0; font-family: var(--font-display); font-size: 32px; font-weight: 800; letter-spacing: -.04em; line-height: 1; flex: 1; }
.round { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; flex: none; color: var(--ink); }
.round svg { width: 20px; height: 20px; }

.search { display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 8px 0 14px; border-radius: 16px; margin-bottom: 14px; }
.search > svg { width: 18px; height: 18px; color: var(--ink-3); flex: none; }
.search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 16.5px; }
.search input::-webkit-search-cancel-button { display: none; }
.search .clr { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2); background: var(--fill); }
.search .clr svg { width: 14px; height: 14px; }
.grp { font-size: 13px; font-weight: 750; color: var(--ink-2); text-transform: uppercase; letter-spacing: .05em; margin: 18px 4px 8px; }
.grp:first-child { margin-top: 2px; }

/* dlaždice */
.tiles { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 620px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 980px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tile { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; min-height: 128px; padding: 14px; border-radius: 22px; text-align: left; background: var(--glass-strong); border: 1px solid var(--glass-edge); box-shadow: 0 8px 24px -14px var(--glass-shadow); }
.tile .ic { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; background: var(--petrol-soft); color: var(--petrol); flex: none; }
.tile .ic svg { width: 22px; height: 22px; }
.tile b { font-size: 16px; font-weight: 750; line-height: 1.2; letter-spacing: -.01em; }
.tile small { font-size: 12.5px; color: var(--ink-2); line-height: 1.3; margin-top: -4px; }
.tile:active { transform: scale(.98); }

/* předpisy */
.law { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 18px; margin-bottom: 8px; background: var(--glass-strong); border: 1px solid var(--glass-edge); }
.law .grow { flex: 1; min-width: 0; }
.law b { display: block; font-size: 15.5px; font-weight: 750; }
.law span { display: block; font-size: 13px; color: var(--ink-2); margin-top: 2px; }
.law .chips { margin-top: 8px; }
.ext { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; color: var(--petrol); background: var(--petrol-soft); flex: none; }
.ext svg { width: 18px; height: 18px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { height: 30px; padding: 0 10px; border-radius: 10px; background: var(--fill); font-size: 13.5px; font-weight: 650; white-space: nowrap; }
.chip.p { background: var(--petrol-soft); color: var(--petrol); }

/* detail */
.dhead { display: flex; align-items: flex-start; gap: 10px; margin: 2px 0 6px; }
.dhead .ic { width: 46px; height: 46px; border-radius: 15px; display: grid; place-items: center; background: var(--petrol); color: var(--on-petrol); flex: none; }
.dhead .ic svg { width: 24px; height: 24px; }
.dhead h2 { margin: 0; font-family: var(--font-display); font-size: 26px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; }
.dhead p { margin: 4px 0 0; font-size: 14px; color: var(--ink-2); }
.back { display: inline-flex; align-items: center; gap: 4px; height: 38px; padding: 0 12px 0 8px; border-radius: 19px; font-weight: 650; font-size: 15px; color: var(--petrol); margin: 0 0 6px -4px; }
.back svg { width: 18px; height: 18px; }
.toc { display: flex; gap: 6px; overflow-x: auto; margin: 10px -14px 12px; padding: 2px 14px 4px; scrollbar-width: none; }
.toc::-webkit-scrollbar { display: none; }

.ex { border-radius: 22px; padding: 14px 16px 12px; margin-bottom: 12px; background: var(--glass-strong); border: 1px solid var(--glass-edge); box-shadow: 0 8px 24px -16px var(--glass-shadow); scroll-margin-top: 12px; }
.ex-h { display: flex; align-items: flex-start; gap: 10px; }
.par { font-family: var(--font-round); font-weight: 800; font-size: 17px; padding: 5px 10px; border-radius: 11px; background: var(--petrol); color: var(--on-petrol); white-space: nowrap; flex: none; line-height: 1.1; }
.ex-h .grow { flex: 1; min-width: 0; }
.ex-h b { display: block; font-size: 16px; font-weight: 750; line-height: 1.25; }
.ex-h span { display: block; font-size: 12.5px; color: var(--ink-2); margin-top: 2px; }
.ex-h .act { display: flex; gap: 4px; flex: none; }
.ex-h .act button, .ex-h .act a { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; color: var(--ink-2); background: var(--fill); }
.ex-h .act svg { width: 17px; height: 17px; }
.tx { margin-top: 10px; font-size: 15.5px; line-height: 1.5; }
.tx p { margin: 0 0 6px; }
.tx p.o { margin-top: 8px; }
.tx p.o:first-child { margin-top: 0; }
.tx .on { font-family: var(--font-round); font-weight: 800; color: var(--petrol); margin-right: 4px; }
.tx p.l1 { padding-left: 22px; text-indent: -20px; }
.tx p.l2 { padding-left: 44px; text-indent: -20px; }
.tx p.dim { opacity: .45; }
.tx mark { background: rgba(255, 196, 0, .4); color: inherit; border-radius: 3px; padding: 0 1px; }
.more { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 11px; background: var(--fill); font-size: 13.5px; font-weight: 650; color: var(--petrol); margin-top: 4px; }
.also { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--hairline); font-size: 12.5px; color: var(--ink-2); }

/* výsledky hledání */
.res { display: block; width: 100%; text-align: left; padding: 12px 14px; border-radius: 18px; margin-bottom: 8px; background: var(--glass-strong); border: 1px solid var(--glass-edge); }
.res .rh { display: flex; align-items: baseline; gap: 8px; }
.res .rh b { font-size: 15.5px; font-weight: 750; }
.res .rh span { font-size: 12.5px; color: var(--ink-2); }
.res .sn { font-size: 14px; line-height: 1.45; color: var(--ink-2); margin-top: 4px; }
mark { background: rgba(255, 196, 0, .4); color: inherit; border-radius: 3px; padding: 0 1px; }
.res .sn mark { background: rgba(255, 196, 0, .4); color: var(--ink); border-radius: 3px; padding: 0 1px; }
.empty { text-align: center; color: var(--ink-2); padding: 30px 10px; font-size: 15px; }

.foot { font-size: 12.5px; color: var(--ink-3); line-height: 1.45; margin: 22px 4px 0; }
.toast { position: fixed; left: 50%; bottom: calc(24px + var(--sb)); transform: translate(-50%, 20px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 14px; font-size: 14.5px; font-weight: 650; opacity: 0; pointer-events: none; transition: .2s; z-index: 50; max-width: calc(100vw - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (min-width: 900px) {
  .layout { display: grid; gap: 18px; grid-template-columns: 330px minmax(0, 1fr); align-items: start; }
  .side { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; padding-right: 2px; }
  body.det .home-extra { display: none; }
  body.det .tiles { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  body.det .tile { flex-direction: row; align-items: center; min-height: 0; padding: 9px 12px; border-radius: 16px; gap: 10px; }
  body.det .tile .ic { width: 32px; height: 32px; border-radius: 10px; }
  body.det .tile .ic svg { width: 18px; height: 18px; }
  body.det .tile small { display: none; }
  body.det .tile b { font-size: 14.5px; }
  body.det .tile[aria-current="true"] { background: var(--petrol); border-color: var(--petrol); color: var(--on-petrol); }
  body.det .tile[aria-current="true"] .ic { background: rgba(255, 255, 255, .2); color: inherit; }
  body:not(.det) .layout { grid-template-columns: minmax(0, 1fr); }
  body:not(.det) .main { display: none; }
  .back { display: none; }
}
@media (max-width: 899px) {
  body.det .side { display: none; }
  body:not(.det) .main { display: none; }
}
@media print {
  .side, .head, .back, .ex-h .act, .more, .also, .ambient { display: none !important; }
  .ex { break-inside: avoid; box-shadow: none; }
}
</style>
</head>

const LEX = {"laws":{"372":{"cit":"372/2011 Sb.","name":"Zákon o zdravotních službách","zn":"2026-07-01","url":"https://e-sbirka.gov.cz/sb/2011/372","art":false},"374":{"cit":"374/2011 Sb.","name":"Zákon o zdravotnické záchranné službě","zn":"2024-01-01","url":"https://e-sbirka.gov.cz/sb/2011/374","art":false},"240v":{"cit":"240/2012 Sb.","name":"Vyhláška, kterou se provádí zákon o ZZS","zn":"2012-08-03","url":"https://e-sbirka.gov.cz/sb/2012/240","art":false},"55":{"cit":"55/2011 Sb.","name":"Vyhláška o činnostech zdravotnických pracovníků","zn":"2025-01-01","url":"https://e-sbirka.gov.cz/sb/2011/55","art":false},"444":{"cit":"444/2024 Sb.","name":"Vyhláška o zdravotnické dokumentaci","zn":"2025-01-01","url":"https://e-sbirka.gov.cz/sb/2024/444","art":false},"297":{"cit":"297/2012 Sb.","name":"Vyhláška o Listu o prohlídce zemřelého","zn":"2016-01-01","url":"https://e-sbirka.gov.cz/sb/2012/297","art":false},"96":{"cit":"96/2004 Sb.","name":"Zákon o nelékařských zdravotnických povoláních","zn":"2026-01-01","url":"https://e-sbirka.gov.cz/sb/2004/96","art":false},"TZ":{"cit":"40/2009 Sb.","name":"Trestní zákoník","zn":"2026-01-01","url":"https://e-sbirka.gov.cz/sb/2009/40","art":false},"OZ":{"cit":"89/2012 Sb.","name":"Občanský zákoník","zn":"2026-01-01","url":"https://e-sbirka.gov.cz/sb/2012/89","art":false},"L":{"cit":"2/1993 Sb.","name":"Listina základních práv a svobod","zn":"2021-10-01","url":"https://e-sbirka.gov.cz/sb/1993/2","art":true},"U":{"cit":"96/2001 Sb. m. s.","name":"Úmluva o lidských právech a biomedicíně","zn":"2001-10-01","url":"https://www.zakonyprolidi.cz/ms/2001-96","art":true},"361":{"cit":"361/2000 Sb.","name":"Zákon o silničním provozu","zn":"2026-01-01","url":"https://e-sbirka.gov.cz/sb/2000/361","art":false},"273":{"cit":"273/2008 Sb.","name":"Zákon o Policii České republiky","zn":"2026-06-12","url":"https://e-sbirka.gov.cz/sb/2008/273","art":false},"239":{"cit":"239/2000 Sb.","name":"Zákon o integrovaném záchranném systému","zn":"2025-08-19","url":"https://e-sbirka.gov.cz/sb/2000/239","art":false},"240":{"cit":"240/2000 Sb.","name":"Krizový zákon","zn":"2025-08-19","url":"https://e-sbirka.gov.cz/sb/2000/240","art":false},"167":{"cit":"167/1998 Sb.","name":"Zákon o návykových látkách","zn":"2026-01-01","url":"https://e-sbirka.gov.cz/sb/1998/167","art":false}},"P":{"372/28":{"t":"","h":"Práva pacienta","b":["(1) Zdravotní služby lze pacientovi poskytnout pouze s jeho svobodným a informovaným souhlasem, nestanoví-li tento zákon jinak.","(2) Pacient má právo na poskytování zdravotních služeb na náležité odborné úrovni.","(3) Pacient má při poskytování zdravotních služeb dále právo","a) na úctu, důstojné zacházení, na ohleduplnost a respektování soukromí při poskytování zdravotních služeb v souladu s charakterem poskytovaných zdravotních služeb,","b) zvolit si poskytovatele oprávněného k poskytnutí zdravotních služeb, které odpovídají zdravotním potřebám pacienta, a zdravotnické zařízení, pokud tento zákon nebo jiné právní předpisy nestanoví jinak,","c) vyžádat si konzultační služby od jiného poskytovatele, popřípadě zdravotnického pracovníka, než který mu poskytuje zdravotní služby; to neplatí, jde-li o poskytování neodkladné péče nebo o osoby ve výkonu vazby, trestu odnětí svobody nebo zabezpečovací detence,","d) být seznámen s vnitřním řádem zdravotnického zařízení lůžkové nebo jednodenní péče (dále jen „vnitřní řád“),","e) na","1. nepřetržitou přítomnost zákonného zástupce, popřípadě osoby určené zákonným zástupcem, pěstouna nebo jiné osoby, do jejíž péče byl pacient na základě rozhodnutí soudu nebo jiného orgánu svěřen, je-li nezletilou osobou,","2. nepřetržitou přítomnost opatrovníka, popřípadě osoby určené opatrovníkem, nebo jiné osoby, která je na základě rozhodnutí soudu oprávněna pacienta zastupovat v právním jednání vztahujícím se k poskytování zdravotních služeb, je-li pacient v tomto rozsahu zastoupen (dále jen „pacient s ustanoveným zástupcem“),","3. přítomnost podpůrce, osoby blízké nebo osoby určené pacientem, a to v souladu s jinými právními předpisy a vnitřním řádem, a nenaruší-li přítomnost těchto osob poskytnutí zdravotních služeb; to neplatí, jde-li o osoby ve výkonu vazby, trestu odnětí svobody nebo zabezpečovací detence; tím není dotčen § 47 odst. 1 písm. b),","f) být předem informován o ceně poskytovaných zdravotních služeb a služeb souvisejících s poskytovanými zdravotními službami nehrazených nebo částečně hrazených z veřejného zdravotního pojištění a o způsobu jejich úhrady, pokud to jeho zdravotní stav umožňuje,","g) znát jméno, popřípadě jména, a příjmení zdravotnických pracovníků a jiných odborných pracovníků přímo zúčastněných na poskytování zdravotních služeb a osob připravujících se u poskytovatele na výkon zdravotnického povolání, které jsou při poskytování zdravotních služeb přítomny, popřípadě provádějí činnosti, které jsou součástí výuky,","h) odmítnout přítomnost osob, které nejsou na poskytování zdravotních služeb přímo zúčastněny, a osob připravujících se na výkon povolání zdravotnického pracovníka,","i) přijímat návštěvy ve zdravotnickém zařízení lůžkové nebo jednodenní péče, a to s ohledem na svůj zdravotní stav a v souladu s vnitřním řádem a způsobem, který neporušuje práva ostatních pacientů, pokud tento zákon nebo jiný právní předpis nestanoví jinak,","j) přijímat ve zdravotnickém zařízení lůžkové nebo jednodenní péče duchovní péči a duchovní podporu (dále jen „duchovní péče“) od duchovních církví a náboženských společností registrovaných v České republice nebo od osob pověřených výkonem duchovenské činnosti (dále jen „duchovní“) v souladu s vnitřním řádem a způsobem, který neporušuje práva ostatních pacientů, a s ohledem na svůj zdravotní stav, nestanoví-li jiný právní předpis jinak; návštěvu duchovního nelze pacientovi odepřít v případech ohrožení jeho života nebo vážného poškození zdraví, nestanoví-li jiný právní předpis jinak,","k) na poskytování zdravotních služeb v co nejméně omezujícím prostředí při zajištění kvality a bezpečí poskytovaných zdravotních služeb.","(4) Pacient vykazující znaky osoby, na které bylo spácháno domácí nebo sexuální násilí, má při poskytování zdravotních služeb dále právo","a) žádat o změnu ošetřujícího zdravotnického pracovníka za předpokladu, že","1. aktuální personální možnosti poskytovatele tuto změnu umožňují,","2. touto změnou nebude ohroženo zdraví nebo život pacienta a","3. tato změna nenaruší poskytování zdravotních služeb,","b) na poskytnutí informací o dostupné sociální, psychologické a právní pomoci.","O uplatnění práva podle písmene a) se provede záznam ve zdravotnické dokumentaci pacienta.","(5) Pacient s ustanoveným zástupcem nebo který je nezletilý, může požadovat, aby při poskytování zdravotních služeb nebyla přítomna osoba podle odstavce 3 písm. e), uvádí-li, že jde o osobu, která se na něm dopouští domácího nebo sexuálního násilí nebo jej jinak týrá, zneužívá nebo zanedbává. V tomto případě se postupuje podle § 35 odst. 5.","(6) Práva pacienta uvedená v odstavci 3 písm. c), e), i) a j) nemůže uplatnit pacient, kterému je poskytována záchytná služba nebo který je povinen se podrobit odbornému lékařskému vyšetření podle zákona o ochraně zdraví před škodlivými účinky návykových látek. Tento pacient rovněž nemůže při uplatňování práva podle odstavce 3 písm. h) odmítnout přítomnost příslušníka Policie České republiky, příslušníka Vojenské policie, strážníka obecní policie nebo příslušníka Vězeňské služby České republiky (dále jen „Vězeňská služba“), který na žádost poskytovatele poskytuje součinnost při poskytování záchytné služby nebo při vyšetření podle věty první.","(7) V případě poskytování zdravotních služeb osobám ve výkonu vazby, trestu odnětí svobody nebo zabezpečovací detence a osobám omezeným na svobodě podle zákona o Policii České republiky může být právo pacienta na důvěrnost a respektování soukromí uvedené v odstavci 3 písm. a) a právo odmítnout přítomnost třetích osob uvedené v odstavci 3 písm. h) omezeno dozorem příslušníka Vězeňské služby nebo Policie České republiky (dále jen „příslušník“), pokud je to nezbytné kvůli důvodným obavám z útěku nebo o bezpečnost osob zúčastněných na poskytování zdravotních služeb nebo pacienta a hrozbu nelze odvrátit jinak. Uplatnění dozoru a jeho intenzita musí být přiměřené danému nebezpečí a podmínkám poskytování služby. Případný dozor a jeho formu stanoví příslušník ve spolupráci se zdravotnickým pracovníkem. O uplatnění dozoru a jeho formě se provede záznam ve zdravotnické dokumentaci pacienta.","(8) Poskytovatel nesmí požadovat platbu za přítomnost některé z osob podle odstavce 3 písm. e). Poskytovatel dále nesmí podmiňovat umožnění přítomnosti těchto osob platbou za jiné plnění. Tím není dotčena možnost, aby poskytovatel požadoval úhradu účelně vynaložených nákladů v souvislosti s přítomností některé z osob podle odstavce 3 písm. e)."]},"372/34":{"t":"","h":"Poskytování zdravotních služeb se souhlasem","b":["(1) Souhlas s poskytnutím zdravotních služeb (dále jen „souhlas“) se pokládá za","a) svobodný, je-li dán bez jakéhokoliv nátlaku,","b) informovaný, je-li pacientovi před vyslovením souhlasu podána informace podle § 31; souhlas se pokládá za informovaný také v případě, že se pacient podle § 32 odst. 1 podání informace vzdal.","(2) Písemná forma souhlasu se vyžaduje, pokud tak stanoví jiný právní předpis nebo pokud tak s ohledem na charakter poskytovaných zdravotních služeb určí poskytovatel. Souhlas s hospitalizací musí být vždy v písemné formě. Na vyžádání je pacientovi poskytnuta kopie písemné formy souhlasu.","(3) Pacientovi, kterému byla podána informace o zdravotním stavu nebo se podání informace podle § 32 odst. 1 vzdal a který odmítá vyslovit souhlas s poskytnutím zdravotních služeb, nejde-li o případ, kdy lze zdravotní služby poskytnout bez souhlasu, je podána informace o jeho zdravotním stavu v rozsahu a způsobem, ze kterého je zřejmé, že neposkytnutí zdravotních služeb může vážně poškodit jeho zdraví nebo ohrozit život. Jestliže pacient i nadále odmítá vyslovit souhlas, učiní o tom písemné prohlášení (revers).","(4) Pacient může svůj souhlas s poskytnutím zdravotních služeb odvolat.","(5) Písemný souhlas, písemné odvolání souhlasu, popřípadě záznam o odvolání tohoto souhlasu, pokud pacient souhlas odvolal bez písemného vyjádření, písemné prohlášení o nesouhlasu s poskytnutím zdravotních služeb, popřípadě záznam o tomto nesouhlasu, pokud pacient odmítá učinit písemné prohlášení, je součástí zdravotnické dokumentace vedené o pacientovi; podepíše je pacient a zdravotnický pracovník. Odmítá-li pacient záznam podle věty první podepsat, zdravotnický pracovník tuto skutečnost do záznamu doplní; záznam podepíše zdravotnický pracovník a svědek.","(6) Jestliže zdravotní stav pacienta nedovoluje vyjádření souhlasu, odvolání souhlasu nebo vyslovení nesouhlasu s poskytnutím zdravotních služeb požadovaným způsobem, zdravotnický pracovník zaznamená nepochybný projev vůle pacienta do zdravotnické dokumentace o něm vedené, uvede způsob, jakým pacient svou vůli projevil, a zdravotní důvody bránící pacientovi ve vyjádření požadovaným způsobem; záznam podepíše zdravotnický pracovník a svědek.","(7) Jestliže pacient nemůže s ohledem na svůj zdravotní stav vyslovit souhlas s poskytováním zdravotních služeb, a nejde-li o zdravotní služby, které lze poskytnout bez souhlasu, vyžaduje se souhlas osoby určené pacientem podle § 33 odst. 1, není-li takové osoby nebo není-li dosažitelná, manžela nebo registrovaného partnera, není-li takové osoby nebo není-li dosažitelná, vyžaduje se souhlas jiné svéprávné osoby blízké, pokud je známa."]},"372/31":{"t":"","h":"Informace o zdravotním stavu pacienta a o navržených zdravotních službách","b":["(1) Poskytovatel je povinen","a) zajistit, aby byl pacient srozumitelným způsobem v dostatečném rozsahu informován o svém zdravotním stavu a o navrženém individuálním léčebném postupu a všech jeho změnách (dále jen „informace o zdravotním stavu“),","b) umožnit pacientovi nebo osobě určené pacientem klást doplňující otázky vztahující se k jeho zdravotnímu stavu a navrhovaným zdravotním službám, které musí být srozumitelně zodpovězeny.","(2) Informace o zdravotním stavu podle odstavce 1 obsahuje údaje o","a) příčině a původu nemoci, jsou-li známy, jejím stadiu a předpokládaném vývoji,","b) účelu, povaze, předpokládaném přínosu, možných důsledcích a rizicích navrhovaných zdravotních služeb, včetně jednotlivých zdravotních výkonů,","c) jiných možnostech poskytnutí zdravotních služeb, jejich vhodnosti, přínosech a rizicích pro pacienta,","d) další potřebné léčbě,","e) omezeních a doporučeních ve způsobu života s ohledem na zdravotní stav a","f) možnosti","1. vzdát se podání informace o zdravotním stavu podle § 32 a","2. určit osoby podle § 32 a 33 nebo vyslovit zákaz o podávání informací o zdravotním stavu podle § 33. Informace o zdravotním stavu je pacientovi sdělena při přijetí do péče a dále vždy, je-li to s ohledem na poskytované zdravotní služby nebo zdravotní stav pacienta účelné.","(3) Informaci o zdravotním stavu podává ošetřující zdravotnický pracovník způsobilý k poskytování zdravotních služeb, kterých se podání informace týká; ošetřující zdravotnický pracovník provede do zdravotnické dokumentace záznam o tom, že byla informace podána.","(4) Informace o zdravotním stavu se nepodá pacientovi, který v důsledku svého zdravotního stavu není schopen poskytované informace vůbec vnímat. Informace se pacientovi podá, jakmile to jeho zdravotní stav dovolí.","(5) Jde-li o nezletilého pacienta nebo pacienta s ustanoveným zástupcem, právo na informace o zdravotním stavu a právo klást otázky náleží osobám uvedeným v § 28 odst. 3 písm. e) bodech 1 a 2 a pacientovi, je-li k takovému úkonu přiměřeně rozumově a volně vyspělý.","(6) Jestliže to zdravotní stav nebo povaha onemocnění pacienta vyžadují, je poskytovatel oprávněn sdělit osobám, které budou o pacienta osobně pečovat, informace, které jsou nezbytné k zajištění této péče nebo pro ochranu jejich zdraví."]},"U/5":{"t":"Obecné pravidlo","h":"","b":["Jakýkoli zákrok v oblasti péče o zdraví je možno provést pouze za podmínky, že k němu dotčená osoba poskytla svobodný a informovaný souhlas.","Tato osoba musí být předem řádně informována o účelu a povaze zákroku, jakož i o jeho důsledcích a rizicích.","Dotčená osoba může kdykoli svobodně svůj souhlas odvolat."]},"372/38":{"t":"","h":"Hospitalizace pacienta a poskytování zdravotních služeb bez souhlasu a použití omezovacích prostředků","b":["(1) Pacienta lze bez souhlasu hospitalizovat, jestliže","a) mu","1. bylo pravomocným rozhodnutím soudu uloženo ochranné léčení formou lůžkové péče,","2. je nařízena izolace, karanténa nebo léčení podle zákona o ochraně veřejného zdraví,","3. je podle trestního řádu nebo zákona o zvláštních řízeních soudních nařízeno vyšetření zdravotního stavu,","b) bezprostředně a závažným způsobem ohrožuje sebe nebo své okolí a jeví známky duševní poruchy nebo touto poruchou trpí nebo je pod vlivem návykové látky, pokud tuto hrozbu nelze odvrátit jinak, nebo","c) jeho zdravotní stav vyžaduje poskytnutí neodkladné péče a zároveň neumožňuje, aby vyslovil souhlas.","(2) Nezletilého pacienta nebo pacienta s ustanoveným zástupcem lze bez souhlasu osob uvedených v § 28 odst. 3 písm. e) bodech 1 a 2 hospitalizovat též v případě, jde-li o podezření na domácí nebo sexuální násilí nebo jiné týrání, zneužívání nebo zanedbávání.","(3) Pacientovi lze bez jeho souhlasu poskytnout pouze neodkladnou péči, a to v případě","a) kdy zdravotní stav neumožňuje pacientovi tento souhlas vyslovit; tím není dotčeno dříve vyslovené přání podle § 36, nebo","b) léčby vážné duševní poruchy, pokud by v důsledku jejího neléčení došlo se vší pravděpodobností k vážnému poškození zdraví pacienta.","(4) Nezletilému pacientovi nebo pacientovi s ustanoveným zástupcem lze bez souhlasu poskytnout neodkladnou péči, jde-li o","a) případy podle odstavce 3 písm. b), nebo","b) zdravotní služby nezbytné k záchraně života nebo zamezení vážného poškození zdraví.","(5) Nezletilému pacientovi nebo pacientovi s ustanoveným zástupcem lze poskytnout neodkladnou péči bez souhlasu osob uvedených v § 28 odst. 3 písm. e) bodech 1 a 2, pokud je u něj podezření na domácí nebo sexuální násilí nebo jiné týrání, zneužívání nebo zanedbávání.","(6) Poskytovatel je povinen o hospitalizaci podle odstavce 1 písm. b) nebo c) informovat osoby uvedené v § 28 odst. 3 písm. e) bodech 1 a 2 nebo podpůrce a osobu určenou podle § 33. Není-li žádné takové osoby nebo žádnou takovou osobu nelze zastihnout, poskytovatel je povinen informovat některou z osob blízkých, popřípadě osobu ze společné domácnosti, pokud jsou mu známy. Není-li takových osob nebo je nelze zastihnout, informuje Policii České republiky.","(7) Bez souhlasu lze poskytnout též jiné zdravotní služby, stanoví-li tak zákon o ochraně veřejného zdraví, a záchytnou službu.","(8) Bez souhlasu pacienta lze provést orientační vyšetření nebo odborné lékařské vyšetření za účelem zjištění přítomnosti alkoholu nebo jiné návykové látky v těle, jestliže zdravotní stav neumožňuje pacientovi, aby vyslovil souhlas."]},"372/33":{"t":"","h":"","b":["(1) Pacient může při přijetí do péče určit osoby, které mohou být informovány o jeho zdravotním stavu, a současně může určit, zda tyto osoby mohou nahlížet do zdravotnické dokumentace o něm vedené nebo do jiných zápisů vztahujících se k jeho zdravotnímu stavu, pořizovat si výpisy nebo kopie těchto dokumentů a zda mohou v případech podle § 34 odst. 7 vyslovit souhlas nebo nesouhlas s poskytnutím zdravotních služeb. Pacient může určit osoby nebo vyslovit zákaz poskytovat informace o zdravotním stavu kterékoliv osobě kdykoliv po přijetí do péče, rovněž může určení osoby nebo vyslovení zákazu poskytovat informace o zdravotním stavu kdykoliv odvolat. Pacient může dále určit osoby, které v případech podle § 34 odst. 7 nemohou vyslovit souhlas nebo nesouhlas s poskytnutím zdravotních služeb. Záznam o vyjádření pacienta je součástí zdravotnické dokumentace o něm vedené; záznam podepíše pacient a zdravotnický pracovník. Součástí záznamu je rovněž sdělení pacienta, jakým způsobem mohou být informace o jeho zdravotním stavu sdělovány.","(2) Zákaz podávání informací o zdravotním stavu vyslovený pacientem se nepoužije na podávání informací, popřípadě na sdělování údajů, které mohou být sděleny bez souhlasu pacienta podle tohoto zákona nebo jiných právních předpisů.","(3) Jde-li o pacienta, který nemůže s ohledem na svůj zdravotní stav určit osoby podle odstavce 1, mají právo na informace o jeho aktuálním zdravotním stavu a na pořízení výpisů a kopií zdravotnické dokumentace vedené o pacientovi osoby uvedené v § 28 odst. 3 písm. e) bodech 1 a 2. Není-li takových osob, právo na tyto informace mají osoby blízké. Pokud pacient dříve vyslovil zákaz sdělovat informace o svém zdravotním stavu určitým osobám blízkým, lze informaci těmto osobám podat pouze v případě, že je to v zájmu ochrany jejich zdraví nebo ochrany zdraví další osoby, a to pouze v nezbytném rozsahu.","(4) Osoby uvedené v § 28 odst. 3 písm. e) bodech 1 a 2 a osoby blízké zemřelému pacientovi, popřípadě další osoby určené pacientem, mají právo na informace o zdravotním stavu pacienta, který zemřel, a informace o výsledku pitvy, byla-li provedena, včetně práva nahlížet do zdravotnické dokumentace vedené o jeho osobě nebo do jiných zápisů vztahujících se k jeho zdravotnímu stavu a pořizovat z nich výpisy nebo jejich kopie. Pokud zemřelý pacient za svého života vyslovil zákaz sdělovat informace o svém zdravotním stavu určitým osobám blízkým, lze informaci těmto osobám podat pouze v případě, že je to v zájmu ochrany jejich zdraví nebo ochrany zdraví další osoby, a to pouze v nezbytném rozsahu.","(5) Právo na informace o zdravotním stavu pacienta, a to pouze v nezbytném rozsahu, mají rovněž osoby, které s pacientem přišly do styku a tyto informace jsou rozhodné pro ochranu jejich zdraví."]},"OZ/49":{"t":"","h":"Zastoupení členem domácnosti","b":["(1) Brání-li duševní porucha zletilému, který nemá jiného zástupce, samostatně právně jednat, může ho zastupovat jeho potomek, předek, sourozenec, manžel nebo partner, nebo osoba, která se zastoupeným žila před vznikem zastoupení ve společné domácnosti alespoň tři roky.","(2) Zástupce dá zastoupenému na vědomí, že ho bude zastupovat, a srozumitelně mu vysvětlí povahu a následky zastoupení. Odmítne-li to člověk, který má být zastoupen, zastoupení nevznikne; k odmítnutí postačí schopnost projevit přání."]},"U/6":{"t":"Ochrana osob neschopných dát souhlas","h":"","b":["1. Podle článků 17 a 20 uvedených níže může být proveden zákrok na osobě, která není schopna dát souhlas, pouze pokud je to k jejímu přímému prospěchu.","2. Jestliže nezletilá osoba není podle zákona způsobilá k udělení souhlasu se zákrokem, nemůže být zákrok proveden bez svolení jejího zákonného zástupce, úřední osoby či jiné osoby nebo orgánu, které jsou k tomu zmocněny zákonem.","Názor nezletilé osoby bude zohledněn jako faktor, jehož závaznost narůstá úměrně s věkem a stupněm vyspělosti.","3. Pokud podle platného práva dospělá osoba není schopna dát souhlas se zákrokem z důvodu duševního postižení, nemoci nebo z podobných důvodů, lze zákrok provést pouze se souhlasem jejího zákonného zástupce nebo příslušného orgánu nebo osoby či instituce zmocněných zákonem.","Dle možnosti se dotčená osoba zúčastní udělení zástupného souhlasu.","4. Zákonný zástupce, příslušný orgán, osoba nebo instituce pověřené ze zákona podle výše uvedených odstavců 2 a 3 obdrží na základě stejných podmínek informace uvedené v článku 5.","5. Zástupný souhlas podle výše uvedených odstavců 2 a 3 lze kdykoliv odvolat, je-li to v nejlepším zájmu dotčené osoby."]},"U/8":{"t":"Stav nouze vyžadující neodkladná řešení","h":"","b":["Pokud v situacích nouze nelze získat příslušný souhlas, jakýkoliv nutný lékařský zákrok lze provést okamžitě, pokud je nezbytný pro prospěch zdraví dotyčné osoby."]},"372/35":{"t":"","h":"","b":["(1) Při poskytování zdravotních služeb nezletilému pacientovi je třeba zjistit jeho názor na poskytnutí zamýšlených zdravotních služeb, jestliže je to přiměřené rozumové a volní vyspělosti jeho věku. Tento názor musí být zohledněn jako faktor, jehož závažnost narůstá úměrně s věkem a stupněm rozumové a volní vyspělosti nezletilého pacienta. Pro vyslovení souhlasu s poskytnutím zdravotních služeb nezletilému pacientovi se použijí právní předpisy upravující svéprávnost fyzických osob s tím, že nezletilému pacientovi lze zamýšlené zdravotní služby poskytnout na základě jeho souhlasu, jestliže je provedení takového úkonu přiměřené jeho rozumové a volní vyspělosti odpovídající jeho věku. Tím není dotčena možnost poskytování zdravotních služeb bez souhlasu.","(2) Poskytnutí zdravotních služeb na základě souhlasu nezletilého pacienta nebrání tomu, aby ošetřující zdravotnický pracovník podal zákonnému zástupci informaci o poskytnutých zdravotních službách nebo zdravotním stavu nezletilého pacienta.","(3) Jde-li o zdravotní služby, které spočívají v poskytnutí","a) neodkladné péče, která není péčí podle § 38 odst. 4, nebo","b) akutní péče, a","souhlas zákonného zástupce nelze získat bez zbytečného odkladu, rozhodne o jejich poskytnutí ošetřující zdravotnický pracovník. To neplatí, lze-li zdravotní služby poskytnout podle odstavce 1 na základě souhlasu nezletilého pacienta.","(4) Jde-li o pacienta s ustanoveným zástupcem, odstavce 1 až 3 se použijí obdobně s tím, že věk pacienta se nezohledňuje.","(5) Jde-li o pacienta uvedeného v § 28 odst. 5, poskytovatel vyloučí, má-li podezření, že na tomto pacientovi bylo spácháno domácí nebo sexuální násilí nebo že je tento pacient jinak zneužíván nebo týrán, popřípadě, že je ohrožován jeho zdravý vývoj, přítomnost osob uvedených v § 28 odst. 3 písm. e) při poskytování zdravotních služeb, pokud jde o vyšetření za účelem vyloučení známek uvedených skutečností."]},"OZ/31":{"t":"","h":"Nezletilí","b":["Má se za to, že každý nezletilý, který nenabyl plné svéprávnosti, je způsobilý k právním jednáním co do povahy přiměřeným rozumové a volní vyspělosti nezletilých jeho věku."]},"372/5":{"t":"Druhy zdravotní péče","h":"","b":["(1) Druhy zdravotní péče podle časové naléhavosti jejího poskytnutí jsou","a) neodkladná péče, jejímž účelem je zamezit nebo omezit vznik náhlých stavů, které bezprostředně ohrožují život nebo by mohly vést k náhlé smrti nebo vážnému ohrožení zdraví, nebo způsobují náhlou nebo intenzivní bolest nebo náhlé změny chování pacienta, který ohrožuje sebe nebo své okolí,","b) akutní péče, jejímž účelem je odvrácení vážného zhoršení zdravotního stavu nebo snížení rizika vážného zhoršení zdravotního stavu tak, aby byly včas zjištěny skutečnosti nutné pro stanovení nebo změnu individuálního léčebného postupu nebo aby se pacient nedostal do stavu, ve kterém by ohrozil sebe nebo své okolí,","c) nezbytná péče, kterou z lékařského hlediska vyžaduje zdravotní stav pacienta, který je zahraničním pojištěncem, s přihlédnutím k povaze dávek a k délce pobytu na území České republiky; v případě zahraničních pojištěnců z členského státu Evropské unie, Evropského hospodářského prostoru nebo Švýcarské konfederace musí být zdravotní péče poskytnuta v takovém rozsahu, aby zahraniční pojištěnec nemusel vycestovat do země pojištění dříve, než původně zamýšlel,","d) plánovaná péče, která není zdravotní péčí uvedenou v písmenech a), b) nebo c).","(2) Druhy zdravotní péče podle účelu jejího poskytnutí jsou","a) preventivní péče, jejímž účelem je včasné vyhledávání faktorů, které jsou v příčinné souvislosti se vznikem nemoci nebo zhoršením zdravotního stavu, a provádění opatření směřujících k odstraňování nebo minimalizaci vlivu těchto faktorů a předcházení jejich vzniku,","b) diagnostická péče, jejímž účelem je zjišťování zdravotního stavu pacienta a okolností, jež mají na zdravotní stav pacienta vliv, informací nutných ke zjištění nemoci, jejího stavu a závažnosti, dalších informací potřebných ke stanovení diagnózy, individuálního léčebného postupu a informací o účinku léčby,","c) dispenzární péče, jejímž účelem je aktivní a dlouhodobé sledování zdravotního stavu pacienta ohroženého nebo trpícího nemocí nebo zhoršením zdravotního stavu, u kterého lze podle vývoje nemoci důvodně předpokládat takovou změnu zdravotního stavu, jejíž včasné zjištění může zásadním způsobem ovlivnit další léčbu a vývoj nemoci,","d) léčebná péče, jejímž účelem je příznivé ovlivnění zdravotního stavu na základě realizace individuálního léčebného postupu, s cílem vyléčení nebo zmírnění důsledků nemoci a zabránění vzniku invalidity nebo nesoběstačnosti nebo zmírnění jejich rozsahu,","e) posudková péče, jejímž účelem je zjištění, zda","1. nebude stabilizovaný zdravotní stav pacienta negativně ovlivněn nároky, které na něho klade výkon práce, služby, povolání nebo jiných činností v konkrétních podmínkách, nebo","2. zdravotní stav pacienta je v souladu s předpoklady nebo požadavky stanovenými pro výkon práce, služby, povolání, jiných činností nebo pro jiné účely,","f) léčebně rehabilitační péče, jejímž účelem je","1. obnovení nebo zlepšení fyzických, poznávacích, řečových, smyslových a psychických funkcí pacienta nebo zmírnění trvalých následků jejich poškození,","2. zpomalení nebo zastavení projevů nemoci a stabilizace zdravotního stavu pacienta k dosažení potřebné míry nezávislosti a kvality života pacienta v jeho vlastním sociálním prostředí, nebo","3. zlepšení vědomí pacienta, navázání komunikace a spolupráce u pacienta s omezením vědomí nebo neuropsychiatrickým nebo kognitivním deficitem vzniklým v důsledku mozkového poškození; v případě, že jsou při poskytování léčebně rehabilitační péče využívány přírodní léčivé zdroje nebo klimatické podmínky příznivé k léčení podle lázeňského zákona, jde o lázeňskou léčebně rehabilitační péči,","g) ošetřovatelská péče, jejímž účelem je udržení, podpora a navrácení zdraví a uspokojování biologických, psychických a sociálních potřeb změněných nebo vzniklých v souvislosti s poruchou zdravotního stavu jednotlivců nebo skupin nebo v souvislosti s těhotenstvím a porodem, a dále rozvoj, zachování nebo navrácení soběstačnosti; její součástí je péče o nevyléčitelně nemocné, zmírňování jejich utrpení a zajištění klidného umírání a důstojné přirozené smrti,","h) paliativní péče, jejímž účelem je zmírnění utrpení a zachování kvality života pacienta, který trpí nevyléčitelnou nemocí,","i) farmaceutická péče, kterou se rozumí zejména péče lékárenská a klinickofarmaceutická (dále jen „farmaceutická péče“), jejímž účelem je maximalizace účinku a minimalizace rizik farmakoterapie, směřující ke zlepšení kvality života pacienta; farmaceutická péče sestává zejména ze zajišťování, přípravy, úpravy, uchovávání, kontroly jakosti, výdeje léčivých přípravků s výjimkou transfuzních přípravků a surovin pro výrobu krevních derivátů podle zákona o léčivech, zajišťování, uchovávání, výdeje a prodeje potravin pro zvláštní lékařské účely a zdravotnických prostředků a diagnostických zdravotnických prostředcích in vitro; dále je farmaceutickou péčí optimalizace farmakoterapie pacienta včetně hodnocení vlivu farmakoterapie na diagnostické metody, posuzování a kontrola účelného, bezpečného a hospodárného užívání léčivých přípravků a používání zdravotnických prostředků, konzultační a konziliární činnosti a poradenství; je-li farmaceutická péče poskytována v lékárně, jedná se o lékárenskou péči.","(3) Prováděcí právní předpis stanoví","a) druhy, obsah a časové rozmezí preventivních prohlídek, okruhy osob, kterým jsou jednotlivé druhy preventivních prohlídek poskytovány, a okruhy poskytovatelů, kteří preventivní prohlídky provádějí,","b) nemoci, u nichž se poskytuje dispenzární péče, časové rozmezí prováděných prohlídek a okruhy poskytovatelů provádějících dispenzární péči."]},"372/40":{"t":"","h":"","b":["(1) Poskytovatel oznámí soudu do 24 hodin","a) hospitalizaci pacienta podle § 38 odst. 1 písm. b) a c); obdobně se postupuje, jestliže souhlas udělila některá z osob uvedených v § 28 odst. 3 písm. e) bodech 1 a 2 a pacient hospitalizaci vážně odporuje nebo jestliže byl souhlas s hospitalizací odvolán a nadále existují důvody pro hospitalizaci bez souhlasu,","b) dodatečné omezení pacienta, který byl hospitalizován na základě souhlasu, ve volném pohybu podle § 39 odst. 1 písm. b) až f) nebo styku s vnějším světem až v průběhu léčení.","(2) Hospitalizace podle odstavce 1 písm. a) a dodatečné omezení pacienta se soudu neoznamuje, jestliže byl souhlas ve lhůtě do 24 hodin od indikace hospitalizace nebo dodatečného omezení prokazatelným způsobem dodatečně vysloven."]},"372/39":{"t":"","h":"","b":["(1) K omezení volného pohybu pacienta při poskytování zdravotních služeb lze použít","a) úchop pacienta zdravotnickými pracovníky nebo jinými osobami k tomu určenými poskytovatelem,","b) omezení pacienta v pohybu ochrannými pásy nebo kurty,","c) umístění pacienta v místnosti určené k bezpečnému pohybu,","d) ochranný kabátek nebo vestu zamezující pohybu horních končetin pacienta,","e) psychofarmaka, popřípadě jiné léčivé přípravky, které jsou podány pacientovi za účelem zvládnutí chování pacienta proti jeho vůli nebo silou, nebo","f) kombinaci prostředků uvedených v písmenech a) až e),","(dále jen „omezovací prostředky“).","(2) Omezovací prostředky lze použít","a) pouze tehdy, je-li účelem jejich použití odvrácení bezprostředního ohrožení života, zdraví nebo bezpečnosti pacienta nebo jiných osob,","b) pouze po dobu, po kterou trvají důvody jejich použití podle písmene a) a","c) poté, co byl neúspěšně použit mírnější postup, než je použití omezovacích prostředků, s výjimkou případu, kdy použití mírnějšího postupu by zjevně nevedlo k dosažení účelu podle písmene a), přičemž musí být zvolen nejméně omezující prostředek odpovídající účelu jeho použití.","(3) Poskytovatel je povinen zajistit, aby","a) pacient, u kterého je omezovací prostředek použit, byl s ohledem na jeho zdravotní stav srozumitelně informován o důvodech použití omezovacího prostředku,","b) byly o použití omezovacích prostředků uvedených v odstavci 1 písm. b), c), d) nebo e) bez zbytečného odkladu informovány osoby uvedené v § 28 odst. 3 písm. e) bodech 1 a 2; podání informace těmto osobám se zaznamená do zdravotnické dokumentace vedené o pacientovi, včetně času a způsobu jejího podání,","c) pacient po dobu použití omezovacího prostředku byl pod dohledem zdravotnických pracovníků; dohled musí odpovídat závažnosti zdravotního stavu pacienta a zároveň musí být přijata taková opatření, která zabrání poškození zdraví pacienta,","d) použití omezovacího prostředku indikoval vždy lékař; ve výjimečných případech, vyžadujících neodkladné řešení, může použití omezovacích prostředků indikovat i jiný zdravotnický pracovník nelékařského povolání, který je přítomen; lékař musí být o takovém použití omezovacího prostředku neprodleně informován a musí potvrdit odůvodněnost omezení,","e) každé použití omezovacího prostředku, včetně důvodu jeho použití, bylo zaznamenáno do zdravotnické dokumentace vedené o pacientovi.","(4) Poskytovatel je povinen vést centrální evidenci použití omezovacích prostředků, která obsahuje pro každý typ omezovacího prostředku souhrnné údaje za kalendářní rok o","a) počtech případů použití omezovacích prostředků,","b) celkovém času v omezení; to neplatí, jde-li o omezení při poskytování zdravotnické záchranné služby,","c) celkovém počtu pacientů, u nichž byly použity omezovací prostředky,","a to pro každé pracoviště zdravotnického zařízení zvlášť. Souhrnné údaje podle písmene b) se neuvádějí pro omezení prostřednictvím psychofarmak. Použití omezovacího prostředku se zaznamená do centrální evidence nejpozději do 60 dnů ode dne jeho použití. Do centrální evidence se nezaznamenává použití omezovacího prostředku podle odstavce 1 písm. a), je-li jeho účelem pouze použití jiného omezovacího prostředku. Poskytovatel je dále povinen na žádost příslušného správního orgánu nebo ministerstva poskytnout tuto centrální evidenci těmto správním orgánům.","(5) O dočasném přerušení nebo o ukončení použití omezovacího prostředku rozhoduje lékař, sestra pro péči v psychiatrii nebo, jde-li o dítě, dětská sestra pro dětskou a dorostovou psychiatrii. Nejsou-li tito zdravotničtí pracovníci bezprostředně dostupní a pokračování v použití omezovacího prostředku se jeví jako nepřiměřené s ohledem na zdravotní stav pacienta, může o dočasném přerušení nebo o ukončení použití omezovacího prostředku rozhodnout i jiný zdravotnický pracovník nelékařského povolání, který je přítomen; v takovém případě musí být některý ze zdravotnických pracovníků podle věty první o tomto rozhodnutí neprodleně informován."]},"372/50":{"t":"Práva zdravotnického pracovníka","h":"","b":["(1) Zdravotnický pracovník má právo","a) získat od pacienta informace o tom, že pacient, kterému má poskytovat zdravotní služby, je nosičem infekční nemoci podle zákona o ochraně veřejného zdraví, a o dalších závažných skutečnostech týkajících se pacientova zdravotního stavu,","b) neposkytnout zdravotní služby v případě, že by došlo při jejich poskytování k přímému ohrožení jeho života nebo k vážnému ohrožení jeho zdraví.","(2) Zdravotnický pracovník může odmítnout poskytnutí zdravotních služeb pacientovi v případě, že by jejich poskytnutí odporovalo jeho svědomí nebo náboženskému vyznání. O této skutečnosti je povinen ihned informovat poskytovatele, který zajistí pacientovi jiného zdravotnického pracovníka. Nemůže-li poskytovatel zajistit jiného zdravotnického pracovníka, zajistí pacientovi jiného poskytovatele, který mu zdravotní služby poskytne, pokud pacient zajištění jiného poskytovatele neodmítne. Záznam o odmítnutí zajištění jiného zdravotnického pracovníka nebo poskytovatele je součástí zdravotnické dokumentace; záznam podepíše pacient a zdravotnický pracovník. Zdravotnický pracovník nemůže odmítnout poskytnutí zdravotních služeb pacientovi z důvodu uvedeného ve větě první, pokud by odmítnutím došlo k ohrožení života pacienta nebo k vážnému ohrožení jeho zdraví a poskytovatel není schopen zajistit poskytnutí zdravotních služeb jiným zdravotnickým pracovníkem. Podle věty první až čtvrté se obdobně postupuje, odmítne-li poskytnutí zdravotních služeb poskytovatel.","(3) Ustanovení odstavců 1 a 2 se použijí obdobně i pro jiné odborné pracovníky vykonávající činnosti v přímé souvislosti s poskytováním zdravotních služeb."]},"TZ/29":{"t":"Nutná obrana","h":"","b":["(1) Čin jinak trestný, kterým někdo odvrací přímo hrozící nebo trvající útok na zájem chráněný trestním zákonem, není trestným činem.","(2) Nejde o nutnou obranu, byla-li obrana zcela zjevně nepřiměřená způsobu útoku."]},"TZ/28":{"t":"Krajní nouze","h":"","b":["(1) Čin jinak trestný, kterým někdo odvrací nebezpečí přímo hrozící zájmu chráněnému trestním zákonem, není trestným činem.","(2) Nejde o krajní nouzi, jestliže bylo možno toto nebezpečí za daných okolností odvrátit jinak anebo způsobený následek je zřejmě stejně závažný nebo ještě závažnější než ten, který hrozil, anebo byl ten, komu nebezpečí hrozilo, povinen je snášet."]},"TZ/146":{"t":"Ublížení na zdraví","h":"","b":["(1) Kdo jinému úmyslně ublíží na zdraví, bude potrestán odnětím svobody na šest měsíců až tři léta.","(2) Odnětím svobody na jeden rok až pět let bude pachatel potrestán, spáchá-li čin uvedený v odstavci 1","a) na těhotné ženě,","b) na dítěti mladším patnácti let,","c) na svědkovi, znalci nebo tlumočníkovi v souvislosti s výkonem jejich povinnosti,","d) na zdravotnickém pracovníkovi při výkonu zdravotnického zaměstnání nebo povolání směřujícího k záchraně života nebo ochraně zdraví, nebo na jiném, který plnil svoji obdobnou povinnost při ochraně života, zdraví nebo majetku vyplývající z jeho zaměstnání, povolání, postavení nebo funkce nebo uloženou mu podle zákona, nebo","e) na jiném pro jeho skutečnou nebo domnělou rasu, příslušnost k etnické nebo sociální skupině, národnost, věk, pohlaví, sexuální orientaci, zdravotní postižení, politické přesvědčení, vyznání nebo proto, že je skutečně nebo domněle bez vyznání, anebo pro jeho skutečnou nebo domnělou příslušnost k jiné skupině osob.","(3) Odnětím svobody na dvě léta až osm let bude pachatel potrestán, způsobí-li činem uvedeným v odstavci 1 těžkou újmu na zdraví.","(4) Odnětím svobody na pět až deset let bude pachatel potrestán, způsobí-li činem uvedeným v odstavci 1 smrt."]},"TZ/353":{"t":"Nebezpečné vyhrožování","h":"","b":["(1) Kdo jinému vyhrožuje usmrcením, těžkou újmou na zdraví nebo jinou těžkou újmou takovým způsobem, že to může vzbudit důvodnou obavu, bude potrestán odnětím svobody až na jeden rok nebo zákazem činnosti.","(2) Odnětím svobody až na tři léta nebo zákazem činnosti bude pachatel potrestán, spáchá-li čin uvedený v odstavci 1","a) jako člen organizované skupiny,","b) vůči dítěti nebo těhotné ženě,","c) se zbraní,","d) na svědkovi, znalci nebo tlumočníkovi v souvislosti s výkonem jejich povinnosti, nebo","e) na zdravotnickém pracovníkovi při výkonu zdravotnického zaměstnání nebo povolání směřujícího k záchraně života nebo ochraně zdraví nebo na jiném, který plnil svoji obdobnou povinnost při ochraně života, zdraví nebo majetku vyplývající z jeho zaměstnání, povolání, postavení nebo funkce nebo uloženou mu podle zákona."]},"372/51":{"t":"Zachování mlčenlivosti v souvislosti se zdravotními službami","h":"","b":["(1) Poskytovatel je povinen zachovat mlčenlivost o všech skutečnostech, o kterých se dozvěděl v souvislosti s poskytováním zdravotních služeb.","(2) Za porušení povinné mlčenlivosti se nepovažuje","a) předávání informací nezbytných pro zajištění návaznosti poskytovaných zdravotních služeb,","b) sdělování údajů nebo jiných skutečností, je-li poskytovatel zproštěn pacientem, popřípadě zákonným zástupcem pacienta, mlčenlivosti a sděluje-li údaje nebo tyto skutečnosti v rozsahu zproštění,","c) sdělování, popřípadě oznamování údajů nebo jiných skutečností podle tohoto zákona nebo jiných právních předpisů, pokud z tohoto zákona nebo jiných právních předpisů vyplývá, že údaje nebo skutečnosti lze sdělit bez souhlasu pacienta,","d) sdělování údajů nebo jiných skutečností pro potřeby trestního řízení způsobem stanoveným právními předpisy upravujícími trestní řízení; za porušení povinné mlčenlivosti se rovněž nepovažuje sdělování údajů nebo jiných skutečností při plnění zákonem uložené povinnosti překazit nebo oznámit spáchání trestného činu,","e) sdílení údajů o zdravotním stavu pacienta zdravotnickými pracovníky se sociálními pracovníky a pracovníky v sociálních službách, v jejichž vzájemné koordinaci jsou poskytovány sociálně-zdravotní služby, a to v nezbytném rozsahu pro poskytnutí těchto služeb,","f) oznámení údajů nebo jiných skutečností, které vypovídají o tom, že pacient, který je osobou omezenou na svobodě, mohl být podroben špatnému zacházení, státnímu zástupci nebo jinému příslušnému státnímu orgánu; osobou omezenou na svobodě se rozumí osoba omezená na svobodě policistou, ve výkonu vazby, ve výkonu trestu odnětí svobody, ve výkonu zabezpečovací detence, v ochranném léčení ústavním, v ústavní výchově, v ochranné výchově, v zařízení pro zajištění cizinců, v azylovém zařízení a pacient hospitalizovaný bez jeho souhlasu nebo osoba, které je poskytována pobytová sociální služba, aniž by byla schopna smlouvu o poskytování této služby vypovědět.","(3) Za porušení povinné mlčenlivosti se dále nepovažuje sdělování údajů nebo jiných skutečností poskytovatelem v nezbytném rozsahu pro ochranu vlastních práv v trestním řízení, občanskoprávním řízení, rozhodčím řízení a ve správním řízení nebo sdělování skutečností soudu nebo jinému orgánu, je-li předmětem řízení před soudem nebo jiným orgánem spor mezi poskytovatelem, popřípadě jeho zaměstnancem, a pacientem nebo jinou osobou uplatňující práva na náhradu škody nebo ochranu osobnosti v souvislosti s poskytováním zdravotních služeb; v této souvislosti je poskytovatel oprávněn předat soudnímu znalci, znalecké kanceláři, znaleckému ústavu, komoře nebo odborníkovi, kterého si zvolí, též kopii zdravotnické dokumentace vedené o pacientovi za účelem vypracování znaleckého nebo odborného posudku vyžádaného obhajobou, nebo účastníkem v občanském soudním řízení. To platí obdobně pro sdělování údajů nebo jiných skutečností pro osobu uvedenou v § 64 odst. 1.","(4) Za porušení povinné mlčenlivosti se též nepovažuje sdělování údajů nebo jiných skutečností zdravotnickým pracovníkem, který je členem komory, nebo poskytovatelem, pro kterého tento zdravotnický pracovník v rozhodné době vykonával zdravotnické povolání, v nezbytném rozsahu pro účely řízení prováděných orgány komory.","(5) Povinná mlčenlivost podle odstavce 1 platí též pro","a) zdravotnické pracovníky a jiné odborné pracovníky, a to v souvislosti s výkonem jejich povolání,","b) zdravotnické pracovníky nebo jiné odborné pracovníky, kteří již nevykonávají své povolání, a informace získali v souvislosti s bývalým výkonem povolání zdravotnického pracovníka nebo jiného odborného pracovníka nebo zaměstnání při poskytování zdravotních služeb,","c) osoby získávající způsobilost k výkonu povolání zdravotnického pracovníka nebo jiného odborného pracovníka,","d) osoby uvedené v § 65 odst. 2 nahlížející bez souhlasu pacienta do zdravotnické dokumentace o něm vedené,","e) členy odborných komisí podle zákona o specifických zdravotních službách,","f) osoby uvedené v § 28 odst. 7,","g) další osoby, které v souvislosti se svou činností vykonávanou na základě tohoto zákona nebo jiných právních předpisů zjistí informace o zdravotním stavu pacienta nebo informace s tím související."]},"TZ/368":{"t":"Neoznámení trestného činu","h":"","b":["(1) Kdo se hodnověrným způsobem dozví, že jiný spáchal trestný čin vraždy (§ 140), těžkého ublížení na zdraví (§ 145), mučení a jiného nelidského a krutého zacházení (§ 149), obchodování s lidmi (§ 168), zbavení osobní svobody (§ 170), braní rukojmí (§ 174), zneužití dítěte k výrobě pornografie (§ 193), týrání svěřené osoby (§ 198), padělání a pozměnění peněz (§ 233), neoprávněného opatření, padělání a pozměnění platebního prostředku (§ 234), neoprávněné výroby peněz (§ 237), porušení předpisů o kontrole vývozu zboží a technologií dvojího užití (§ 262), porušení povinností při vývozu zboží a technologií dvojího užití (§ 263), provedení zahraničního obchodu s vojenským materiálem bez povolení nebo licence (§ 265), porušení povinnosti v souvislosti s vydáním povolení a licence pro zahraniční obchod s vojenským materiálem (§ 266), obecného ohrožení (§ 272), vývoje, výroby a držení zakázaných bojových prostředků (§ 280), nedovolené výroby a držení radioaktivní látky a vysoce nebezpečné látky (§ 281), nedovolené výroby a držení jaderného materiálu a zvláštního štěpného materiálu (§ 282), získání kontroly nad vzdušným dopravním prostředkem, civilním plavidlem a pevnou plošinou (§ 290), zavlečení vzdušného dopravního prostředku do ciziny (§ 292), vlastizrady (§ 309), rozvracení republiky (§ 310), teroristického útoku (§ 311), teroru (§ 312), účasti na teroristické skupině (§ 312a), financování terorismu (§ 312d), podpory a propagace terorismu (§ 312e), sabotáže (§ 314), vyzvědačství (§ 316), ohrožení utajované informace (§ 317), neoprávněné činnosti pro cizí moc (§ 318a), válečné zrady (§ 320), přijetí úplatku (§ 331), podplacení (§ 332), genocidia (§ 400), útoku proti lidskosti (§ 401), apartheidu a diskriminace skupiny lidí (§ 402), agrese (§ 405a), přípravy útočné války (§ 406), použití zakázaného bojového prostředku a nedovoleného vedení boje (§ 411), válečné krutosti (§ 412), perzekuce obyvatelstva (§ 413), plenění v prostoru válečných operací (§ 414) nebo zneužití mezinárodně uznávaných a státních znaků podle § 415 odst. 3, a takový trestný čin neoznámí bez odkladu státnímu zástupci nebo policejnímu orgánu nebo místo toho, jde-li o vojáka, nadřízenému, bude potrestán odnětím svobody až na tři léta; stanoví-li tento zákon na některý z těchto trestných činů trest mírnější, bude potrestán oním trestem mírnějším.","(2) Kdo spáchá čin uvedený v odstavci 1, není trestný, nemohl-li oznámení učinit, aniž by sebe nebo osobu blízkou uvedl v nebezpečí smrti, ublížení na zdraví, jiné závažné újmy nebo trestního stíhání.","(3) Oznamovací povinnost podle odstavce 1 nemá advokát nebo jeho zaměstnanec, který se dozví o spáchání trestného činu v souvislosti s výkonem advokacie nebo právní praxe. Oznamovací povinnost nemá také duchovní registrované církve a náboženské společnosti s oprávněním k výkonu zvláštních práv, dozví-li se o spáchání trestného činu v souvislosti s výkonem zpovědního tajemství nebo v souvislosti s výkonem práva obdobného zpovědnímu tajemství. Oznamovací povinnost trestného činu obchodování s lidmi podle § 168 odst. 2 a zbavení osobní svobody (§ 170) nemá též osoba poskytující pomoc obětem trestných činů."]},"TZ/367":{"t":"Nepřekažení trestného činu","h":"","b":["(1) Kdo se hodnověrným způsobem dozví, že jiný připravuje nebo páchá trestný čin vraždy (§ 140), zabití (§ 141), těžkého ublížení na zdraví (§ 145), mučení a jiného nelidského a krutého zacházení (§ 149), nedovoleného přerušení těhotenství bez souhlasu těhotné ženy (§ 159), neoprávněného odebrání tkání a orgánů (§ 164), obchodování s lidmi (§ 168), zbavení osobní svobody (§ 170), zavlečení podle § 172 odst. 2 a 3, loupeže (§ 173), braní rukojmí (§ 174), vydírání podle § 175 odst. 3 a 4, neoprávněného nakládání s osobními údaji podle § 180 odst. 4, znásilnění (§ 185), sexuálního útoku (§ 185a), sexuálního nátlaku (§ 186), pohlavního zneužití (§ 187), zneužití dítěte k výrobě pornografie (§ 193), týrání svěřené osoby (§ 198), krádeže podle § 205 odst. 4, zpronevěry podle § 206 odst. 4, podvodu podle § 209 odst. 4, pojistného podvodu podle § 210 odst. 5, úvěrového podvodu podle § 211 odst. 5, dotačního podvodu podle § 212 odst. 5, legalizace výnosů z trestné činnosti podle § 216 odst. 4 a 5, padělání a pozměnění peněz (§ 233), neoprávněného opatření, padělání a pozměnění platebního prostředku (§ 234), neoprávněné výroby peněz (§ 237), zneužití informace v obchodním styku podle § 255 odst. 4, zneužití postavení v obchodním styku podle § 255a odst. 3, poškození finančních zájmů Evropské unie podle § 260 odst. 5, porušení předpisů o kontrole vývozu zboží a technologií dvojího užití (§ 262), porušení povinností při vývozu zboží a technologií dvojího užití (§ 263), provedení zahraničního obchodu s vojenským materiálem bez povolení nebo licence (§ 265), porušení povinnosti v souvislosti s vydáním povolení a licence pro zahraniční obchod s vojenským materiálem (§ 266), obecného ohrožení (§ 272), vývoje, výroby a držení zakázaných bojových prostředků (§ 280), nedovolené výroby a držení radioaktivní látky a vysoce nebezpečné látky (§ 281), nedovolené výroby a držení jaderného materiálu a zvláštního štěpného materiálu (§ 282), neoprávněné výroby a jiného nakládání s omamnými nebo psychotropními látkami, s rostlinami nebo houbami je obsahujícími nebo s jedy (§ 283), získání kontroly nad vzdušným dopravním prostředkem, civilním plavidlem a pevnou plošinou (§ 290), zavlečení vzdušného dopravního prostředku do ciziny (§ 292), vlastizrady (§ 309), rozvracení republiky (§ 310), teroristického útoku (§ 311), teroru (§ 312), účasti na teroristické skupině (§ 312a), financování terorismu (§ 312d), podpory a propagace terorismu (§ 312e), vyhrožování teroristickým trestným činem (§ 312f), sabotáže (§ 314), vyzvědačství (§ 316), ohrožení utajované informace (§ 317), neoprávněné činnosti pro cizí moc (§ 318a), válečné zrady (§ 320), násilí proti orgánu veřejné moci podle § 323 odst. 3 a 4, násilí proti úřední osobě podle § 325 odst. 3 a 4, přijetí úplatku (§ 331), podplacení (§ 332), násilného překročení státní hranice podle § 339 odst. 2 a 3, organizování a umožnění nedovoleného překročení státní hranice podle § 340 odst. 4, vzpoury vězňů (§ 344), neuposlechnutí rozkazu podle § 375 odst. 2 a 3, zprotivení a donucení k porušení vojenské povinnosti podle § 377 odst. 2 a 3, porušování práv a chráněných zájmů vojáků stejné hodnosti podle § 382 odst. 3 a 4, porušování práv a chráněných zájmů vojáků podřízených nebo s nižší hodností podle § 383 odst. 3 a 4, zběhnutí (§ 386), ohrožování morálního stavu vojáků podle § 392 odst. 2, genocidia (§ 400), útoku proti lidskosti (§ 401), apartheidu a diskriminace skupiny lidí (§ 402), agrese (§ 405a), přípravy útočné války (§ 406), styků ohrožujících mír (§ 409), použití zakázaného bojového prostředku a nedovoleného vedení boje (§ 411), válečné krutosti (§ 412), perzekuce obyvatelstva (§ 413), plenění v prostoru válečných operací (§ 414) nebo zneužití mezinárodně uznávaných a státních znaků podle § 415 odst. 3, a spáchání nebo dokončení takového trestného činu nepřekazí, bude potrestán odnětím svobody až na tři léta; stanoví-li tento zákon na některý z těchto trestných činů trest mírnější, bude potrestán oním trestem mírnějším.","(2) Kdo spáchá čin uvedený v odstavci 1, není trestný, nemohl-li trestný čin překazit bez značných nesnází nebo aniž by sebe nebo osobu blízkou uvedl v nebezpečí smrti, ublížení na zdraví, jiné závažné újmy nebo trestního stíhání. Uvedení osoby blízké v nebezpečí trestního stíhání však nezbavuje pachatele trestní odpovědnosti, týká-li se nepřekažení trestného činu vlastizrady (§ 309), rozvracení republiky (§ 310), teroristického útoku (§ 311), teroru (§ 312), účasti na teroristické skupině (§ 312a), financování terorismu (§ 312d), podpory a propagace terorismu (§ 312e), vyhrožování teroristickým trestným činem (§ 312f), sabotáže (§ 314), vyzvědačství (§ 316), neoprávněné činnosti pro cizí moc (§ 318a), genocidia (§ 400), útoku proti lidskosti (§ 401), apartheidu a diskriminace skupiny lidí (§ 402), agrese (§ 405a), přípravy útočné války (§ 406), použití zakázaného bojového prostředku a nedovoleného vedení boje (§ 411), válečné krutosti (§ 412), perzekuce obyvatelstva (§ 413), plenění v prostoru válečných operací (§ 414) a zneužití mezinárodně uznávaných a státních znaků podle § 415 odst. 3.","(3) Překazit trestný čin lze i jeho včasným oznámením státnímu zástupci nebo policejnímu orgánu; voják může místo toho učinit oznámení nadřízenému."]},"L/10":{"t":"","h":"","b":["(1) Každý má právo, aby byla zachována jeho lidská důstojnost, osobní čest, dobrá pověst a chráněno jeho jméno.","(2) Každý má právo na ochranu před neoprávněným zasahováním do soukromého a rodinného života.","(3) Každý má právo na ochranu před neoprávněným shromažďováním, zveřejňováním nebo jiným zneužíváním údajů o své osobě."]},"372/32":{"t":"","h":"","b":["(1) Pacient se může vzdát podání informace o svém zdravotním stavu, popřípadě může určit, které osobě má být podána. Záznam o vzdání se podání informace o zdravotním stavu a určení osoby, které má být informace o zdravotním stavu podána, je součástí zdravotnické dokumentace vedené o pacientovi; záznam podepíše pacient a zdravotnický pracovník. K vzdání se podání informace o zdravotním stavu se nepřihlíží, jde-li o informaci, že pacient trpí infekční nemocí nebo jinou nemocí, v souvislosti s níž může ohrozit zdraví nebo život jiných osob.","(2) Informace o nepříznivé diagnóze nebo prognóze zdravotního stavu pacienta může být v nezbytně nutném rozsahu a po dobu nezbytně nutnou zadržena, lze-li důvodně předpokládat, že by její podání mohlo pacientovi způsobit závažnou újmu na zdraví. Podle věty první nelze postupovat v případě, kdy","a) informace o určité nemoci nebo predispozici k ní je jediným způsobem, jak pacientovi umožnit podniknout preventivní opatření nebo podstoupit včasnou léčbu,","b) zdravotní stav pacienta představuje riziko pro jeho okolí,","c) pacient žádá výslovně o přesnou a pravdivou informaci, aby si mohl zajistit osobní záležitosti.","(3) Poskytovatel může v nezbytném rozsahu zadržet informaci o zdravotním stavu nezletilého pacienta jeho zákonnému zástupci, pěstounovi nebo jiné pečující osobě v případě podezření, že se tato osoba na něm dopouští domácího nebo sexuálního násilí nebo se podílí na zneužívání nebo týrání nebo ohrožování zdravého vývoje tohoto nezletilého pacienta, lze-li předpokládat, že poskytnutím této informace by mohlo dojít k ohrožení pacienta. Obdobně se postupuje, jde-li o pacienta s ustanoveným zástupcem."]},"OZ/22":{"t":"","h":"","b":["(1) Osoba blízká je příbuzný v řadě přímé, sourozenec a manžel nebo partner podle jiného zákona upravujícího registrované partnerství (dále jen „partner“); jiné osoby v poměru rodinném nebo obdobném se pokládají za osoby sobě navzájem blízké, pokud by újmu, kterou utrpěla jedna z nich, druhá důvodně pociťovala jako újmu vlastní. Má se za to, že osobami blízkými jsou i osoby sešvagřené nebo osoby, které spolu trvale žijí.","(2) Stanoví-li zákon k ochraně třetích osob zvláštní podmínky nebo omezení pro převody majetku, pro jeho zatížení nebo přenechání k užití jinému mezi osobami blízkými, platí tyto podmínky a omezení i pro obdobná právní jednání mezi právnickou osobou a členem jejího statutárního orgánu nebo tím, kdo právnickou osobu podstatně ovlivňuje jako její člen nebo na základě dohody či jiné skutečnosti."]},"372/53":{"t":"","h":"Vedení zdravotnické dokumentace","b":["(1) Zdravotnická dokumentace je soubor informací vedených, zpracovávaných a uchovávaných poskytovatelem za účelem poskytování zdravotních služeb konkrétnímu pacientovi, a to bez ohledu na to, zda byly získány od pacienta, od jiného poskytovatele nebo jiných osob nebo vlastní činností poskytovatele.","(2) Za zdravotnickou dokumentaci se nepovažují informace, které poskytovatel získal v souvislosti s poskytováním zdravotních služeb, a to i ze zdravotnické dokumentace jím zpracovávané, pokud účelem jejich zpracování není poskytování zdravotních služeb konkrétnímu pacientovi, ale výhradně jiný účel.","(3) V rámci zpracování osobních údajů ve zdravotnické dokumentaci lze využívat rodné číslo pacienta."]},"372/54":{"t":"","h":"","b":["Poskytovatel je povinen vést, zpracovávat a uchovávat zdravotnickou dokumentaci, nejde-li o","a) poskytování lékárenské péče v lékárně,","b) poskytování zdravotních výkonů v rámci preventivní péče mimo zdravotnické zařízení podle § 11a s výjimkou","1. očkování,","2. zdravotních služeb alespoň částečně hrazených z veřejného zdravotního pojištění."]},"444/2":{"t":"","h":"Obsah a náležitosti zdravotnické dokumentace","b":["Zdravotnická dokumentace obsahuje údaje o zdravotním stavu pacienta a skutečnostech souvisejících s poskytováním zdravotních služeb pacientovi, a to","a) identifikační údaje poskytovatele, kterými jsou","1. jméno, popřípadě jména, a příjmení poskytovatele, jde-li o fyzickou osobu,","2. v případě právnické osoby obchodní firma nebo název a adresa sídla, v případě právnické osoby se sídlem mimo území České republiky také místo usazení závodu nebo organizační složky závodu právnické osoby na území České republiky,","3. identifikační číslo osoby, bylo-li přiděleno,","4. adresa místa poskytování zdravotních služeb,","5. název oddělení nebo obdobné části, je-li zdravotnické zařízení poskytovatele takto členěno (dále jen „oddělení zdravotnického zařízení“),","b) identifikační a kontaktní údaje pacienta, kterými jsou","1. jméno, popřípadě jména, a příjmení pacienta,","2. datum narození, případně rodné číslo, číslo pojištěnce veřejného zdravotního pojištění a kód zdravotní pojišťovny, číslo a druh identifikačního dokladu; informace o čísle a druhu identifikačního dokladu se neuvádí u dětí, kterým nebyl doklad vydán, a u osob omezených na svobodě,","3. adresa místa trvalého pobytu na území České republiky, jde-li o cizince, místo hlášeného pobytu na území České republiky, a v případě osoby bez trvalého pobytu na území České republiky také adresa bydliště mimo území České republiky, je-li takový údaj znám,","4. adresa pro doručování, pokud není totožná s adresou podle bodu 3, a pokud je pacientem sdělena,","5. telefonní číslo, adresa elektronické pošty, případně další kontaktní údaje, pokud jsou pacientem sděleny,","6. identifikátor pacienta,","c) pohlaví pacienta určené po narození,","d) jméno, popřípadě jména, a příjmení zdravotnického pracovníka nebo jiného odborného pracovníka, v případě zdravotnické dokumentace vedené v elektronické podobě také identifikátor zdravotnického pracovníka, který provedl záznam do zdravotnické dokumentace; to neplatí v případě poskytovatele, který je fyzickou nebo právnickou osobou a který provádí záznamy do zdravotnické dokumentace jako jediná osoba v rámci poskytovatele,","e) datum a čas poskytnutí neodkladné zdravotní péče nebo vykonání návštěvní služby u pacienta,","f) v případě poskytování jednodenní nebo lůžkové péče","1. datum a čas přijetí pacienta do péče a datum a čas ukončení péče o pacienta,","2. informace o způsobu vyrozumění osoby, která by měla zajistit další péči o pacienta, který se s ohledem na svůj zdravotní stav neobejde bez pomoci další osoby, nebo o způsobu a čase podání informace o zamýšleném propuštění tohoto pacienta příslušnému obecnímu úřadu,","3. datum a čas přeložení pacienta k jinému poskytovateli, popřípadě jeho přeložení na jiné oddělení zdravotnického zařízení, nebo","4. datum a čas úmrtí pacienta, došlo-li k úmrtí při poskytování jednodenní nebo lůžkové péče,","g) informace o průběhu a výsledku poskytovaných zdravotních služeb a o dalších významných okolnostech souvisejících se zdravotním stavem pacienta a s postupem při poskytování zdravotních služeb, včetně anamnestických údajů potřebných pro poskytování zdravotních služeb a pro vypracování posudků pro účely sociálního zabezpečení,","h) informace o tom, zda jde o pacienta s omezenou svéprávností tak, že má omezenou způsobilost posoudit poskytnutí zdravotních služeb, popřípadě důsledky jejich poskytnutí, a rozsah tohoto omezení,","i) identifikační a kontaktní údaje zákonného zástupce pacienta, opatrovníka pacienta nebo jiné osoby oprávněné udělit souhlas za pacienta, identifikační a kontaktní údaje důvěrníka nebo podpůrce pacienta,","j) identifikační a kontaktní údaje registrujícího poskytovatele pacienta v oboru všeobecné praktické lékařství nebo v oboru praktické lékařství pro děti a dorost nebo pediatrie, pokud jsou poskytovateli známy,","k) u pacienta se zdravotním postižením informace o nezbytných zdravotnických prostředcích, popřípadě zvláštních pomůckách, které pacient používá,","l) u pacienta a zákonného zástupce se sluchovým postižením, kombinovaným sluchovým a zrakovým postižením nebo těžkými komunikačními problémy zapříčiněnými zdravotními důvody informace o formách komunikace, které pacient preferuje, a o poskytovatelem zvolené formě komunikace s pacientem,","m) údaj o dorozumívacím jazyku pacienta, pokud je odlišný od českého nebo slovenského jazyka, a o poskytovatelem zvoleném způsobu nebo prostředku komunikace,","n) u osob vykonávajících činnosti epidemiologicky závažné záznam o vykonávané činnosti,","o) informace o užívání návykových látek a o provedení krátké intervence podle zákona o ochraně zdraví před škodlivými účinky návykových látek,","p) informace o tom, že pacient je držitelem řidičského průkazu,","q) informace o tom, že pacient je držitelem zbrojního průkazu,","r) informace o tom, že pacient je osobou se zdravotním postižením podle jiného právního předpisu,","s) u pacienta ve výkonu ochranného léčení v ústavní formě","1. záznam o individuálně stanovených rizicích a protektivních faktorech podkládajících jeho společenskou nebezpečnost a záznam o jejich pravidelném přehodnocování, a to alespoň jednou každých 6 měsíců,","2. zprávy o průběhu ochranného léčení zpracované poskytovatelem pro soud."]},"444/11":{"t":"Lhůty pro provádění záznamů a autorizaci zdravotnické dokumentace v návaznosti na druhy a formy zdravotní péče","h":"","b":["(1) Záznam do zdravotnické dokumentace provede poskytovatel bezodkladně, pokud tato vyhláška nestanoví jinak.","(2) Poskytovatel lůžkové péče provede záznam o poskytnuté zdravotní péči minimálně jednou za 24 hodin.","(3) Autorizace záznamu se provede nejpozději v průběhu dne nebo směny, v níž byl záznam proveden."]},"444/12":{"t":"","h":"","b":["Záznam ve zdravotnické dokumentaci může být pacientem, případně jeho zákonným zástupcem, podepsán vlastnoručně, kvalifikovaným elektronickým podpisem, zaručeným elektronickým podpisem, uznávaným elektronickým podpisem nebo dynamickým biometrickým podpisem."]},"372/65":{"t":"","h":"Nahlížení do zdravotnické dokumentace, pořizování jejích výpisů nebo kopií","b":["(1) Do zdravotnické dokumentace vedené o pacientovi mohou v přítomnosti zaměstnance pověřeného poskytovatelem nahlížet, pořizovat si její výpisy nebo kopie","a) pacient, zákonný zástupce, opatrovník pacienta nebo jiná osoba, která je na základě rozhodnutí soudu oprávněná pacienta zastupovat v právním jednání vztahujícím se k poskytování zdravotních služeb; do záznamů autorizovaných psychologických metod a popisu léčby psychoterapeutickými prostředky mohou tyto osoby nahlížet nebo si pořizovat výpisy nebo kopie pouze v rozsahu záznamu popisu příznaků onemocnění, diagnózy, popisu terapeutického přístupu a interpretace výsledků testů,","b) osoby určené pacientem, zákonným zástupcem nebo opatrovníkem pacienta, pěstoun nebo jiná pečující osoba; v případě záznamů autorizovaných psychologických metod a popisu léčby psychoterapeutickými prostředky se postupuje podle písmene a),","c) osoby blízké zemřelému pacientovi v rozsahu stanoveném v § 33 odst. 4;","postupy podle písmene a), b) nebo c) nesmí narušit poskytování zdravotních služeb.","(2) Do zdravotnické dokumentace vedené o pacientovi mohou bez jeho souhlasu nahlížet, jestliže je to v zájmu pacienta nebo jestliže je to potřebné k naplnění účelů plynoucích z jejich pověření nebo k výkonu působnosti svěřené podle tohoto zákona nebo jiných právních předpisů, a to v nezbytném rozsahu,","a) pracovník poskytovatele a osoba v obdobném postavení k poskytovateli, jsou-li","1. osobou se způsobilostí k výkonu zdravotnického povolání nebo jiným odborným pracovníkem a podílí-li se na poskytování zdravotních služeb pacientovi, nebo","2. osobou plnící další úkoly podle tohoto zákona nebo jiných právních předpisů,","b) osoby podílející se na výkonu působnosti příslušného správního orgánu v souvislosti s přezkoumáním lékařského posudku podle jiného právního předpisu,","c) osoby se způsobilostí k výkonu zdravotnického povolání pověřené příslušným správním orgánem vypracováním odborného stanoviska k návrhu na přezkoumání lékařského posudku,","d) osoby, které se podílejí na výkonu působnosti správních orgánů a které jsou","1. oprávněné k výkonu kontroly v rozsahu jejich pověření podle tohoto zákona nebo jiných právních předpisů,","2. osobami se způsobilostí k výkonu zdravotnického povolání pověřenými a přizvanými ke kontrole v rozsahu jejich pověření podle tohoto zákona nebo jiných právních předpisů,","3. pověřené k vyřízení stížnosti podle části osmé tohoto zákona v souvislosti s touto stížností,","4. ustavené jako nezávislý odborník nebo jmenované členem nezávislé odborné komise podle § 94 odst. 3, nebo","5. pověřené příslušným správním orgánem, který převzal podle tohoto zákona zdravotnickou dokumentaci, pořizováním výpisů nebo kopií zdravotnické dokumentace pro zajištění návaznosti zdravotních služeb o pacienta,","e) osoby se způsobilostí k výkonu zdravotnického povolání pověřené zdravotními pojišťovnami k provádění činností v rozsahu stanoveném zákonem o veřejném zdravotním pojištění,","f) zdravotničtí pracovníci příslušní podle jiných právních předpisů k posuzování zdravotního stavu pro účely sociálního zabezpečení, zejména nemocenského nebo důchodového pojištění, státní sociální podpory, zaměstnanosti, sociálně-právní ochrany dětí, sociálních služeb, dávek pro osoby se zdravotním postižením a pomoci v hmotné nouzi, a to včetně pověřených lékařských zdravotnických pracovníků Ministerstva práce a sociálních věcí za účelem plnění jeho koncepční, kontrolní a metodické činnosti,","g) osoby Státním ústavem pro kontrolu léčiv pověřené a přizvané ke kontrole podle tohoto zákona nebo jiných právních předpisů v rozsahu stanoveném těmito právními předpisy,","h) osoby podílející se na evidenci údajů nebo na kont
