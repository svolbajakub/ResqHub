<html lang="cs">
<head>
<meta charset="UTF-8">

<title>ResqSocial</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ResqSocial">
<meta name="theme-color" content="#E4EEEF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#03141A" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">
<style>
/* ResqSocial – sociální a krizová pomoc v Ústeckém kraji. Vzhled sladěný s ResqHubem. */
:root {
  --bg: #E4EEEF; --ink: #0A1F23; --ink-2: rgba(10, 31, 35, .6); --ink-3: rgba(10, 31, 35, .36);
  --petrol: #0B6E79; --petrol-soft: rgba(11, 110, 121, .12); --on-petrol: #FFFFFF;
  --green: #138A5B; --green-soft: rgba(31, 181, 122, .15);
  --amber: #A65C00; --amber-soft: rgba(245, 154, 31, .15);
  --red: #D92D30;
  --glow-a: rgba(11, 110, 121, .5); --glow-b: rgba(53, 194, 196, .4);
  --glass: rgba(255, 255, 255, .58); --glass-strong: rgba(250, 253, 253, .94);
  --glass-edge: rgba(255, 255, 255, .78); --glass-hi: rgba(255, 255, 255, .95); --glass-shadow: rgba(6, 55, 62, .13);
  --hairline: rgba(10, 31, 35, .1); --fill: rgba(10, 31, 35, .06);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", Roboto, sans-serif;
  --font-round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #03141A; --ink: #EAF6F7; --ink-2: rgba(234, 246, 247, .64); --ink-3: rgba(234, 246, 247, .34);
    --petrol: #3CC0CB; --petrol-soft: rgba(60, 192, 203, .14); --on-petrol: #03141A;
    --green: #4FD69C; --green-soft: rgba(79, 214, 156, .14); --amber: #FFB45E; --amber-soft: rgba(255, 169, 77, .14); --red: #FF6B6E;
    --glow-a: rgba(11, 110, 121, .6); --glow-b: rgba(28, 157, 163, .3);
    --glass: rgba(255, 255, 255, .075); --glass-strong: rgba(22, 38, 43, .95);
    --glass-edge: rgba(255, 255, 255, .13); --glass-hi: rgba(255, 255, 255, .15); --glass-shadow: rgba(0, 0, 0, .45);
    --hairline: rgba(255, 255, 255, .1); --fill: rgba(255, 255, 255, .08);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #03141A; --ink: #EAF6F7; --ink-2: rgba(234, 246, 247, .64); --ink-3: rgba(234, 246, 247, .34);
  --petrol: #3CC0CB; --petrol-soft: rgba(60, 192, 203, .14); --on-petrol: #03141A;
  --green: #4FD69C; --green-soft: rgba(79, 214, 156, .14); --amber: #FFB45E; --amber-soft: rgba(255, 169, 77, .14); --red: #FF6B6E;
  --glow-a: rgba(11, 110, 121, .6); --glow-b: rgba(28, 157, 163, .3);
  --glass: rgba(255, 255, 255, .075); --glass-strong: rgba(22, 38, 43, .95);
  --glass-edge: rgba(255, 255, 255, .13); --glass-hi: rgba(255, 255, 255, .15); --glass-shadow: rgba(0, 0, 0, .45);
  --hairline: rgba(255, 255, 255, .1); --fill: rgba(255, 255, 255, .08);
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { position: relative; isolation: isolate; min-height: 100vh; overflow-x: hidden; font-family: var(--font); font-size: 17px; line-height: 1.35; -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--petrol); }
svg { display: block; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--petrol); outline-offset: 2px; border-radius: 12px; }

.ambient { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
.ambient::before, .ambient::after { content: ""; position: absolute; border-radius: 50%; filter: blur(60px); }
.ambient::before { width: 130vw; height: 60vh; left: -40vw; top: -30vh; background: var(--glow-a); }
.ambient::after { width: 90vw; height: 44vh; right: -42vw; top: 6vh; background: var(--glow-b); }
.glass { background: var(--glass); -webkit-backdrop-filter: blur(26px) saturate(180%); backdrop-filter: blur(26px) saturate(180%); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-hi), 0 10px 30px -10px var(--glass-shadow); }

.wrap { max-width: 640px; margin: 0 auto; padding: max(14px, env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom)); }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 8px 4px 14px; }
.head h1 { margin: 0; font-family: var(--font-display); font-size: 40px; font-weight: 800; letter-spacing: -.04em; line-height: 1; }
.head p { margin: 6px 0 0; color: var(--ink-2); font-size: 15px; }
.round-btn { width: 42px; height: 42px; border-radius: 50%; flex: none; display: grid; place-items: center; color: var(--ink); }
.round-btn svg { width: 20px; height: 20px; }
.round-btn:active { transform: scale(.92); }

/* okres */
.okres { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px 12px; padding: 2px 16px 4px; scroll-padding: 0 16px; }
.okres::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid var(--glass-edge); background: var(--glass); font-size: 14.5px; font-weight: 600; color: var(--ink); white-space: nowrap; transition: background .15s, color .15s, transform .1s; }
.chip:active { transform: scale(.96); }
.chip[aria-pressed="true"] { background: var(--petrol); border-color: var(--petrol); color: var(--on-petrol); }

/* hledání */
.search { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 8px 0 14px; border-radius: 16px; margin-bottom: 16px; }
.search svg { width: 19px; height: 19px; color: var(--ink-3); flex: none; }
.search input { flex: 1; min-width: 0; height: 100%; border: 0; background: none; outline: none; font-size: 17px; }
.search input::placeholder { color: var(--ink-3); }
.search input::-webkit-search-cancel-button { display: none; }
.search .clear { width: 32px; height: 32px; border: 0; border-radius: 50%; background: var(--fill); display: grid; place-items: center; color: var(--ink-2); }
.search .clear svg { width: 11px; height: 11px; color: inherit; }

/* nonstop */
.section-label { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 18px 6px 8px; font-size: 14px; font-weight: 600; color: var(--ink-2); }
.section-label small { font-size: 13px; font-weight: 500; color: var(--ink-3); }
.hot { border-radius: 22px; overflow: hidden; }
.hot a { position: relative; display: flex; align-items: center; gap: 12px; padding: 11px 12px 11px 16px; text-decoration: none; color: var(--ink); }
.hot a + a::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: 1px solid var(--hairline); }
.hot a:active { background: var(--fill); }
.hot .grow { flex: 1; min-width: 0; }
.hot b { display: block; font-size: 16px; font-weight: 650; letter-spacing: -.01em; }
.hot span.sub { display: block; font-size: 13px; color: var(--ink-2); margin-top: 1px; }
.hot .num { font-family: var(--font-round); font-size: 15px; font-weight: 700; color: var(--petrol); font-variant-numeric: tabular-nums; white-space: nowrap; }
.call-dot { width: 38px; height: 38px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--petrol); color: var(--on-petrol); box-shadow: 0 6px 14px -6px var(--petrol); }
.call-dot svg { width: 18px; height: 18px; }

/* situace */
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; min-height: 118px; padding: 14px; border-radius: 22px; text-align: left; color: var(--ink); }
.tile:active { transform: scale(.97); }
.tile .ico { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; font-size: 22px; background: var(--petrol-soft); }
.tile b { font-size: 15.5px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2; }
.tile small { display: block; margin-top: 3px; font-size: 12.5px; color: var(--ink-2); font-weight: 500; }
.tile.wide { grid-column: 1 / -1; flex-direction: row; align-items: center; min-height: 0; }
.tile.wide .ico { flex: none; }

/* kontakty */
.list { border-radius: 22px; overflow: hidden; }
.contact { position: relative; }
.contact + .contact::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: 1px solid var(--hairline); }
.c-row { display: flex; align-items: flex-start; gap: 10px; padding: 13px 12px 13px 16px; }
.c-main { flex: 1; min-width: 0; border: 0; background: none; padding: 0; text-align: left; color: var(--ink); }
.c-name { font-size: 16.5px; font-weight: 650; letter-spacing: -.01em; line-height: 1.25; }
.c-badges { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
.badge { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 10px; font-size: 11.5px; font-weight: 750; letter-spacing: .01em; background: var(--fill); color: var(--ink-2); }
.badge.ns { background: var(--green-soft); color: var(--green); }
.badge.ok { background: var(--petrol-soft); color: var(--petrol); }
.badge.low { background: var(--amber-soft); color: var(--amber); }
.badge.open { background: var(--green-soft); color: var(--green); }
.badge.closed { background: var(--fill); color: var(--ink-2); }
.nav-btn { display: inline-flex; align-items: center; gap: 6px; height: 34px; margin-top: 7px; padding: 0 14px 0 10px; border-radius: 17px; background: var(--petrol-soft); color: var(--petrol); font-size: 14px; font-weight: 650; text-decoration: none; }
.nav-btn svg { width: 16px; height: 16px; }
.br { padding: 9px 0; border-top: 1px solid var(--hairline); font-size: 14.5px; line-height: 1.4; }
.br .lbl { color: var(--ink-2); font-size: 13px; font-weight: 600; }
.br.mine { background: var(--petrol-soft); margin: 0 -10px; padding: 9px 10px; border-radius: 12px; border-top-color: transparent; }
.br p { margin: 2px 0 0; }
.br small { display: block; color: var(--ink-2); font-size: 13px; margin-top: 2px; }
.c-desc { font-size: 14px; color: var(--ink-2); margin-top: 5px; line-height: 1.38; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.c-hours { display: flex; align-items: flex-start; gap: 6px; margin-top: 6px; font-size: 13.5px; color: var(--ink); font-weight: 550; }
.c-hours svg { width: 14px; height: 14px; flex: none; margin-top: 2px; color: var(--ink-3); }
.c-call { display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: var(--petrol); padding-top: 2px; }
.c-call span { font-family: var(--font-round); font-size: 11.5px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.c-more { padding: 0 16px 14px; }
.contact.open .c-desc { -webkit-line-clamp: unset; }
.c-more .row { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-top: 1px solid var(--hairline); font-size: 14.5px; line-height: 1.4; }
.c-more .row svg { width: 16px; height: 16px; flex: none; margin-top: 2px; color: var(--ink-3); }
.c-more .row a { text-decoration: none; font-weight: 600; }
.c-more .row .lbl { color: var(--ink-2); font-size: 13px; }
.c-note { margin: 4px 0 6px; padding: 10px 12px; border-radius: 14px; background: var(--amber-soft); font-size: 14px; line-height: 1.42; }
.c-note b { color: var(--amber); }
.c-src { display: block; margin-top: 6px; font-size: 12.5px; color: var(--ink-3); word-break: break-word; }
.c-src a { color: inherit; }
.chev-btn { color: var(--ink-3); transition: transform .2s; }
.contact.open .chev-btn { transform: rotate(180deg); }
.more-hint { display: inline-flex; align-items: center; gap: 4px; margin-top: 6px; font-size: 13px; font-weight: 600; color: var(--petrol); }
.more-hint svg { width: 12px; height: 12px; transition: transform .2s; }
.contact.open .more-hint svg { transform: rotate(180deg); }

/* detail situace */
.detail-top { position: sticky; top: max(10px, env(safe-area-inset-top)); z-index: 10; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.pill-btn { display: inline-flex; align-items: center; gap: 4px; height: 40px; padding: 0 16px 0 10px; border-radius: 20px; font-weight: 600; font-size: 16px; color: var(--ink); border: 1px solid var(--glass-edge); }
.pill-btn svg { width: 20px; height: 20px; color: var(--petrol); }
.hero { display: flex; align-items: center; gap: 14px; padding: 4px 4px 16px; }
.hero .ico { width: 54px; height: 54px; flex: none; border-radius: 17px; display: grid; place-items: center; font-size: 28px; background: var(--petrol-soft); }
.hero h2 { margin: 0; font-family: var(--font-display); font-size: 28px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; text-wrap: balance; }
.hero p { margin: 4px 0 0; font-size: 14px; color: var(--ink-2); }
.key { border-radius: 22px; padding: 16px 18px; margin-bottom: 12px; color: #fff; background: linear-gradient(150deg, #16A3AE 0%, #0B6E79 55%, #074B53 100%); box-shadow: 0 14px 30px -14px rgba(11, 110, 121, .8); }
.key h3 { margin: 0 0 8px; font-size: 14px; font-weight: 650; opacity: .85; }
.key ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.key li { position: relative; padding-left: 18px; font-size: 15.5px; line-height: 1.42; font-weight: 550; }
.key li::before { content: ""; position: absolute; left: 2px; top: .58em; width: 7px; height: 7px; border-radius: 50%; background: rgba(255, 255, 255, .8); }
.key li b { font-weight: 750; }
.filters { display: flex; gap: 8px; margin: 4px 0 2px; flex-wrap: wrap; }
.filters .chip svg { display: inline-block; width: 8px; height: 8px; margin-right: 6px; vertical-align: 1px; }
.empty { padding: 22px 20px; text-align: center; color: var(--ink-2); font-size: 15px; border-radius: 22px; }
.empty strong { display: block; color: var(--ink); font-size: 17px; margin-bottom: 4px; }
.text-btn { display: block; margin: 10px auto 0; border: 0; background: none; color: var(--petrol); font-weight: 600; font-size: 15px; padding: 8px 12px; }
.note { margin: 18px 8px 0; font-size: 13px; color: var(--ink-3); text-align: center; line-height: 1.45; }
mark { background: color-mix(in srgb, var(--petrol) 22%, transparent); color: inherit; border-radius: 3px; }

.view-enter { animation: enter .3s cubic-bezier(.2, .8, .2, 1); }
@keyframes enter { from { opacity: 0; transform: translateY(8px); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; } }
</style>
</head>

<div class="ambient" aria-hidden="true"></div>

<div class="wrap">
  <div id="main-view">
    <header class="head">
      <div>
        <h1>ResqSocial</h1>
        <p>Sociální a krizová pomoc · Ústecký kraj</p>
      </div>
      <button class="round-btn glass" id="theme-toggle" type="button" aria-label="Přepnout světlý nebo tmavý režim">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 4v16"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
      </button>
    </header>

    <div class="okres" id="okres" role="group" aria-label="Okres"></div>

    <label class="search glass">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="q" placeholder="Služba, město, situace…" autocomplete="off" enterkeyhint="search" aria-label="Hledat">
      <button type="button" class="clear" id="q-clear" aria-label="Vymazat" hidden><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 2l8 8M10 2l-8 8"/></svg></button>
    </label>

    <div id="home">
      <div class="section-label">Nonstop – nejčastěji potřeba</div>
      <div class="hot glass" id="hot"></div>
      <div class="section-label">Co se děje?</div>
      <div class="grid" id="grid"></div>
    </div>
    <div id="results" hidden></div>

    <p class="note" id="foot-note"></p>
  </div>

  <div id="detail-view" hidden>
    <div class="detail-top">
      <button type="button" class="pill-btn glass" id="back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
        Zpět
      </button>
    </div>
    <div class="hero"><span class="ico" id="d-ico"></span><div><h2 id="d-title"></h2><p id="d-sub"></p></div></div>
    <div class="key" id="d-key"><h3>Co dělat</h3><ul id="d-steps"></ul></div>
    <div class="okres" id="okres-d" role="group" aria-label="Okres"></div>
    <div class="filters"><button type="button" class="chip" id="open-only" aria-pressed="false"><svg viewBox="0 0 8 8"><circle cx="4" cy="4" r="4" fill="var(--green)"/></svg>Otevřeno teď</button><button type="button" class="chip" id="ns-only" aria-pressed="false">Jen nonstop</button></div>
    <div id="d-list"></div>
  </div>
</div>

const DAYS = ['', 'Po', 'Út', 'St', 'Čt', 'Pá', 'So', 'Ne'];
const toMin = (t) => { const [h, m] = t.split(':').map(Number); return h * 60 + (m || 0); };
// hs: '24/7' | [{d:[1..7], from:'08:00', to:'16:00'}] (přes půlnoc: from > to)
function openInfo(c, now = new Date()) {
  if (c.hs === '24/7') return { st: 'ns' };
  if (!Array.isArray(c.hs) || !c.hs.length) return { st: 'unknown' };
  const dow = now.getDay() || 7, mins = now.getHours() * 60 + now.getMinutes();
  const prev = dow === 1 ? 7 : dow - 1;
  for (const r of c.hs) {
    const f = toMin(r.from), t = toMin(r.to === '24:00' ? '23:59' : r.to), over = t <= f;
    if (r.d.includes(dow) && (over ? mins >= f : mins >= f && mins < t)) return { st: 'open', until: over ? null : r.to };
    if (over && r.d.includes(prev) && mins < t) return { st: 'open', until: r.to };
  }
  // nejbližší otevření v příštích 7 dnech
  for (let k = 0; k < 8; k++) {
    const d = ((dow - 1 + k) % 7) + 1;
    const starts = c.hs.filter((r) => r.d.includes(d)).map((r) => toMin(r.from)).filter((f) => k > 0 || f > mins).sort((a, b) => a - b);
    if (starts.length) {
      const f = starts[0], hh = Math.floor(f / 60) + ':' + String(f % 60).padStart(2, '0');
      return { st: 'closed', next: (k === 0 ? 'dnes' : k === 1 ? 'zítra' : DAYS[d]) + ' ' + hh };
    }
  }
  return { st: 'closed' };
}
const isOpen = (c) => { const s = openInfo(c).st; return s === 'ns' || s === 'open'; };
function statusBadge(c) {
  const o = openInfo(c);
  if (o.st === 'ns') return '<span class="badge ns">Nonstop</span>';

  if (o.st === 'closed') return '<span class="badge closed">Zavřeno' + (o.next ? ' · otevírá ' + esc(o.next) : '') + '</span>';
  return '';
}

    rows.push(brs.map((b) => `<div class="br${b.ok === state.okres ? ' mine' : ''}"><span class="lbl">Pracoviště ${esc(((b.a || '').match(/\d{3} ?\d{2}\s+([^,–(]+)/) || [])[1] || OKRES_NAME[b.ok] || b.ok)}</span>
      <p>${esc(b.a || '')}</p>${b.h ? '<small>' + esc(b.h) + '</small>' : ''}
      ${b.p ? `<small><a href="${tel(b.p)}">${esc(b.p)}</a></small>` : ''}
      ${b.a ? `<a class="nav-btn" href="${mapUrl(b.a)}" target="_blank" rel="noopener">${ICON.nav}Navigovat</a>` : ''}</div>`).join(''));
  } else if (c.a) rows.push(`<div class="row">${ICON.pin}<span>${esc(c.a)}<br><a class="nav-btn" href="${mapUrl(c.a)}" target="_blank" rel="noopener">${ICON.nav}Navigovat</a></span></div>`);
  if (c.p) rows.push(`<div class="row">${ICON.phone}<span><a href="${tel(c.p)}">${esc(c.p)}</a></span></div>`);
  if (c.p2) rows.push(`<div class="row">${ICON.phone}<span><a href="${tel(c.p2)}">${esc(c.p2)}</a>${c.p2l ? '<br><span class="lbl">' + esc(c.p2l) + '</span>' : ''}</span></div>`);
  if (c.e) rows.push(`<div class="row">${ICON.mail}<a href="mailto:${esc(c.e)}">${esc(c.e)}</a></div>`);
  if (c.w) rows.push(`<div class="row">${ICON.web}<a href="${esc(c.w)}" target="_blank" rel="noopener">${esc(c.w.replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, ''))}</a></div>`);
  let html = '';
  if (c.x) html += `<div class="c-note"><b>Pozor: </b>${esc(c.x)}</div>`;
  html += rows.join('');
  const src = (c.s || '').split(/\s*;\s*/)[0];
  if (src) html += `<span class="c-src">Ověřeno ${VERIFIED}${c.c === 'medium' ? ' (částečně)' : c.c === 'low' ? ' – nepotvrzeno, ověř' : ''}: <a href="${esc(src.split(' ')[0])}" target="_blank" rel="noopener">zdroj</a></span>`;
  return html;
}
function toggleContact(el) {
  const c = byId[el.dataset.id]; const more = el.querySelector('.c-more');
  const open = !el.classList.contains('open');
  if (open && !more.innerHTML) more.innerHTML = moreHtml(c);
  el.classList.toggle('open', open); more.hidden = !open;
  el.querySelector('.c-main').setAttribute('aria-expanded', open);
}
document.addEventListener('click', (e) => {
  const m = e.target.closest('.c-main'); if (m) toggleContact(m.closest('.contact'));
});

/* ---------- okres ---------- */
function okresHtml() {
  return OKRESY.map(([id, l]) => `<button type="button" class="chip" data-ok="${id}" aria-pressed="${state.okres === id}">${l}</button>`).join('');
}
function renderOkres() {
  $('okres').innerHTML = okresHtml(); $('okres-d').innerHTML = okresHtml();
}
function onOkres(e) {
  const b = e.target.closest('[data-ok]'); if (!b) return;
  state.okres = b.dataset.ok; sSet('resqsocial:okres', state.okres);
  renderOkres(); renderGrid(); if (q.value.trim()) renderSearch();
  if (state.sit) renderSituationList();
  b.scrollIntoView && document.querySelectorAll(`[data-ok="${state.okres}"]`).forEach((x) => x.scrollIntoView({ block: 'nearest', inline: 'center' }));
}
$('okres').addEventListener('click', onOkres);
$('okres-d').addEventListener('click', onOkres);

/* ---------- úvod ---------- */
function renderHot() {
  $('hot').innerHTML = HOT.map(([id, t, sub]) => {
    const c = byId[id]; if (!c || !c.p) return '';
    return `<a href="${tel(c.p)}"><div class="grow"><b>${esc(t)}</b><span class="sub">${esc(sub)}</span></div><span class="num">${esc(c.p.replace(/^\+420\s?/, ''))}</span><span class="call-dot">${ICON.phone}</span></a>`;
  }).join('') + `<a href="tel:158"><div class="grow"><b>Policie ČR</b><span class="sub">Násilí, ohrožené dítě, pohotovost OSPOD</span></div><span class="num">158</span><span class="call-dot">${ICON.phone}</span></a>`;
}
function renderGrid() {
  $('grid').innerHTML = SITUATIONS.map((s) => {
    const n = countFor(s);
    const sub = s.sub || (n + (n === 1 ? ' kontakt' : n >= 2 && n <= 4 ? ' kontakty' : ' kontaktů'));
    return `<button type="button" class="tile glass${s.wide ? ' wide' : ''}" data-sit="${s.id}"><span class="ico" aria-hidden="true">${s.ico}</span><span><b>${esc(s.title)}</b><small>${esc(sub)}</small></span></button>`;
  }).join('');
}
$('grid').addEventListener('click', (e) => { const t = e.target.closest('[data-sit]'); if (t) openSituation(t.dataset.sit, true); });

/* ---------- hledání ---------- */
const q = $('q');
function renderSearch() {
  const term = norm(q.value.trim());
  $('q-clear').hidden = !q.value;
  if (term.length < 2) { $('home').hidden = false; $('results').hidden = true; return; }
  $('home').hidden = true; $('results').hidden = false;
  const sitHits = SITUATIONS.filter((s) => norm(s.title).includes(term));
  let list = DATA.filter((c) => norm([c.n, c.o, c.d, c.a, c.x, (c.br || []).map((b) => b.a).join(' '), c.ok.map((o) => OKRES_NAME[o] || '').join(' '), c.t.join(' ')].join(' ')).includes(term));
  if (state.okres !== 'ALL') list = list.filter((c) => scope(c) !== 'LOCAL' || c.ok.includes(state.okres));
  list.sort(sortC);
  let html = '';
  if (sitHits.length) html += '<div class="section-label">Situace</div><div class="grid">' + sitHits.map((s) => `<button type="button" class="tile glass wide" data-sit="${s.id}"><span class="ico">${s.ico}</span><span><b>${esc(s.title)}</b></span></button>`).join('') + '</div>';
  html += `<div class="section-label">Kontakty<small>${list.length}${state.okres !== 'ALL' ? ' · ' + esc(OKRES_NAME[state.okres]) : ''}</small></div>`;
  html += list.length ? '<div class="list glass">' + list.map((c) => contactHtml(c, { term, showOkres: true })).join('') + '</div>'
    : '<div class="empty glass"><strong>Nic nenalezeno</strong>Zkus jiné slovo' + (state.okres !== 'ALL' ? ' nebo přepni na celý kraj' : '') + '.</div>';
  $('results').innerHTML = html;
}
q.addEventListener('input', renderSearch);
$('q-clear').addEventListener('click', () => { q.value = ''; renderSearch(); q.focus(); });
$('results').addEventListener('click', (e) => { const t = e.target.closest('[data-sit]'); if (t) openSituation(t.dataset.sit, true); });

/* ---------- situace ---------- */
let othersOpen = false, czOpen = false;
function openSituation(id, push) {
  const s = SITUATIONS.find((x) => x.id === id); if (!s) return;
  state.sit = s; state.ns = false; state.open = false; othersOpen = false; czOpen = false;
  state.scroll = window.scrollY;
  $('d-ico').textContent = s.ico;
  $('d-title').textContent = s.title;
  $('d-sub').textContent = s.sub || '';
  $('d-steps').innerHTML = s.steps.map((t) => '<li>' + t + '</li>').join('');
  $('d-key').querySelector('h3').textContent = s.crew ? 'Pro tebe' : 'Co dělat';
  $('okres-d').hidden = !!(s.onlyCZ || s.crew);
  $('ns-only').setAttribute('aria-pressed', 'false'); $('open-only').setAttribute('aria-pressed', 'false');
  renderSituationList();
  $('main-view').hidden = true; $('detail-view').hidden = false;
  $('detail-view').classList.remove('view-enter'); void $('detail-view').offsetWidth; $('detail-view').classList.add('view-enter');
  window.scrollTo(0, 0);
  if (push) history.pushState({ sit: id }, '', '#' + id);
}
function section(title, list, opts) {
  if (!list.length) return '';
  return `<div class="section-label">${esc(title)}<small>${list.length}</small></div><div class="list glass">${list.sort(sortC).map((c) => contactHtml(c, opts)).join('')}</div>`;
}
function czSection(cz) {
  if (!cz.length) return '';
  cz.sort(sortC);
  const show = czOpen ? cz : cz.slice(0, 4);
  return `<div class="section-label">Celostátní linky<small>${cz.length}</small></div><div class="list glass">${show.map((c) => contactHtml(c, {})).join('')}</div>` +
    (show.length < cz.length ? `<button type="button" class="text-btn" id="show-cz">Další celostátní linky (${cz.length - show.length})</button>` : '');
}
function renderSituationList() {
  const s = state.sit;
  let all = DATA.filter((c) => inSituation(c, s));
  if (state.ns) all = all.filter((c) => c.ns);
  if (state.open) all = all.filter(isOpen);
  const loc = all.filter((c) => scope(c) === 'LOCAL'), kraj = all.filter((c) => scope(c) === 'KRAJ'), cz = all.filter((c) => scope(c) === 'CZ');
  let html = '';
  if (s.onlyCZ || s.crew) {
    html = section(s.crew ? 'Kontakty' : 'Linky', all, {});
  } else if (state.okres === 'ALL') {
    html += section('Celý kraj', kraj, {});
    OKRESY.slice(1).forEach(([id]) => { html += section(OKRES_NAME[id], loc.filter((c) => c.ok.includes(id)), {}); });
    html += czSection(cz);
  } else {
    const mine = loc.filter((c) => c.ok.includes(state.okres));
    const others = loc.filter((c) => !c.ok.includes(state.okres));
    html += mine.length ? section('Okres ' + OKRES_NAME[state.okres], mine, {})
      : `<div class="section-label">Okres ${esc(OKRES_NAME[state.okres])}</div><div class="empty glass"><strong>V okrese nic</strong>Podívej se na celokrajské služby níže${others.length ? ' nebo do jiných okresů' : ''}.</div>`;
    html += section('Celý kraj', kraj, {});
    html += czSection(cz);
    if (others.length) {
      html += othersOpen ? section('Ostatní okresy', others, { showOkres: true })
        : `<button type="button" class="text-btn" id="show-others">Zobrazit i ostatní okresy (${others.length})</button>`;
    }
  }
  if (!all.length) html = '<div class="empty glass" style="margin-top:12px"><strong>Nic nenalezeno</strong>' + (state.ns || state.open ? 'Žádná služba teď neodpovídá filtru – vypni ho.' : '') + '</div>';
  $('d-list').innerHTML = html;
  const sc = $('show-cz'); if (sc) sc.addEventListener('click', () => { czOpen = true; renderSituationList(); });
  const so = $('show-others'); if (so) so.addEventListener('click', () => { othersOpen = true; renderSituationList(); });
}
$('ns-only').addEventListener('click', (e) => {
  state.ns = !state.ns; e.currentTarget.setAttribute('aria-pressed', state.ns); renderSituationList();
});
$('open-only').addEventListener('click', (e) => {
  state.open = !state.open; e.currentTarget.setAttribute('aria-pressed', state.open); renderSituationList();
});
function closeSituation() {
  if ($('detail-view').hidden) return;
  state.sit = null;
  $('detail-view').hidden = true; $('main-view').hidden = false;
  renderGrid();
  window.scrollTo(0, state.scroll || 0);
}
$('back').addEventListener('click', () => { if (history.state && history.state.sit) history.back(); else { history.replaceState(null, '', location.pathname); closeSituation(); } });
window.addEventListener('popstate', (e) => { if (e.state && e.state.sit) openSituation(e.state.sit, false); else closeSituation(); });

/* ---------- start ---------- */
$('foot-note').textContent = `${DATA.length} kontaktů ověřeno z webů poskytovatelů (${VERIFIED}). Přijetí a volnou kapacitu si vždy ověř telefonicky.`;
renderOkres(); renderHot(); renderGrid();
if (location.hash && SITUATIONS.some((s) => '#' + s.id === location.hash)) { history.replaceState(null, '', location.pathname); }
requestAnimationFrame(() => { const b = document.querySelector(`#okres [data-ok="${state.okres}"]`); if (b && state.okres !== 'ALL') b.scrollIntoView({ block: 'nearest', inline: 'center' }); });
</script>
</body>
</html>
