<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ResqVent">
<meta name="theme-color" content="#E4EEEF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#03141A" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">
<title>ResqVent®</title>
<style>
/* ResqVent – vzhled sladěný s ResqHubem */
:root {
  --bg: #E4EEEF;
  --ink: #0A1F23;
  --ink-2: rgba(10, 31, 35, .6);
  --ink-3: rgba(10, 31, 35, .34);
  --petrol: #0B6E79;
  --petrol-soft: rgba(11, 110, 121, .12);
  --on-petrol: #FFFFFF;
  --track: rgba(10, 31, 35, .1);
  --glow-a: rgba(11, 110, 121, .5);
  --glow-b: rgba(53, 194, 196, .4);
  --glass: rgba(255, 255, 255, .58);
  --glass-strong: rgba(250, 253, 253, .9);
  --glass-edge: rgba(255, 255, 255, .78);
  --glass-hi: rgba(255, 255, 255, .95);
  --glass-shadow: rgba(6, 55, 62, .13);
  --hairline: rgba(10, 31, 35, .1);
  --fill: rgba(10, 31, 35, .06);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", Roboto, sans-serif;
  --font-round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #03141A; --ink: #EAF6F7; --ink-2: rgba(234, 246, 247, .64); --ink-3: rgba(234, 246, 247, .32);
    --petrol: #3CC0CB; --petrol-soft: rgba(60, 192, 203, .14); --on-petrol: #03141A; --track: rgba(255, 255, 255, .12);
    --glow-a: rgba(11, 110, 121, .6); --glow-b: rgba(28, 157, 163, .3);
    --glass: rgba(255, 255, 255, .075); --glass-strong: rgba(22, 38, 43, .94);
    --glass-edge: rgba(255, 255, 255, .13); --glass-hi: rgba(255, 255, 255, .15); --glass-shadow: rgba(0, 0, 0, .45);
    --hairline: rgba(255, 255, 255, .1); --fill: rgba(255, 255, 255, .08);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #03141A; --ink: #EAF6F7; --ink-2: rgba(234, 246, 247, .64); --ink-3: rgba(234, 246, 247, .32);
  --petrol: #3CC0CB; --petrol-soft: rgba(60, 192, 203, .14); --on-petrol: #03141A; --track: rgba(255, 255, 255, .12);
  --glow-a: rgba(11, 110, 121, .6); --glow-b: rgba(28, 157, 163, .3);
  --glass: rgba(255, 255, 255, .075); --glass-strong: rgba(22, 38, 43, .94);
  --glass-edge: rgba(255, 255, 255, .13); --glass-hi: rgba(255, 255, 255, .15); --glass-shadow: rgba(0, 0, 0, .45);
  --hairline: rgba(255, 255, 255, .1); --fill: rgba(255, 255, 255, .08);
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body {
  position: relative; isolation: isolate; min-height: 100vh; overflow-x: hidden;
  font-family: var(--font); font-size: 17px; line-height: 1.3;
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--petrol); outline-offset: 2px; border-radius: 12px; }

.ambient { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
.ambient::before, .ambient::after { content: ""; position: absolute; border-radius: 50%; filter: blur(60px); }
.ambient::before { width: 130vw; height: 60vh; left: -40vw; top: -30vh; background: var(--glow-a); }
.ambient::after { width: 90vw; height: 44vh; right: -42vw; top: 6vh; background: var(--glow-b); }

.glass {
  background: var(--glass);
  -webkit-backdrop-filter: blur(26px) saturate(180%); backdrop-filter: blur(26px) saturate(180%);
  border: 1px solid var(--glass-edge);
  box-shadow: inset 0 1px 0 var(--glass-hi), 0 10px 30px -10px var(--glass-shadow);
}

.shell {
  max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px;
  padding: max(12px, env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
}

header { display: flex; align-items: center; justify-content: space-between; padding: 2px 2px 0; }
.logo { margin: 0; font-family: var(--font-display); font-size: 30px; font-weight: 800; letter-spacing: -.04em; line-height: 1; }
.logo sup { font-size: .38em; font-weight: 600; color: var(--ink-3); letter-spacing: 0; margin-left: 2px; }
.round-btn { width: 40px; height: 40px; border-radius: 50%; flex: none; display: grid; place-items: center; color: var(--ink); }
.round-btn svg { width: 19px; height: 19px; }
.round-btn:active { transform: scale(.92); }

.section-header { margin: 8px 6px -4px; font-size: 14px; font-weight: 600; color: var(--ink-2); }

/* ---------- Pacient ---------- */
.card { border-radius: 24px; overflow: hidden; }
.row { padding: 14px 16px; }
.row + .row { border-top: 1px solid var(--hairline); }

.segmented { position: relative; display: grid; grid-template-columns: 1fr 1fr; padding: 4px; border-radius: 16px; background: var(--fill); }
.segmented .thumb {
  position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); border-radius: 12px;
  background: var(--glass-strong); box-shadow: 0 3px 10px -2px var(--glass-shadow), 0 0 0 1px var(--glass-edge);
  transition: transform .32s cubic-bezier(.3, .7, .3, 1);
}
.segmented[data-sex="F"] .thumb { transform: translateX(100%); }
.segment {
  position: relative; z-index: 1; height: 40px; border: 0; background: none; border-radius: 12px;
  font-size: 15px; font-weight: 650; color: var(--ink-2); transition: color .2s;
}
.segment.active { color: var(--ink); }

.input-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.label-text { font-size: 15px; font-weight: 650; }
.label-text small { display: block; font-size: 12.5px; font-weight: 500; color: var(--ink-3); margin-top: 1px; }
.val-wrap { display: flex; align-items: baseline; gap: 4px; }
.val-input {
  width: 76px; height: 40px; border: 0; border-radius: 12px; background: var(--fill); padding: 0 8px;
  text-align: center; font-family: var(--font-round); font-size: 22px; font-weight: 800; color: var(--ink);
  outline: none; -moz-appearance: textfield;
}
.val-input::-webkit-outer-spin-button, .val-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.val-input:focus { box-shadow: 0 0 0 2px var(--petrol); }
.val-wrap span { font-size: 14px; font-weight: 600; color: var(--ink-2); width: 22px; }
input[type=range] {
  --p: 50%;
  -webkit-appearance: none; appearance: none; display: block; width: 100%; height: 10px; border-radius: 5px; margin: 16px 0 6px;
  background: linear-gradient(to right, var(--petrol) 0 var(--p), var(--track) var(--p) 100%); outline: none;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 30px; height: 30px; border-radius: 50%; background: #fff; border: 0;
  box-shadow: 0 3px 10px rgba(0, 0, 0, .22), 0 0 0 .5px rgba(0, 0, 0, .1);
}
input[type=range]::-moz-range-thumb { width: 30px; height: 30px; border-radius: 50%; background: #fff; border: 0; box-shadow: 0 3px 10px rgba(0, 0, 0, .22); }
input[type=range]:focus-visible { outline: 2px solid var(--petrol); outline-offset: 6px; }

/* ---------- Indikace ---------- */
.diag-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.diag-opt {
  min-height: 58px; padding: 10px 12px; border-radius: 16px; border: 1px solid var(--hairline); background: var(--glass);
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  text-align: left; color: var(--ink); transition: background .15s, border-color .15s, color .15s, transform .1s;
}
.diag-opt:active { transform: scale(.97); }
.diag-opt b { display: block; font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
.diag-opt span { display: block; font-size: 12.5px; color: var(--ink-2); margin-top: 1px; }
.diag-opt[aria-pressed="true"] { background: var(--petrol); border-color: var(--petrol); color: var(--on-petrol); box-shadow: 0 8px 20px -10px var(--petrol); }
.diag-opt[aria-pressed="true"] span { color: inherit; opacity: .8; }

/* ---------- Výsledek ---------- */
.result-card {
  border-radius: 28px; padding: 18px 20px 20px; color: #fff; text-align: center;
  background: linear-gradient(150deg, #16A3AE 0%, #0B6E79 55%, #074B53 100%);
  box-shadow: 0 16px 34px -16px rgba(11, 110, 121, .85);
}
.res-vt-sub { display: block; font-size: 15px; font-weight: 650; opacity: .85; }
.res-vt-val {
  display: block; margin: 4px 0 2px; font-family: var(--font-round); font-size: 64px; font-weight: 800;
  line-height: 1; letter-spacing: -.04em; font-variant-numeric: tabular-nums;
}
.res-vt-val small { font-size: 24px; font-weight: 700; letter-spacing: 0; opacity: .85; margin-left: 4px; }
.mode-box {
  display: inline-flex; align-items: center; gap: 8px; margin-top: 14px; min-height: 38px; padding: 6px 16px;
  border-radius: 19px; background: rgba(255, 255, 255, .18); border: 1px solid rgba(255, 255, 255, .28);
  font-size: 15px; font-weight: 700;
}
.mode-box svg { width: 17px; height: 17px; flex: none; }

.param-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.param-box { border-radius: 20px; padding: 14px 14px 15px; }
.p-label { display: block; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.p-val { display: block; margin-top: 4px; font-family: var(--font-round); font-size: 26px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
.p-unit { font-family: var(--font); font-size: 13px; font-weight: 600; color: var(--ink-3); margin-left: 2px; letter-spacing: 0; }

.note { margin: 2px 8px 0; font-size: 13px; color: var(--ink-3); text-align: center; line-height: 1.45; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
</style>
</head>
<body>
<div class="ambient" aria-hidden="true"></div>

<div class="shell">
  <header>
    <h1 class="logo">ResqVent<sup>®</sup></h1>
    <button class="round-btn glass" id="theme-toggle" type="button" aria-label="Přepnout světlý nebo tmavý režim">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 4v16"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
    </button>
  </header>

  <div class="section-header">Pacient</div>
  <div class="card glass">
    <div class="row">
      <div class="segmented" id="sex-switch" data-sex="M">
        <span class="thumb" aria-hidden="true"></span>
        <button type="button" id="sex-m" class="segment active" onclick="setSex('M')">Muž</button>
        <button type="button" id="sex-f" class="segment" onclick="setSex('F')">Žena</button>
      </div>
    </div>
    <div class="row">
      <div class="input-row">
        <label class="label-text" for="h-input">Výška<small>určuje ideální váhu</small></label>
        <div class="val-wrap">
          <input type="number" id="h-input" class="val-input" value="175" inputmode="numeric" oninput="sync('h-input', 'h-slider')" onclick="this.select()">
          <span>cm</span>
        </div>
      </div>
      <input type="range" id="h-slider" min="100" max="220" value="175" oninput="sync('h-slider', 'h-input')" aria-label="Výška v cm">
    </div>
    <div class="row">
      <div class="input-row">
        <label class="label-text" for="w-input">Skutečná hmotnost<small>jen orientačně, výpočet jede z IBW</small></label>
        <div class="val-wrap">
          <input type="number" id="w-input" class="val-input" value="85" inputmode="numeric" oninput="sync('w-input', 'w-slider')" onclick="this.select()">
          <span>kg</span>
        </div>
      </div>
      <input type="range" id="w-slider" min="30" max="200" value="85" oninput="sync('w-slider', 'w-input')" aria-label="Hmotnost v kg">
    </div>
  </div>

  <div class="section-header">Indikace</div>
  <div class="diag-grid" id="diag-grid">
    <button type="button" class="diag-opt" data-diag="norm" aria-pressed="true"><b>Zdravé plíce</b><span>Ostatní</span></button>
    <button type="button" class="diag-opt" data-diag="ards" aria-pressed="false"><b>ARDS</b><span>Lung protective</span></button>
    <button type="button" class="diag-opt" data-diag="copd" aria-pressed="false"><b>CHOPN</b><span>Obstrukce</span></button>
    <button type="button" class="diag-opt" data-diag="asth" aria-pressed="false"><b>Astma</b><span>Extrémní exspirium</span></button>
    <button type="button" class="diag-opt" data-diag="kpr" aria-pressed="false"><b>KPR</b><span>Kontinuálně</span></button>
    <button type="button" class="diag-opt" data-diag="head" aria-pressed="false"><b>CNS / neuro</b><span>Hyperventilace</span></button>
  </div>
  <input type="hidden" id="diag-select" value="norm">

  <div class="result-card" aria-live="polite">
    <span class="res-vt-sub" id="res-strategy">Ochranná ventilace</span>
    <span id="res-vt" class="res-vt-val">-- ml</span>
    <span class="res-vt-sub" id="res-ibw-info">IBW: -- kg</span>
    <div class="mode-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>
      <span id="res-mode">CMV / VC-CMV</span>
    </div>
  </div>

  <div class="section-header">Parametry</div>
  <div class="param-grid">
    <div class="param-box glass"><span class="p-label">Frekvence (f)</span><span class="p-val"><span id="p-freq">--</span><span class="p-unit">/min</span></span></div>
    <div class="param-box glass"><span class="p-label">PEEP</span><span class="p-val"><span id="p-peep">--</span><span class="p-unit">cmH₂O</span></span></div>
    <div class="param-box glass"><span class="p-label">Poměr I:E</span><span class="p-val" id="p-ie">--</span></div>
    <div class="param-box glass"><span class="p-label">Cílová SpO₂</span><span class="p-val" id="p-spo2">--</span></div>
  </div>
  <p class="note">Orientační výchozí nastavení. Ventilaci vždy upravuj podle stavu pacienta, EtCO₂ a platných postupů.</p>
</div>

<script>
    let sex = 'M';
    const THEME_KEY = 'resqvent:theme';

    function setSex(s) {
        sex = s;
        document.getElementById('sex-m').className = s==='M'?'segment active':'segment';
        document.getElementById('sex-f').className = s==='F'?'segment active':'segment';
        document.getElementById('sex-switch').dataset.sex = s;
        update();
    }

    // Synchronizace mezi sliderem a textovým polem
    function sync(sourceId, targetId) {
        const val = document.getElementById(sourceId).value;
        document.getElementById(targetId).value = val;
        update();
    }

    function paintRange(id) {
        const el = document.getElementById(id);
        const p = Math.min(100, Math.max(0, (el.value - el.min) / (el.max - el.min) * 100));
        el.style.setProperty('--p', p + '%');
    }

    function update() {
        const diag = document.getElementById('diag-select').value;
        const h = parseInt(document.getElementById('h-input').value) || 0;
        const w = parseInt(document.getElementById('w-input').value) || 0;
        paintRange('h-slider'); paintRange('w-slider');

        // IBW Výpočet (Devine Formula)
        let ibw = 0;
        if (h > 0) {
            ibw = (sex === 'M') ? 50 + 0.91 * (h - 152.4) : 45.5 + 0.91 * (h - 152.4);
        }
        if (ibw < 10) ibw = 10; // Failsafe pro malé hodnoty

        let mlKg = 6;
        let freq = "12–15";
        let peep = "5–8";
        let ie = "1:2";
        let spo2 = "94–98%";
        let strategy = "Ochranná ventilace";
        let mode = "CMV / VC-CMV";

        switch(diag) {
            case 'ards':
                mlKg = 6; freq = "20–25"; peep = "10–15"; spo2 = "88–92%";
                strategy = "ARDS Net (Striktní)";
                mode = "VC-CMV (Kontrolovaný)";
                break;
            case 'copd':
                mlKg = 8; freq = "10–12"; peep = "3–5"; ie = "1:3"; spo2 = "88–92%";
                strategy = "Obstrukční strategie";
                mode = "PC-BIPAP / PS";
                break;
            case 'asth':
                mlKg = 7; freq = "8–10"; peep = "0–3"; ie = "1:4 až 1:5"; spo2 = "90–94%";
                strategy = "Astma (Dlouhé exspirium)";
                mode = "PC-BIPAP / VC-CMV";
                break;
            case 'kpr':
                mlKg = 7; freq = "10"; peep = "5"; ie = "1:2"; spo2 = ">94%";
                strategy = "KPR Mode";
                mode = "VC-CMV (Plná ventilace)";
                break;
            case 'head':
                mlKg = 7; freq = "16–18"; peep = "5"; ie = "1:2"; spo2 = "100%";
                strategy = "Neuro (Hyperventilace)";
                mode = "VC-CMV (Zajistit pCO₂)";
                break;
        }

        const vt = Math.round(ibw * mlKg);
        document.getElementById('res-vt').innerHTML = (h > 0) ? vt + '<small>ml</small>' : '--<small>ml</small>';
        document.getElementById('res-strategy').innerText = strategy;
        document.getElementById('res-ibw-info').innerText = (h > 0) ? `${mlKg} ml/kg ideální váhy (IBW ${Math.round(ibw)} kg)` : "Zadejte výšku";
        document.getElementById('res-mode').innerText = mode;

        document.getElementById('p-freq').innerText = freq;
        document.getElementById('p-peep').innerText = peep;
        document.getElementById('p-ie').innerText = ie;
        document.getElementById('p-spo2').innerText = spo2;
    }

    document.getElementById('diag-grid').addEventListener('click', (e) => {
        const b = e.target.closest('.diag-opt');
        if (!b) return;
        document.getElementById('diag-select').value = b.dataset.diag;
        document.querySelectorAll('.diag-opt').forEach(x => x.setAttribute('aria-pressed', x === b));
        update();
    });

    // motiv: automaticky podle telefonu, tlačítkem lze přepnout
    try {
        const saved = localStorage.getItem(THEME_KEY);
        if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
    } catch (e) {}
    document.getElementById('theme-toggle').onclick = () => {
        const current = document.documentElement.dataset.theme ||
            (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        const next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.dataset.theme = next;
        try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
    };

    update();
</script>
</body>
</html>
