<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ResqO2">
<meta name="theme-color" content="#E4EEEF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#03141A" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">
<title>ResqO2®</title>
<style>
/* ResqO2 – vzhled sladěný s ResqHubem. Tlakoměr nahoře, nastavení pod ním. */
:root {
  --bg: #E4EEEF;
  --ink: #0A1F23;
  --ink-2: rgba(10, 31, 35, .6);
  --ink-3: rgba(10, 31, 35, .34);
  --petrol: #0B6E79;
  --petrol-soft: rgba(11, 110, 121, .12);
  --on-petrol: #FFFFFF;
  --alarm: #E5383B;
  --alarm-soft: rgba(229, 56, 59, .12);
  --track: rgba(10, 31, 35, .1);
  --glow-a: rgba(11, 110, 121, .5);
  --glow-b: rgba(53, 194, 196, .4);
  --glass: rgba(255, 255, 255, .58);
  --glass-strong: rgba(250, 253, 253, .9);
  --glass-edge: rgba(255, 255, 255, .78);
  --glass-hi: rgba(255, 255, 255, .95);
  --glass-shadow: rgba(6, 55, 62, .13);
  --hairline: rgba(10, 31, 35, .1);
  --fill: rgba(10, 31, 35, .06);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", Roboto, sans-serif;
  --font-round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #03141A; --ink: #EAF6F7; --ink-2: rgba(234, 246, 247, .64); --ink-3: rgba(234, 246, 247, .32);
    --petrol: #3CC0CB; --petrol-soft: rgba(60, 192, 203, .14); --on-petrol: #03141A;
    --alarm: #FF6B6E; --alarm-soft: rgba(255, 107, 110, .14); --track: rgba(255, 255, 255, .12);
    --glow-a: rgba(11, 110, 121, .6); --glow-b: rgba(28, 157, 163, .3);
    --glass: rgba(255, 255, 255, .075); --glass-strong: rgba(22, 38, 43, .94);
    --glass-edge: rgba(255, 255, 255, .13); --glass-hi: rgba(255, 255, 255, .15); --glass-shadow: rgba(0, 0, 0, .45);
    --hairline: rgba(255, 255, 255, .1); --fill: rgba(255, 255, 255, .08);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #03141A; --ink: #EAF6F7; --ink-2: rgba(234, 246, 247, .64); --ink-3: rgba(234, 246, 247, .32);
  --petrol: #3CC0CB; --petrol-soft: rgba(60, 192, 203, .14); --on-petrol: #03141A;
  --alarm: #FF6B6E; --alarm-soft: rgba(255, 107, 110, .14); --track: rgba(255, 255, 255, .12);
  --glow-a: rgba(11, 110, 121, .6); --glow-b: rgba(28, 157, 163, .3);
  --glass: rgba(255, 255, 255, .075); --glass-strong: rgba(22, 38, 43, .94);
  --glass-edge: rgba(255, 255, 255, .13); --glass-hi: rgba(255, 255, 255, .15); --glass-shadow: rgba(0, 0, 0, .45);
  --hairline: rgba(255, 255, 255, .1); --fill: rgba(255, 255, 255, .08);
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body {
  position: relative; isolation: isolate; min-height: 100vh; overflow-x: hidden;
  font-family: var(--font); font-size: 17px; line-height: 1.3;
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
  -webkit-user-select: none; user-select: none;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--petrol); outline-offset: 2px; border-radius: 12px; }

.ambient { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
.ambient::before, .ambient::after { content: ""; position: absolute; border-radius: 50%; filter: blur(60px); }
.ambient::before { width: 130vw; height: 60vh; left: -40vw; top: -30vh; background: var(--glow-a); }
.ambient::after { width: 90vw; height: 44vh; right: -42vw; top: 6vh; background: var(--glow-b); }

.glass {
  background: var(--glass);
  -webkit-backdrop-filter: blur(26px) saturate(180%); backdrop-filter: blur(26px) saturate(180%);
  border: 1px solid var(--glass-edge);
  box-shadow: inset 0 1px 0 var(--glass-hi), 0 10px 30px -10px var(--glass-shadow);
}

.shell {
  max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px;
  padding: max(12px, env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
}

header { display: flex; align-items: center; justify-content: space-between; padding: 2px 2px 0; }
.logo { margin: 0; font-family: var(--font-display); font-size: 30px; font-weight: 800; letter-spacing: -.04em; line-height: 1; }
.logo sub { font-size: .55em; vertical-align: -.12em; letter-spacing: 0; }
.logo sup { font-size: .38em; font-weight: 600; color: var(--ink-3); letter-spacing: 0; margin-left: 2px; }
.round-btn { width: 40px; height: 40px; border-radius: 50%; flex: none; display: grid; place-items: center; color: var(--ink); }
.round-btn svg { width: 19px; height: 19px; }
.round-btn:active { transform: scale(.92); }

/* ---------- Tlakoměr s výsledkem ---------- */
.result-card { border-radius: 28px; padding: 16px 16px 18px; text-align: center; }
.gauge { position: relative; width: min(100%, 290px); margin: 0 auto; aspect-ratio: 2 / 1.18; }
.gauge svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.gauge .g-track { stroke: var(--track); }
.gauge .g-val { stroke: var(--petrol); transition: stroke-dashoffset .35s cubic-bezier(.3, .7, .3, 1), stroke .2s; }
.gauge .g-res { stroke: var(--alarm); opacity: .55; }
.gauge .g-tick { font-family: var(--font-round); font-size: 9px; font-weight: 700; fill: var(--ink-3); }
.alarm .gauge .g-val { stroke: var(--alarm); }
.gauge-center { position: absolute; left: 0; right: 0; bottom: 4%; display: flex; flex-direction: column; align-items: center; }
.time-left {
  font-family: var(--font-round); font-size: 72px; font-weight: 800; line-height: .9; letter-spacing: -.04em;
  color: var(--petrol); font-variant-numeric: tabular-nums; transition: color .2s;
}
.alarm .time-left { color: var(--alarm); }
.time-label { margin-top: 4px; font-size: 15px; font-weight: 650; color: var(--ink-2); }
.eta-box {
  display: inline-flex; align-items: center; gap: 8px; margin-top: 14px; height: 40px; padding: 0 18px; border-radius: 20px;
  background: var(--petrol-soft); color: var(--petrol); font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums;
  transition: background .2s, color .2s;
}
.eta-box svg { width: 18px; height: 18px; }
.alarm .eta-box { background: var(--alarm); color: #fff; box-shadow: 0 8px 20px -8px var(--alarm); }
.reserve-note { margin: 10px 0 0; font-size: 13px; color: var(--ink-3); }

/* ---------- Nastavení ---------- */
.group { border-radius: 24px; overflow: hidden; }
.row { padding: 14px 16px 16px; }
.row + .row { border-top: 1px solid var(--hairline); }
.row-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.row-head .label { font-size: 15px; font-weight: 650; }
.row-head .sub { font-size: 13px; color: var(--ink-3); }
.value { font-family: var(--font-round); font-size: 30px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.value .unit { font-family: var(--font); font-size: 15px; font-weight: 600; color: var(--ink-2); margin-left: 4px; letter-spacing: 0; }

.segmented {
  position: relative; display: grid; grid-template-columns: 1fr 1fr; padding: 4px; margin-top: 10px;
  border-radius: 16px; background: var(--fill);
}
.segmented .thumb {
  position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); border-radius: 12px;
  background: var(--petrol); box-shadow: 0 4px 12px -4px var(--petrol);
  transition: transform .32s cubic-bezier(.3, .7, .3, 1);
}
.segmented[data-vol="10"] .thumb { transform: translateX(100%); }
.sel-opt {
  position: relative; z-index: 1; height: 44px; border: 0; background: none; border-radius: 12px;
  font-family: var(--font-round); font-size: 18px; font-weight: 750; color: var(--ink-2); transition: color .2s;
}
.sel-opt.active { color: var(--on-petrol); }

.slider-line { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
.step {
  width: 40px; height: 40px; border-radius: 50%; border: 0; flex: none; background: var(--fill); color: var(--petrol);
  font-size: 22px; font-weight: 600; line-height: 1; display: grid; place-items: center;
}
.step:active { transform: scale(.92); }
input[type=range] {
  --p: 50%;
  -webkit-appearance: none; appearance: none; flex: 1; min-width: 0; height: 10px; border-radius: 5px; margin: 0;
  background: linear-gradient(to right, var(--petrol) 0 var(--p), var(--track) var(--p) 100%); outline: none;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 30px; height: 30px; border-radius: 50%; background: #fff; border: 0;
  box-shadow: 0 3px 10px rgba(0, 0, 0, .22), 0 0 0 .5px rgba(0, 0, 0, .1);
}
input[type=range]::-moz-range-thumb {
  width: 30px; height: 30px; border-radius: 50%; background: #fff; border: 0;
  box-shadow: 0 3px 10px rgba(0, 0, 0, .22);
}
input[type=range]:focus-visible { outline: 2px solid var(--petrol); outline-offset: 6px; }

.presets { display: flex; gap: 8px; margin-top: 12px; }
.preset {
  flex: 1; height: 34px; border-radius: 17px; border: 1px solid var(--hairline); background: var(--fill);
  font-family: var(--font-round); font-size: 15px; font-weight: 700; color: var(--ink);
}
.preset[aria-pressed="true"] { background: var(--petrol); border-color: var(--petrol); color: var(--on-petrol); }
.preset:active { transform: scale(.95); }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
</style>
</head>
<body>
<div class="ambient" aria-hidden="true"></div>

<div class="shell">
  <header>
    <h1 class="logo">ResqO<sub>2</sub><sup>®</sup></h1>
    <button class="round-btn glass" id="theme-toggle" type="button" aria-label="Přepnout světlý nebo tmavý režim">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 4v16"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
    </button>
  </header>

  <!-- Výsledek: zbývající čas a tlak na tlakoměru -->
  <section class="result-card glass" id="result" aria-live="polite">
    <div class="gauge">
      <svg viewBox="0 0 200 118" aria-hidden="true">
        <path class="g-track" d="M 16 102 A 84 84 0 0 1 184 102" fill="none" stroke-width="14" stroke-linecap="round"/>
        <path class="g-res" id="g-res" d="M 16 102 A 84 84 0 0 1 184 102" fill="none" stroke-width="14" stroke-linecap="round"/>
        <path class="g-val" id="g-val" d="M 16 102 A 84 84 0 0 1 184 102" fill="none" stroke-width="14" stroke-linecap="round"/>
        <text class="g-tick" x="16" y="116" text-anchor="middle">0</text>
        <text class="g-tick" x="100" y="10" text-anchor="middle">100</text>
        <text class="g-tick" x="184" y="116" text-anchor="middle">200 bar</text>
      </svg>
      <div class="gauge-center">
        <div class="time-left" id="res-time">60</div>
        <div class="time-label">minut zbývá</div>
      </div>
    </div>
    <div class="eta-box" id="res-eta-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span id="res-eta">Dojde v 17:05</span>
    </div>
    <p class="reserve-note">Výpočet s rezervou 5 bar, max. tlak lahve 200 bar</p>
  </section>

  <!-- Nastavení -->
  <section class="group glass">
    <div class="row">
      <div class="row-head"><span class="label">Velikost lahve</span><span class="sub">objem vody</span></div>
      <div class="segmented" id="vol-switch" data-vol="2">
        <span class="thumb" aria-hidden="true"></span>
        <button type="button" id="opt-2" class="sel-opt active" onclick="setVolume(2)" aria-pressed="true">2 L</button>
        <button type="button" id="opt-10" class="sel-opt" onclick="setVolume(10)" aria-pressed="false">10 L</button>
      </div>
    </div>

    <div class="row">
      <div class="row-head">
        <label class="label" for="press-slider">Aktuální tlak v lahvi</label>
        <div class="value" id="val-press">150<span class="unit">bar</span></div>
      </div>
      <div class="slider-line">
        <button type="button" class="step" onclick="nudge('press-slider', -5)" aria-label="Ubrat 5 bar">−</button>
        <input type="range" id="press-slider" min="5" max="200" value="150" step="5" oninput="update()">
        <button type="button" class="step" onclick="nudge('press-slider', 5)" aria-label="Přidat 5 bar">+</button>
      </div>
    </div>

    <div class="row">
      <div class="row-head">
        <label class="label" for="flow-slider">Průtok</label>
        <div class="value" id="val-flow">5<span class="unit">l/min</span></div>
      </div>
      <div class="slider-line">
        <button type="button" class="step" onclick="nudge('flow-slider', -1)" aria-label="Ubrat 1 l/min">−</button>
        <input type="range" id="flow-slider" min="1" max="25" value="5" step="1" oninput="update()">
        <button type="button" class="step" onclick="nudge('flow-slider', 1)" aria-label="Přidat 1 l/min">+</button>
      </div>
      <div class="presets" id="presets">
        <button type="button" class="preset" data-flow="2">2</button>
        <button type="button" class="preset" data-flow="5">5</button>
        <button type="button" class="preset" data-flow="10">10</button>
        <button type="button" class="preset" data-flow="15">15</button>
      </div>
    </div>
  </section>
</div>

<script>
    let volume = 2;
    const THEME_KEY = 'resqo2:theme';
    const ARC = Math.PI * 84;          // délka oblouku tlakoměru

    function setVolume(v) {
        volume = v;
        document.getElementById('opt-2').classList.toggle('active', v === 2);
        document.getElementById('opt-10').classList.toggle('active', v === 10);
        document.getElementById('opt-2').setAttribute('aria-pressed', v === 2);
        document.getElementById('opt-10').setAttribute('aria-pressed', v === 10);
        document.getElementById('vol-switch').dataset.vol = v;
        update();
    }

    function nudge(id, delta) {
        const el = document.getElementById(id);
        el.value = Math.min(+el.max, Math.max(+el.min, +el.value + delta));
        update();
    }

    function paintRange(el) {
        el.style.setProperty('--p', ((el.value - el.min) / (el.max - el.min) * 100) + '%');
    }

    function update() {
        const pressEl = document.getElementById('press-slider');
        const flowEl = document.getElementById('flow-slider');
        const press = parseInt(pressEl.value);
        const flow = parseInt(flowEl.value);
        paintRange(pressEl); paintRange(flowEl);

        document.getElementById('val-press').innerHTML = `${press}<span class="unit">bar</span>`;
        document.getElementById('val-flow').innerHTML = `${flow}<span class="unit">l/min</span>`;
        document.querySelectorAll('.preset').forEach(b => b.setAttribute('aria-pressed', +b.dataset.flow === flow));

        // Výpočet: (Tlak - 5 bar rezerva) * Objem / Průtok
        let minutes = Math.floor(((press - 5) * volume) / flow);
        if (minutes < 0) minutes = 0;

        document.getElementById('res-time').innerText = minutes;

        // tlakoměr: plný oblouk = 200 bar, červený začátek = rezerva 5 bar
        document.getElementById('g-val').setAttribute('stroke-dasharray', ARC);
        document.getElementById('g-val').setAttribute('stroke-dashoffset', ARC * (1 - press / 200));
        document.getElementById('g-res').setAttribute('stroke-dasharray', `${ARC * 5 / 200} ${ARC}`);

        // Výpočet času dojezdu (ETA)
        const now = new Date();
        const eta = new Date(now.getTime() + minutes * 60000);
        const timeStr = eta.getHours().toString().padStart(2, '0') + ':' + eta.getMinutes().toString().padStart(2, '0');

        document.getElementById('res-eta').innerText = minutes > 0 ? `Dojde v ${timeStr}` : 'Láhev je prázdná';
        document.getElementById('result').classList.toggle('alarm', minutes < 10);
    }

    // motiv: automaticky podle telefonu, tlačítkem lze přepnout
    try {
        const saved = localStorage.getItem(THEME_KEY);
        if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
    } catch (e) {}
    document.getElementById('theme-toggle').onclick = () => {
        const current = document.documentElement.dataset.theme ||
            (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        const next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.dataset.theme = next;
        try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
    };

    document.getElementById('presets').addEventListener('click', (e) => {
        const b = e.target.closest('.preset');
        if (!b) return;
        document.getElementById('flow-slider').value = b.dataset.flow;
        update();
    });

    // Spustit úvodní výpočet
    update();
</script>
</body>
</html>
