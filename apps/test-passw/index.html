<meta charset="utf-8">

<meta name="robots" content="noindex">
<title>Test PASSW</title>
<style>
:root{--bg:#E4EEEF;--ink:#0A1F23;--ink2:rgba(10,31,35,.58);--petrol:#0B6E79;--on:#fff;--glass:rgba(255,255,255,.6);--edge:rgba(255,255,255,.8);--field:rgba(10,31,35,.06);--glow:rgba(11,110,121,.45);--err:#E5383B;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#03141A;--ink:#EAF6F7;--ink2:rgba(234,246,247,.62);--petrol:#3CC0CB;--on:#03141A;--glass:rgba(255,255,255,.07);--edge:rgba(255,255,255,.13);--field:rgba(255,255,255,.08);--glow:rgba(11,110,121,.6);--err:#FF6B6E;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px 16px;
background:radial-gradient(90% 60% at 20% 0%,var(--glow),transparent 70%),var(--bg)}
.card{width:100%;max-width:360px;padding:30px 22px 24px;border-radius:30px;text-align:center;background:var(--glass);border:1px solid var(--edge);
-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);box-shadow:0 20px 50px -20px rgba(0,0,0,.3)}
.lock{width:64px;height:64px;margin:0 auto 16px;border-radius:18px;display:grid;place-items:center;color:#fff;background:linear-gradient(150deg,#22C1C9,#0B6E79)}
.lock svg{width:30px;height:30px}h1{margin:0;font-size:24px;letter-spacing:-.02em}p{margin:6px 0 22px;color:var(--ink2);font-size:15px}
form{display:flex;flex-direction:column;gap:12px}
input[type=password]{width:100%;height:50px;border:0;border-radius:16px;background:var(--field);padding:0 16px;font-size:17px;color:var(--ink);outline:none}
input[type=password]:focus{box-shadow:0 0 0 2px var(--petrol)}
label{display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;color:var(--ink2)}
label input{width:18px;height:18px;accent-color:var(--petrol)}
button{height:50px;border:0;border-radius:25px;background:var(--petrol);color:var(--on);font-size:17px;font-weight:650}
button:disabled{opacity:.6}.err{margin:2px 0 0;color:var(--err);font-size:14px;font-weight:550}
.shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
</style>
</head>
<body>
<main class="card" id="card">
<div class="lock" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg></div>
<h1>Test PASSW</h1>
<p>Aplikace je zamčená heslem.</p>
<form id="form">
<input type="password" id="pw" placeholder="Heslo" autocomplete="current-password" aria-label="Heslo" required>
<label><input type="checkbox" id="remember" checked> Zapamatovat v tomto telefonu</label>
<button type="submit" id="go">Odemknout</button>
<div class="err" id="err" role="alert" hidden>Špatné heslo. Zkus to znovu.</div>
</form>
</main>
