<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ResqPedi®</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ResqPedi">
<meta name="theme-color" content="#E4EEEF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#03141A" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">
<style>
/* ResqPedi – vzhled sladěný s ResqHubem. Barvy Broselowova pásku zůstávají jako funkční prvek. */
:root {
  --bg: #E4EEEF;
  --ink: #0A1F23;
  --ink-2: rgba(10, 31, 35, .6);
  --ink-3: rgba(10, 31, 35, .34);
  --petrol: #0B6E79;
  --petrol-soft: rgba(11, 110, 121, .12);
  --on-petrol: #FFFFFF;
  --alarm: #E5383B;
  --glow-a: rgba(11, 110, 121, .5);
  --glow-b: rgba(53, 194, 196, .4);
  --glass: rgba(255, 255, 255, .58);
  --glass-strong: rgba(250, 253, 253, .92);
  --glass-edge: rgba(255, 255, 255, .78);
  --glass-hi: rgba(255, 255, 255, .95);
  --glass-shadow: rgba(6, 55, 62, .13);
  --sheet: #EEF4F4;
  --hairline: rgba(10, 31, 35, .1);
  --fill: rgba(10, 31, 35, .06);
  --triage-red: #E5383B;
  --triage-yellow: #F5B400;
  --triage-green: #2DB36A;
  --triage-black: #1C1C1E;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", Roboto, sans-serif;
  --font-round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #03141A; --ink: #EAF6F7; --ink-2: rgba(234, 246, 247, .64); --ink-3: rgba(234, 246, 247, .32);
    --petrol: #3CC0CB; --petrol-soft: rgba(60, 192, 203, .14); --on-petrol: #03141A; --alarm: #FF6B6E;
    --glow-a: rgba(11, 110, 121, .6); --glow-b: rgba(28, 157, 163, .3);
    --glass: rgba(255, 255, 255, .075); --glass-strong: rgba(22, 38, 43, .94);
    --glass-edge: rgba(255, 255, 255, .13); --glass-hi: rgba(255, 255, 255, .15); --glass-shadow: rgba(0, 0, 0, .45);
    --sheet: #0B1E23; --hairline: rgba(255, 255, 255, .1); --fill: rgba(255, 255, 255, .08);
    --triage-black: #3A3A3C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #03141A; --ink: #EAF6F7; --ink-2: rgba(234, 246, 247, .64); --ink-3: rgba(234, 246, 247, .32);
  --petrol: #3CC0CB; --petrol-soft: rgba(60, 192, 203, .14); --on-petrol: #03141A; --alarm: #FF6B6E;
  --glow-a: rgba(11, 110, 121, .6); --glow-b: rgba(28, 157, 163, .3);
  --glass: rgba(255, 255, 255, .075); --glass-strong: rgba(22, 38, 43, .94);
  --glass-edge: rgba(255, 255, 255, .13); --glass-hi: rgba(255, 255, 255, .15); --glass-shadow: rgba(0, 0, 0, .45);
  --sheet: #0B1E23; --hairline: rgba(255, 255, 255, .1); --fill: rgba(255, 255, 255, .08);
  --triage-black: #3A3A3C;
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body {
  position: relative; isolation: isolate; min-height: 100vh; overflow-x: hidden;
  font-family: var(--font); font-size: 17px; line-height: 1.3;
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
}
body.locked { overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--petrol); outline-offset: 2px; border-radius: 12px; }

.ambient { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
.ambient::before, .ambient::after { content: ""; position: absolute; border-radius: 50%; filter: blur(60px); }
.ambient::before { width: 130vw; height: 60vh; left: -40vw; top: -30vh; background: var(--glow-a); }
.ambient::after { width: 90vw; height: 44vh; right: -42vw; top: 6vh; background: var(--glow-b); }

.glass {
  background: var(--glass);
  -webkit-backdrop-filter: blur(26px) saturate(180%); backdrop-filter: blur(26px) saturate(180%);
  border: 1px solid var(--glass-edge);
  box-shadow: inset 0 1px 0 var(--glass-hi), 0 10px 30px -10px var(--glass-shadow);
}

/* ---------- Úvodní animace (Broselowův pásek) ---------- */
#intro-layer {
  position: fixed; inset: 0; z-index: 9999; overflow: hidden; background: #000;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  transition: opacity .5s ease-out, visibility .5s;
}
.intro-stripes { position: absolute; inset: 0; display: flex; }
.intro-stripe { flex: 1; height: 100%; transform: translateY(110%); animation: swipeUp .5s cubic-bezier(.22, 1, .36, 1) forwards; }
.intro-stripe:nth-child(1) { background: #808080; animation-delay: .05s; }
.intro-stripe:nth-child(2) { background: #FFC0CB; animation-delay: .1s; }
.intro-stripe:nth-child(3) { background: #FF3B30; animation-delay: .15s; }
.intro-stripe:nth-child(4) { background: #af52de; animation-delay: .2s; }
.intro-stripe:nth-child(5) { background: #FFCC00; animation-delay: .25s; }
.intro-stripe:nth-child(6) { background: #e8e8e8; animation-delay: .3s; }
.intro-stripe:nth-child(7) { background: #007AFF; animation-delay: .35s; }
.intro-stripe:nth-child(8) { background: #FF9500; animation-delay: .4s; }
.intro-stripe:nth-child(9) { background: #4CD964; animation-delay: .45s; }
@keyframes swipeUp { to { transform: translateY(0); } }
.intro-mark { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; }
.intro-logo {
  color: #fff; font-family: var(--font-display); font-size: 60px; font-weight: 800; letter-spacing: -.045em;
  text-shadow: 0 2px 30px rgba(0, 0, 0, .7), 0 0 80px rgba(0, 0, 0, .5);
  opacity: 0; transform: scale(.85); animation: popLogo .5s cubic-bezier(.34, 1.56, .64, 1) .7s forwards;
}
.intro-logo sup { font-size: .38em; opacity: .8; letter-spacing: 0; }
.intro-brand { color: rgba(255, 255, 255, .6); font-size: 13px; font-weight: 500; letter-spacing: .08em; margin-top: 2px; opacity: 0; animation: fade .5s ease-out 1s forwards; }
@keyframes popLogo { to { opacity: 1; transform: scale(1); } }
@keyframes fade { to { opacity: 1; } }
.intro-hidden { opacity: 0; visibility: hidden; }

/* ---------- Kostra ---------- */
.shell { max-width: 640px; margin: 0 auto; padding: max(12px, env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom)); }
header { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 2px 2px 12px; }
.app-title { margin: 0; font-family: var(--font-display); font-size: 30px; font-weight: 800; letter-spacing: -.04em; line-height: 1; }
.app-title sup { font-size: .38em; font-weight: 600; color: var(--ink-3); letter-spacing: 0; margin-left: 2px; }
.head-btns { display: flex; gap: 8px; }
.round-btn { width: 42px; height: 42px; border-radius: 50%; flex: none; display: grid; place-items: center; color: var(--ink); }
.round-btn svg { width: 20px; height: 20px; }
.round-btn:active { transform: scale(.92); }
.tools-btn { display: inline-flex; align-items: center; gap: 6px; height: 42px; padding: 0 16px 0 12px; border-radius: 21px; font-weight: 650; font-size: 15px; color: var(--ink); }
.tools-btn svg { width: 19px; height: 19px; color: var(--petrol); }
.tools-btn:active { transform: scale(.95); }

/* ---------- Pacient ---------- */
.patient { border-radius: 26px; padding: 14px; }
.patient-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.info-box { border-radius: 18px; background: var(--fill); padding: 10px 12px 12px; }
.label-top { display: block; font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; }
.input-group { display: flex; gap: 8px; }
.input-stack { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; }
.edit-input {
  width: 100%; height: 48px; border: 0; border-radius: 12px; background: var(--glass-strong);
  text-align: center; font-family: var(--font-round); font-size: 26px; font-weight: 800; color: var(--ink);
  outline: none; -moz-appearance: textfield; box-shadow: 0 1px 2px rgba(0, 0, 0, .06);
}
.edit-input::-webkit-outer-spin-button, .edit-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.edit-input:focus { box-shadow: 0 0 0 2px var(--petrol); }
.unit-label { font-size: 12.5px; font-weight: 600; color: var(--ink-3); margin-top: 4px; }

.slider-section { margin-top: 14px; }
.broselow-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.broselow-row .label-top { margin: 0; }
#broselow-badge {
  display: inline-flex; align-items: center; height: 34px; padding: 0 14px; border-radius: 17px;
  font-weight: 800; font-size: 15px; letter-spacing: .01em; font-variant-numeric: tabular-nums;
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12), 0 6px 14px -8px rgba(0, 0, 0, .4);
}
input[type=range] {
  -webkit-appearance: none; appearance: none; display: block; width: 100%; height: 16px; border-radius: 8px; margin: 0;
  background: linear-gradient(to right, #808080 0% 5%, #FFC0CB 5% 10%, #FF3B30 10% 20%, #af52de 20% 30%, #FFCC00 30% 45%, #ffffff 45% 60%, #007AFF 60% 80%, #FF9500 80% 90%, #4CD964 90% 100%);
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12); outline: none;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 34px; height: 34px; border-radius: 50%; background: #fff; border: 0;
  box-shadow: 0 3px 12px rgba(0, 0, 0, .3), 0 0 0 .5px rgba(0, 0, 0, .15);
}
input[type=range]::-moz-range-thumb { width: 34px; height: 34px; border-radius: 50%; background: #fff; border: 0; box-shadow: 0 3px 12px rgba(0, 0, 0, .3); }
input[type=range]:focus-visible { outline: 2px solid var(--petrol); outline-offset: 6px; }
.range-scale { display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

/* ---------- Záložky (lepivá lišta) ---------- */
.tabbar {
  position: sticky; top: 0; z-index: 30; margin: 14px -16px 0; padding: max(8px, env(safe-area-inset-top)) 16px 10px;
  transition: background-color .2s, box-shadow .2s;
}
.tabbar.stuck {
  background: color-mix(in srgb, var(--bg) 70%, transparent);
  -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%);
  box-shadow: 0 1px 0 var(--hairline);
}
.mini-patient {
  display: none; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 14px; font-weight: 650; color: var(--ink-2);
  font-variant-numeric: tabular-nums;
}
.tabbar.stuck .mini-patient { display: flex; }
.mini-patient .swatch { width: 14px; height: 14px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .15); }
.mini-patient b { color: var(--ink); }
.tab-nav { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
.tab-nav::-webkit-scrollbar { display: none; }
.tab-item {
  flex: none; height: 38px; padding: 0 15px; border-radius: 19px; border: 1px solid var(--hairline);
  background: var(--glass); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  font-size: 15px; font-weight: 650; color: var(--ink-2); white-space: nowrap;
}
.tab-item.active { background: var(--petrol); border-color: var(--petrol); color: var(--on-petrol); }

/* ---------- Seznamy ---------- */
.section-header { margin: 18px 6px 8px; font-size: 14px; font-weight: 600; color: var(--ink-2); }
.group { border-radius: 22px; overflow: hidden; }
.group > * + * { border-top: 1px solid var(--hairline); }
.list-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 13px 16px; min-height: 52px; }
.list-row.tap { cursor: pointer; }
.list-row.tap:active { background: var(--fill); }
.list-label { font-size: 16px; font-weight: 550; min-width: 0; }
.drug-sub-label { display: block; font-size: 13px; font-weight: 500; color: var(--ink-2); margin-top: 2px; }
.list-val-wrapper { display: flex; align-items: baseline; gap: 4px; flex: none; text-align: right; }
.list-val { font-family: var(--font-round); font-size: 20px; font-weight: 800; color: var(--petrol); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.list-unit-fixed { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.expand-icon { width: 12px; height: 12px; color: var(--ink-3); margin-left: 4px; align-self: center; transition: transform .25s; }
.row-open .expand-icon { transform: rotate(180deg); }

.variant-container { display: none; background: var(--fill); padding: 4px 0; }
.variant-container.open { display: block; }
.variant-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 16px; }
.variant-info { display: flex; align-items: center; gap: 8px; font-size: 14.5px; font-weight: 550; }
.route { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 11px; font-size: 12px; font-weight: 700; color: #fff; }
.route.iv { background: #E0484B; } .route.im { background: #9B59D0; } .route.pr { background: #A0683C; } .route.in { background: #2DA866; }
.variant-val { font-family: var(--font-round); font-weight: 800; color: var(--petrol); font-variant-numeric: tabular-nums; text-align: right; }
.variant-val small { display: block; font-family: var(--font); font-size: 12px; font-weight: 600; color: var(--ink-2); }
.variant-note { padding: 8px 16px 10px; font-size: 13px; color: var(--ink-2); line-height: 1.4; }

/* ---------- Panely (nástroje) ---------- */
.overlay { position: fixed; inset: 0; z-index: 250; background: rgba(2, 20, 24, .42); opacity: 0; pointer-events: none; transition: opacity .3s; }
.overlay.open { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 300; max-width: 640px; margin: 0 auto;
  background: var(--sheet); border-radius: 30px 30px 0 0; box-shadow: 0 -10px 40px rgba(0, 0, 0, .2);
  transform: translateY(105%); transition: transform .4s cubic-bezier(.32, .72, 0, 1);
  display: flex; flex-direction: column; max-height: calc(100% - max(16px, env(safe-area-inset-top)));
}
.sheet.open { transform: none; }
.sheet.tall { height: calc(100% - max(16px, env(safe-area-inset-top))); }
.grabber { width: 38px; height: 5px; border-radius: 3px; background: var(--ink-3); margin: 8px auto 0; flex: none; }
.sheet-head { position: relative; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 8px 14px; min-height: 54px; }
.sheet-head h2 { position: absolute; left: 60px; right: 60px; text-align: center; margin: 0; font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sheet-head .round-btn { width: 38px; height: 38px; }
.sheet-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 16px calc(24px + env(safe-area-inset-bottom)); }

.drawer-item { display: flex; align-items: center; gap: 14px; width: 100%; padding: 13px 16px; border: 0; background: none; text-align: left; color: var(--ink); }
.drawer-item:active { background: var(--fill); }
.drawer-item .ic { width: 38px; height: 38px; border-radius: 11px; flex: none; display: grid; place-items: center; color: #fff; }
.drawer-item .ic svg { width: 20px; height: 20px; }
.drawer-item b { display: block; font-size: 16px; font-weight: 650; }
.drawer-item span.sub { display: block; font-size: 13px; color: var(--ink-2); margin-top: 1px; }
.drawer-item .grow { flex: 1; min-width: 0; }
.chev { width: 8px; height: 14px; color: var(--ink-3); flex: none; }

/* kalkulačka ředění */
.search-box { position: relative; margin-bottom: 14px; }
.search-field { display: flex; align-items: center; gap: 8px; height: 50px; padding: 0 12px 0 14px; border-radius: 16px; background: var(--glass-strong); border: 1px solid var(--glass-edge); box-shadow: 0 6px 18px -10px var(--glass-shadow); }
.search-field svg { width: 19px; height: 19px; color: var(--ink-2); flex: none; }
.search-field input { flex: 1; min-width: 0; height: 100%; border: 0; background: none; outline: none; font-size: 17px; }
.search-field input::placeholder { color: var(--ink-2); }
.clear-btn { width: 26px; height: 26px; border: 0; border-radius: 50%; display: grid; place-items: center; background: var(--fill); color: var(--ink-2); flex: none; }
.clear-btn svg { width: 11px; height: 11px; }
#drug-scroll-list {
  position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 20; max-height: 240px; overflow-y: auto;
  border-radius: 16px; background: var(--glass-strong); border: 1px solid var(--glass-edge);
  -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); box-shadow: 0 16px 40px -12px rgba(0, 0, 0, .35);
}
.drug-opt { display: block; width: 100%; padding: 12px 14px; border: 0; background: none; text-align: left; font-size: 16px; font-weight: 600; color: var(--ink); }
.drug-opt + .drug-opt { border-top: 1px solid var(--hairline); }
.drug-opt:active { background: var(--fill); }

.calc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
.calc-field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.calc-field.wide { grid-column: span 2; }
.calc-label { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.calc-input-row { display: flex; gap: 6px; align-items: center; }
.calc-in, .calc-sel {
  height: 46px; border-radius: 14px; border: 1px solid var(--hairline); background: var(--glass-strong); color: var(--ink);
  font-family: var(--font-round); font-weight: 750; font-size: 18px; outline: none; padding: 0 12px; min-width: 0;
}
.calc-in { flex: 1; width: 100%; -moz-appearance: textfield; }
.calc-in::-webkit-outer-spin-button, .calc-in::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.calc-sel { flex: none; width: 74px; padding: 0 8px; -webkit-appearance: none; appearance: none; text-align: center; font-size: 16px; }
.calc-in:focus, .calc-sel:focus { box-shadow: 0 0 0 2px var(--petrol); }
.switch-container { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.switch-container::-webkit-scrollbar { display: none; }
.switch-btn {
  flex: 1 0 auto; height: 38px; padding: 0 12px; border-radius: 19px; border: 1px solid var(--hairline); background: var(--glass-strong);
  font-family: var(--font-round); font-size: 15px; font-weight: 700; color: var(--ink); white-space: nowrap;
}
.switch-btn.active { background: var(--petrol); border-color: var(--petrol); color: var(--on-petrol); }

.res-pill {
  border-radius: 24px; padding: 16px 18px; color: #fff; font-size: 15px;
  background: linear-gradient(150deg, #16A3AE 0%, #0B6E79 55%, #074B53 100%);
  box-shadow: 0 14px 30px -14px rgba(11, 110, 121, .8); transition: background .3s;
}
.res-pill.warning { background: linear-gradient(150deg, #F25C5F 0%, #D7262A 100%); box-shadow: 0 14px 30px -14px rgba(229, 56, 59, .8); }
.res-pill.idle { text-align: center; font-weight: 650; opacity: .9; }
.res-highlight { display: block; text-align: center; margin: 4px 0 0; font-family: var(--font-round); font-size: 46px; font-weight: 800; letter-spacing: -.03em; line-height: 1.05; font-variant-numeric: tabular-nums; }
.res-divider { border-top: 1px solid rgba(255, 255, 255, .25); margin: 12px 0; }
.solvent-badge { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; background: rgba(255, 255, 255, .2); font-size: 13px; font-weight: 650; margin-top: 8px; }
.warning-text { display: block; padding: 9px 12px; margin-bottom: 12px; border-radius: 14px; background: rgba(0, 0, 0, .18); font-size: 14px; font-weight: 700; text-align: center; }
.res-cap { display: block; text-align: center; font-size: 13px; font-weight: 600; opacity: .85; }

/* triage a skóre */
.triage-step-title { margin: 6px 0 18px; font-size: 22px; font-weight: 750; letter-spacing: -.02em; text-align: center; text-wrap: balance; }
.triage-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn-triage {
  min-height: 64px; padding: 12px; border-radius: 20px; border: 1px solid var(--glass-edge); background: var(--glass-strong);
  color: var(--ink); font-weight: 700; font-size: 17px; text-align: center; box-shadow: 0 6px 16px -10px var(--glass-shadow);
}
.btn-triage:active { transform: scale(.97); }
.btn-full { grid-column: span 2; width: 100%; display: block; }
.btn-primary { background: var(--petrol); color: var(--on-petrol); border-color: var(--petrol); min-height: 52px; }
.steps-trail { display: flex; justify-content: center; gap: 6px; margin-bottom: 4px; }
.steps-trail i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
.steps-trail i.on { background: var(--petrol); }

    const CHEV_DOWN = '<svg class="expand-icon" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4l4 4 4-4"/></svg>';
    const BROSELOW_COLORS = { GREY: "#808080", PINK: "#ffc0cb", RED: "#ff3b30", PURPLE: "#af52de", YELLOW: "#ffcc00", WHITE: "#ffffff", BLUE: "#007aff", ORANGE: "#ff9500", GREEN: "#4cd964" };

    /* ---- Pacient (beze změny výpočtů) ---- */
    function syncFromSlider(val) {
        val = +val;
        const yrs = Math.floor(val/12), mos = val%12;
        document.getElementById('in-yr').value = yrs;
        document.getElementById('in-mo').value = mos;

        let kg = (yrs >= 1) ? (yrs + 4) * 2 : (val * 0.5 + 3.0);

        document.getElementById('in-kg').value = kg.toFixed(kg<10?1:0);
        document.getElementById('in-cm').value = Math.round(45 + (val * 0.7));
        updateBroselow(kg); render();
    }
    function manualUpdate(src) {
        let m = 0;
        if(src==='age') m = (parseInt(document.getElementById('in-yr').value)||0)*12 + (parseInt(document.getElementById('in-mo').value)||0);
        else if(src==='kg') {
            document.getElementById('in-kg').dataset.typed = document.getElementById('in-kg').value;
            let k = parseFloat(document.getElementById('in-kg').value)||3;
            if (k < 3) k = 3;
            m = k>10 ? (k/2-4)*12 : (k-3.0)/0.5;
        }
        else m = ((parseFloat(document.getElementById('in-cm').value)||45) - 45) / 0.7;   // obrácený vzorec výšky (45 + 0,7 × měsíce)
        m = Math.round(Math.max(0, Math.min(144, m)));
        document.getElementById('main-slider').value = m; syncFromSlider(m);
        if (src === 'kg') {
            // ručně zadaná váha má přednost před odhadem z věku (dávky se počítají ze skutečné váhy)
            const typed = parseFloat(document.getElementById('in-kg').dataset.typed);
            if (typed > 0) { document.getElementById('in-kg').value = typed; updateBroselow(typed); render(); }
        }
    }
    function updateBroselow(kg) {
        let c="#808080", t="GREY", f="white", w="3-5";
        if(kg>5.5){c="#ffc0cb";t="PINK";f="black";w="6-7";} if(kg>7.5){c="#ff3b30";t="RED";f="white";w="8-9";}
        if(kg>9.5){c="#af52de";t="PURPLE";f="white";w="10-11";} if(kg>11.5){c="#ffcc00";t="YELLOW";f="black";w="12-14";}
        if(kg>14.5){c="#ffffff";t="WHITE";f="black";w="15-18";} if(kg>18.5){c="#007aff";t="BLUE";f="white";w="19-22";}
        if(kg>23.5){c="#ff9500";t="ORANGE";f="black";w="24-28";} if(kg>29.5){c="#4cd964";t="GREEN";f="black";w="30-36";}
        curB = t; curW = w; const b = document.getElementById('broselow-badge');
        b.style.backgroundColor = c; b.style.color = f; b.innerText = `${t} · ${w} kg`;
        updateMini();
    }
    function updateMini() {
        const kg = document.getElementById('in-kg').value, y = document.getElementById('in-yr').value, m = document.getElementById('in-mo').value;
        document.getElementById('mini-patient').innerHTML =
            `<span class="swatch" style="background:${BROSELOW_COLORS[curB]}"></span><b>${curB}</b><span>${kg} kg · ${y} r ${m} m</span>`;
    }

    /* ---- Výpis ---- */
    function rowHtml(l, v, u, sub="", onClick="", isOpen=false) {
        return `<div class="list-row ${onClick ? 'tap' : ''} ${isOpen ? 'row-open' : ''}" ${onClick ? `onclick="${onClick}" role="button" tabindex="0" aria-expanded="${isOpen}"` : ''}>
            <span class="list-label">${l}${sub?`<span class="drug-sub-label">${sub}</span>`:''}</span>
            <span class="list-val-wrapper">
                <span class="list-val">${v}</span>
                <span class="list-unit-fixed">${u}</span>
                ${onClick ? CHEV_DOWN : ''}
            </span>
        </div>`;
    }
    const section = (title, rows) => `<div class="section-header">${title}</div><div class="group glass">${rows}</div>`;
    const routeTag = (l) => {
        const m = l.match(/\((i\.v\.|i\.m\.|p\.r\.|i\.n\.)\)/);
        if (!m) return esc(l);
        const cls = { 'i.v.': 'iv', 'i.m.': 'im', 'p.r.': 'pr', 'i.n.': 'in' }[m[1]];
        return `<span class="route ${cls}">${m[1]}</span>${esc(l.replace(m[0], '').trim())}`;
    };

    function render() {
        const view = document.getElementById('data-view'), kg = parseFloat(document.getElementById('in-kg').value)||3, yrs = parseInt(document.getElementById('in-yr').value)||0, d = FULL_DB[curB];
        let html = "";

        if(activeTab === 'NORM') {
            const ebv = yrs < 1 ? Math.round(kg * 80) : Math.round(kg * 70);
            const stk = Math.round(70+(yrs*2));
            const dtk = Math.round(stk * 0.66);
            const map = Math.round(dtk + (stk - dtk)/3);
            html = section("Vitální hodnoty",
                    rowHtml("Tepová frekvence (Tf)", yrs<1?'110-160':yrs<5?'90-140':'70-120', "/min") +
                    rowHtml("Dechová frekvence (Df)", yrs<1?'30-40':yrs<5?'20-30':'15-20', "/min") +
                    rowHtml("Systol. TK (sTK)", stk, "mmHg") +
                    rowHtml("Diastol. TK (dTK)", dtk, "mmHg") +
                    rowHtml("Střední TK (MAP)", map, "mmHg")) +
                section("Ostatní hodnoty",
                    rowHtml("Objem krve (EBV)", ebv, "ml") +
                    rowHtml("Glukóza (spodní hranice)", yrs<1?'2.5':'3.3', "mmol/l"));
        } else if(activeTab === 'EQUIP') {
            html = section("A (Airway) + B (Breathing)",
                    rowHtml("Lžíce laryngoskopu", d.blade, "") +
                    rowHtml("ET kanyla", d.etk, "mm") +
                    rowHtml("Hloubka zavedení ETK", d.depth, "cm") +
                    rowHtml("Ústní vzduchovod", d.opa, "") +
                    rowHtml("LMA", "vel. " + d.lma, "") +
                    rowHtml("Odsávací kanyla", d.suction, "")) +
                section("C (Circulation)",
                    rowHtml("I.V. kanyla", d.cannula, "") +
                    rowHtml("I.O. jehla", d.io, ""));
        } else if(activeTab === 'RES') {
            html = section("KPR (ERC 2025)",
                    rowHtml("Defibrilace (4 J/kg)", (kg*4).toFixed(0), "J") +
                    rowHtml("Adrenalin (10 µg/kg)", (kg*0.1).toFixed(1), "ml", "1:10 000 (i.v./i.o.) - 9ml NaCl + 1ml ADR = 0,1mg/ml") +
                    rowHtml("Amiodaron (5 mg/kg)", (kg*5).toFixed(0), "mg", "Po 3. a 5. výboji") +
                    rowHtml("Atropin (20 µg/kg)", (kg*0.02).toFixed(2), "mg", "Bradykardie") +
                    rowHtml("Bolus tekutin", (kg*20).toFixed(0), "ml", "Krystaloid (20ml/kg)") +
                    rowHtml("Glukóza 10%", (kg*5).toFixed(0), "ml", "Hypoglykémie (5ml/kg)"));
        } else {
            const title = activeTab === 'ANE' ? "Anestezie" : "Akutní stavy";
            let rows = "";
            const filteredDrugs = DRUGS.filter(dr => Array.isArray(dr.tab) ? dr.tab.includes(activeTab) : dr.tab === activeTab)
                                       .sort((a, b) => a.name.localeCompare(b.name, 'cs'));
            filteredDrugs.forEach((dr, index) => {
                const uid = dr.id || `drug_${index}`;
                const isOpen = expandedIds.has(uid);
                if (dr.steps) {
                    // stupňované dávky s maximem a přepočtem na ml (Adenocor)
                    const first = Math.min(kg * dr.steps[0].d, dr.steps[0].max);
                    rows += rowHtml(dr.name, first.toFixed(first < 1 ? 2 : 1), "mg", dr.sub, `toggleVariants('${uid}')`, isOpen);
                    rows += `<div class="variant-container ${isOpen ? 'open' : ''}">`;
                    dr.steps.forEach(st => {
                        const raw = kg * st.d, mg = Math.min(raw, st.max), ml = mg / dr.conc;
                        const capped = raw > st.max;
                        rows += `<div class="variant-row"><span class="variant-info">${esc(st.l)} <span style="color:var(--ink-2);font-weight:500">${String(st.d).replace('.', ',')} mg/kg, max ${st.max} mg</span></span>
                            <span class="variant-val">${mg.toFixed(mg < 1 ? 2 : 1)} mg<small>${ml.toFixed(2)} ml${capped ? ' · maximum' : ''}</small></span></div>`;
                    });
                    rows += `<div class="variant-note">${esc(dr.note)}</div></div>`;
                } else if (dr.variants) {
                    rows += rowHtml(dr.name, "…", "", dr.sub, `toggleVariants('${uid}')`, isOpen);
                    rows += `<div class="variant-container ${isOpen ? 'open' : ''}">`;
                    dr.variants.forEach(v => {
                        let finalVal; let unit = "mg";
                        if (v.dMax) {
                            let low = kg * v.d; let high = kg * v.dMax;
                            if (low < 0.1 && low > 0) { low *= 1000; high *= 1000; unit = "µg"; }
                            finalVal = `${low.toFixed(low < 10 ? 1 : 0)}–${high.toFixed(high < 10 ? 1 : 0)}`;
                        } else {
                            let res = (kg * v.d);
                            if (res < 0.1 && res > 0) { res = res * 1000; unit = "µg"; }
                            finalVal = res.toFixed(res < 10 ? 1 : 0);
                        }
                        rows += `<div class="variant-row"><span class="variant-info">${routeTag(v.l)}</span><span class="variant-val">${finalVal} ${unit}</span></div>`;
                    });
                    rows += `</div>`;
                } else {
                    let res = (kg * dr.dose); let unit = dr.unit;
                    if (res < 0.1 && res > 0 && unit === "mg") { res = res * 1000; unit = "µg"; }
                    const total = res.toFixed(res < 1 ? 2 : (res < 10 ? 1 : 0));
                    rows += rowHtml(dr.name, total, unit, dr.sub);
                }
            });
            html = section(title, rows);
        }
        view.innerHTML = html;
    }

    /* ---- Kalkulačka ředění ---- */
    const SEARCH_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>';
    function openCalc() {
        openTool('Kalkulačka ředění');
        document.getElementById('modal-content').innerHTML = `
            <div class="search-box">
                <label class="search-field">${SEARCH_ICON}
                    <input type="text" id="calc-search-input" placeholder="Hledej lék, např. Torecan" oninput="filterDrugList(this.value)" autocomplete="off" autocorrect="off" spellcheck="false">
                    <button type="button" id="search-clear" class="clear-btn" onclick="clearCalcSearch()" aria-label="Vymazat" hidden>
                        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M2 2l8 8M10 2l-8 8"/></svg>
                    </button>
                </label>
                <div id="drug-scroll-list" hidden></div>
            </div>
            <div class="calc-grid">
                <div class="calc-field"><label class="calc-label" for="ca-amt">Obsah ampule</label><div class="calc-input-row"><input type="number" id="ca-amt" class="calc-in" value="1" inputmode="decimal" oninput="doCalc()"><select id="ca-u" class="calc-sel" onchange="doCalc()"><option>mg</option><option>mcg</option></select></div></div>
                <div class="calc-field"><label class="calc-label" for="ca-v">Celkový objem</label><div class="calc-input-row"><input type="number" id="ca-v" class="calc-in" value="10" inputmode="decimal" oninput="doCalc()"><span class="calc-label" style="width:22px">ml</span></div></div>
                <div class="calc-field wide"><span class="calc-label">Objem ampule</span><div class="switch-container" id="amp-switches">${[1,2,5,10,20].map(v => `<button type="button" class="switch-btn" onclick="setAmpV(this, ${v})">${v} ml</button>`).join('')}<button type="button" class="switch-btn" onclick="setAmpV(this, null)">Vlastní</button></div><input type="number" id="ca-ampv" class="calc-in" style="display:none; margin-top:6px;" placeholder="Objem ampule v ml" inputmode="decimal" oninput="doCalc()"></div>
                <div class="calc-field wide"><label class="calc-label" for="ca-t">Dávka pro pacienta</label><div class="calc-input-row"><input type="number" id="ca-t" class="calc-in" value="0" inputmode="decimal" oninput="doCalc()"><select id="ca-tu" class="calc-sel" onchange="doCalc()"><option>mg</option><option>mcg</option></select></div></div>
            </div>
            <div id="ca-res" class="res-pill idle">Vyber lék ze seznamu, nebo zadej hodnoty ručně</div>`;
        setAmpV(document.querySelector('#amp-switches .switch-btn'), 1, true);
    }

    function filterDrugList(q) {
        const list = document.getElementById('drug-scroll-list');
        const clearBtn = document.getElementById('search-clear');
        const norm = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
        const query = norm(q);
        if (clearBtn) clearBtn.hidden = q.length === 0;
        if (q.length === 0) { list.hidden = true; list.innerHTML = ""; return; }
        const filtered = CALC_DB.filter(d => norm(d.n).includes(query));
        if (filtered.length > 0) {
            list.hidden = false;
            list.innerHTML = filtered.map(d => `<button type="button" class="drug-opt" data-name="${esc(d.n)}">${esc(d.n)}</button>`).join('');
            list.querySelectorAll('.drug-opt').forEach(b => b.onclick = () => applyPresetByIndex(b.dataset.name));
        } else { list.hidden = true; }
    }

    function clearCalcSearch() {
        const input = document.getElementById('calc-search-input');
        input.value = ''; filterDrugList(''); input.focus();
    }

    function applyPresetByIndex(name) {
        const idx = CALC_DB.findIndex(d => d.n === name);
        if(idx === -1) return;
        const drug = CALC_DB[idx];
        const kg = parseFloat(document.getElementById('in-kg').value)||3;
        const yrs = parseInt(document.getElementById('in-yr').value)||0;
        const mos = parseInt(document.getElementById('in-mo').value)||0;
        const totalMos = (yrs * 12) + mos;
        document.getElementById('calc-search-input').value = drug.n;
        document.getElementById('drug-scroll-list').hidden = true;
        document.getElementById('search-clear').hidden = false;
        document.getElementById('ca-amt').value = drug.amp;
        document.getElementById('ca-u').value = drug.u.includes('mcg') ? 'mcg' : 'mg';
        const buttons = document.querySelectorAll('#amp-switches .switch-btn'); let found = false;
        buttons.forEach(b => { if(b.innerText === drug.ampV + " ml") { setAmpV(b, drug.ampV, true); found = true; } });
        if(!found) { setAmpV(buttons[buttons.length-1], null, true); document.getElementById('ca-ampv').value = drug.ampV; }
        document.getElementById('ca-t').value = (drug.d * kg).toFixed(drug.d*kg < 1 ? 2 : 1);
        document.getElementById('ca-tu').value = drug.u.includes('mcg') ? 'mcg' : 'mg';
        const resBox = document.getElementById('ca-res');
        resBox.dataset.sol = drug.sol;
        let warning = "";
        if(drug.limit) {
            if(drug.limit.minY && yrs < drug.limit.minY) warning = drug.limit.msg;
            if(drug.limit.minKg && kg < drug.limit.minKg) warning = drug.limit.msg;
            if(drug.limit.minM && totalMos < drug.limit.minM) warning = drug.limit.msg;
        }
        resBox.dataset.warning = warning;
        resBox.dataset.ready = '1';
        doCalc();
    }

    function setAmpV(btn, val, silent) {
        document.querySelectorAll('#amp-switches .switch-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const customIn = document.getElementById('ca-ampv');
        if(val === null) { customIn.style.display = 'block'; if (!silent) customIn.focus(); }
        else { customIn.style.display = 'none'; customIn.value = val; if (!silent) doCalc(); }
    }

    function doCalc() {
        const amt = parseFloat(document.getElementById('ca-amt').value)||0, ampV = parseFloat(document.getElementById('ca-ampv').value)||0.0001, totalV = parseFloat(document.getElementById('ca-v').value)||0.0001;
        const unit = document.getElementById('ca-u').value, target = parseFloat(document.getElementById('ca-t').value)||0, tunit = document.getElementById('ca-tu').value;
        const resBox = document.getElementById('ca-res');
        const sol = resBox.dataset.sol || "NaCl / Aqua";
        const warn = resBox.dataset.warning || "";
        const finalConc = amt / totalV;
        let targetInBase = (tunit === unit) ? target : (tunit === 'mg' ? target * 1000 : target / 1000);
        const applyMl = targetInBase / finalConc;
        let concStr = unit === 'mg' ? `${finalConc.toFixed(2)} mg/ml` : `${finalConc.toFixed(1)} µg/ml`;
        if (unit === 'mg' && finalConc < 0.1) concStr = `${(finalConc * 1000).toFixed(1)} µg/ml`;
        resBox.classList.remove('idle');
        if (warn) resBox.classList.add('warning'); else resBox.classList.remove('warning');
        resBox.innerHTML = `
            ${warn ? `<span class="warning-text">⚠︎ ${esc(warn)}</span>` : ''}
            <div><b>Příprava:</b> ${ampV} ml léku + ${(totalV-ampV).toFixed(1)} ml rozpouštědla</div>
            <div class="solvent-badge">${esc(sol)}</div>
            <div class="res-divider"></div>
            <span class="res-cap">Koncentrace ${concStr}</span>
            <span class="res-highlight">${isFinite(applyMl)?applyMl.toFixed(2):0} ml</span>
            <span class="res-cap">Dávka pro pacienta</span>`;
    }

    /* ---- JumpSTART ---- */
    const jSteps = { walk: { q: "Může dítě chodit?", btns: [{l:"Ano", s:"result-green"}, {l:"Ne", s:"breath"}] }, breath: { q: "Dýchá dítě?", btns: [{l:"Ano", s:"rate"}, {l:"Ne", s:"airway"}] }, airway: { q: "Po uvolnění cest dýchá?", btns: [{l:"Ano", s:"result-red"}, {l:"Ne", s:"pulse"}] }, pulse: { q: "Má hmatný puls?", btns: [{l:"Ano", s:"rescue"}, {l:"Ne", s:"result-black"}] }, rescue: { q: "Dýchá po 5 vdeších?", btns: [{l:"Ano", s:"result-red"}, {l:"Ne", s:"result-black"}] }, rate: { q: "Dechová frekvence?", btns: [{l:"< 15 nebo > 45", s:"result-red"}, {l:"15 - 45 /min", s:"pulseCheck"}] }, pulseCheck: { q: "Hmatný puls?", btns: [{l:"Ne", s:"result-red"}, {l:"Ano", s:"avpu"}] }, avpu: { q: "Reakce (AVPU)?", btns: [{l:"P nebo U", s:"result-red"}, {l:"A nebo V", s:"result-yellow"}] } };
    let jTrail = [];
    function startJumpstart() { openTool('JumpSTART triage'); jTrail = []; showJumpStep('walk'); }
    function showJumpStep(id) {
        const content = document.getElementById('modal-content');
        if(id.startsWith('result')) {
            const color = id.split('-')[1];
            const labels = { green: 'NEZÁVAŽNÝ STAV', red: 'KRITICKÝ STAV', black: 'MRTVÉ - P4', yellow: 'URGENTNÍ STAV' };
            content.innerHTML = `<div class="triage-step-title">Výsledek triage</div>
                <div class="result-box ${color === 'yellow' ? 'dark-ink' : ''}" style="background:var(--triage-${color})">${labels[color]}</div>
                <div class="triage-btns" style="margin-top:16px">
                    <button type="button" class="btn-triage btn-full btn-primary" onclick="startJumpstart()">Nový pacient</button>
                </div>`;
            return;
        }
        jTrail.push(id);
        const step = jSteps[id];
        const btns = step.btns.map(b => `<button type="button" class="btn-triage" onclick="showJumpStep('${b.s}')">${esc(b.l)}</button>`).join('');
        const back = jTrail.length > 1 ? `<button type="button" class="btn-triage btn-full" style="min-height:48px;font-size:15px;color:var(--ink-2)" onclick="jumpBack()">Krok zpět</button>` : '';
        content.innerHTML = `<div class="steps-trail">${jTrail.map((_, i) => `<i class="${i === jTrail.length - 1 ? 'on' : ''}"></i>`).join('')}</div>
            <div class="triage-step-title">${esc(step.q)}</div><div class="triage-btns">${btns}${back}</div>`;
    }
    function jumpBack() { jTrail.pop(); const prev = jTrail.pop(); showJumpStep(prev); }

    /* ---- Skóre (GCS, Apgar) – výběr klepnutím ---- */
    function scoreGroup(key, label, opts, def) {
        return `<div class="score-row"><span class="score-label">${label}</span><div class="score-opts" data-key="${key}">` +
            opts.map(([v, t]) => `<button type="button" class="score-opt" data-v="${v}" aria-pressed="${v === def}"><span class="pts">${v}</span>${esc(t)}</button>`).join('') +
            `</div></div>`;
    }
    function bindScores(onChange) {
        document.querySelectorAll('#modal-content .score-opts').forEach(g => {
            g.addEventListener('click', (e) => {
                const b = e.target.closest('.score-opt'); if (!b) return;
                g.querySelectorAll('.score-opt').forEach(x => x.setAttribute('aria-pressed', x === b));
                onChange();
            });
        });
    }
    const scoreVal = (key) => { const b = document.querySelector(`#modal-content .score-opts[data-key="${key}"] [aria-pressed="true"]`); return b ? parseInt(b.dataset.v) : 0; };

    function openGCS() {
        openTool('Glasgow Coma Scale');
        document.getElementById('modal-content').innerHTML =
            scoreGroup('ge', 'Oči', [[4,'Spontánně'],[3,'Na slovo'],[2,'Na bolest'],[1,'Nic']], 4) +
            scoreGroup('gv', 'Řeč', [[5,'Žvatlá, usmívá se'],[4,'Pláč / utišitelný'],[3,'Křik / neutišitelný'],[2,'Sténání'],[1,'Nic']], 5) +
            scoreGroup('gm', 'Pohyb', [[6,'Spontánní'],[5,'Lokalizuje'],[4,'Únik'],[3,'Flexe'],[2,'Extenze'],[1,'Nic']], 6) +
            `<div class="score-sticky"><div id="gr" class="result-box" style="background:var(--triage-green)">15 BODŮ <span class="result-label">NORMA</span></div></div>`;
        bindScores(cGCS);
    }
    function cGCS() {
        const s = scoreVal('ge') + scoreVal('gv') + scoreVal('gm');
        let c, txt, dark = false;
        if(s < 9) { c="var(--triage-red)"; txt="TĚŽKÁ PORUCHA (KÓMA)"; } else if(s < 13) { c="var(--triage-yellow)"; txt="STŘEDNÍ PORUCHA"; dark = true; } else { c="var(--triage-green)"; txt="NORMA / LEHKÁ PORUCHA"; }
        const r = document.getElementById('gr'); r.innerHTML = `${s} BODŮ <span class="result-label">${txt}</span>`; r.style.background = c; r.classList.toggle('dark-ink', dark);
    }

    function openApgar() {
        openTool('Apgar skóre');
        document.getElementById('modal-content').innerHTML =
            scoreGroup('a1', 'Akce srdeční', [[2,'> 100/min'],[1,'< 100/min'],[0,'Zástava']], 2) +
            scoreGroup('a2', 'Dýchání', [[2,'Pravidelné / křik'],[1,'Nepravidelné / lapavé'],[0,'Apnoe']], 2) +
            scoreGroup('a3', 'Reakce na odsávání', [[2,'Kašel, kýchání, křik'],[1,'Grimasy'],[0,'Bez reakce']], 2) +
            scoreGroup('a4', 'Svalový tonus', [[2,'Aktivní pohyb'],[1,'Mírná flexe končetin'],[0,'Chabý']], 2) +
            scoreGroup('a5', 'Barva kůže', [[2,'Růžová'],[1,'Akrocyanóza'],[0,'Bledá / modrá']], 2) +
            `<div class="score-sticky"><div id="ar" class="result-box" style="background:var(--triage-green)">10 BODŮ <span class="result-label">FYZIOLOGICKÝ NOVOROZENEC</span></div></div>`;
        bindScores(cAP);
    }
    function cAP() {
        const s = ['a1','a2','a3','a4','a5'].reduce((a, k) => a + scoreVal(k), 0);
        let c, txt, dark = false;
        if(s < 4) { c="var(--triage-red)"; txt="TĚŽKÁ ASFYXIE"; } else if(s < 8) { c="var(--triage-yellow)"; txt="LEHKÁ PORUCHA ADAPTACE"; dark = true; } else { c="var(--triage-green)"; txt="FYZIOLOGICKÝ NOVOROZENEC"; }
        const r = document.getElementById('ar'); r.innerHTML = `${s} BODŮ <span class="result-label">${txt}</span>`; r.style.background = c; r.classList.toggle('dark-ink', dark);
    }

    /* ---- Motiv ---- */
    const THEME_KEY = 'resqpedi:theme';
    try {
        const saved = localStorage.getItem(THEME_KEY);
        if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
    } catch (e) {}
    document.getElementById('theme-toggle').onclick = () => {
        const current = document.documentElement.dataset.theme ||
            (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        const next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.dataset.theme = next;
        try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
    };

    /* ---- Lepivá lišta s mini údaji o pacientovi ---- */
    if ('IntersectionObserver' in window) {
        new IntersectionObserver((entries) => {
            document.getElementById('tabbar').classList.toggle('stuck', !entries[0].isIntersecting);
        }, { threshold: 0 }).observe(document.getElementById('patient'));
    }
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeAll();
        if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.list-row.tap')) { e.preventDefault(); e.target.click(); }
    });

    syncFromSlider(12);
</script>
</body>
</html>
