<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ARO Komunikátor</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ARO Komunikátor">
<meta name="theme-color" content="#E4EEEF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#03141A" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">
<style>
/* ARO Komunikátor – komunikace s pacienty, kteří nemohou mluvit nebo neslyší. Vzhled sladěný s ResqHubem. */
:root {
  --bg: #E4EEEF; --ink: #0A1F23; --ink-2: rgba(10, 31, 35, .6); --ink-3: rgba(10, 31, 35, .36);
  --petrol: #0B6E79; --petrol-soft: rgba(11, 110, 121, .12); --on-petrol: #FFFFFF;
  --green: #12895A; --green-soft: rgba(31, 181, 122, .16);
  --red: #D23B3E; --red-soft: rgba(229, 56, 59, .13);
  --amber: #A65C00;
  --glow-a: rgba(11, 110, 121, .5); --glow-b: rgba(53, 194, 196, .4);
  --glass: rgba(255, 255, 255, .6); --glass-strong: rgba(250, 253, 253, .96);
  --glass-edge: rgba(255, 255, 255, .8); --glass-hi: rgba(255, 255, 255, .95); --glass-shadow: rgba(6, 55, 62, .13);
  --hairline: rgba(10, 31, 35, .1); --fill: rgba(10, 31, 35, .06);
  --body: #FBFDFD; --body-edge: rgba(11, 110, 121, .28); --body-hi: rgba(11, 110, 121, .22); --body-sil: rgba(11, 110, 121, .13);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", Roboto, sans-serif;
  --font-round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #03141A; --ink: #EAF6F7; --ink-2: rgba(234, 246, 247, .64); --ink-3: rgba(234, 246, 247, .34);
    --petrol: #3CC0CB; --petrol-soft: rgba(60, 192, 203, .14); --on-petrol: #03141A;
    --green: #4FD69C; --green-soft: rgba(79, 214, 156, .15); --red: #FF6B6E; --red-soft: rgba(255, 107, 110, .15); --amber: #FFB45E;
    --glow-a: rgba(11, 110, 121, .6); --glow-b: rgba(28, 157, 163, .3);
    --glass: rgba(255, 255, 255, .075); --glass-strong: rgba(22, 38, 43, .97);
    --glass-edge: rgba(255, 255, 255, .13); --glass-hi: rgba(255, 255, 255, .15); --glass-shadow: rgba(0, 0, 0, .45);
    --hairline: rgba(255, 255, 255, .1); --fill: rgba(255, 255, 255, .08);
    --body: #17303A; --body-edge: rgba(60, 192, 203, .35); --body-hi: rgba(60, 192, 203, .3); --body-sil: rgba(60, 192, 203, .12);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #03141A; --ink: #EAF6F7; --ink-2: rgba(234, 246, 247, .64); --ink-3: rgba(234, 246, 247, .34);
  --petrol: #3CC0CB; --petrol-soft: rgba(60, 192, 203, .14); --on-petrol: #03141A;
  --green: #4FD69C; --green-soft: rgba(79, 214, 156, .15); --red: #FF6B6E; --red-soft: rgba(255, 107, 110, .15); --amber: #FFB45E;
  --glow-a: rgba(11, 110, 121, .6); --glow-b: rgba(28, 157, 163, .3);
  --glass: rgba(255, 255, 255, .075); --glass-strong: rgba(22, 38, 43, .97);
  --glass-edge: rgba(255, 255, 255, .13); --glass-hi: rgba(255, 255, 255, .15); --glass-shadow: rgba(0, 0, 0, .45);
  --hairline: rgba(255, 255, 255, .1); --fill: rgba(255, 255, 255, .08);
  --body: #17303A; --body-edge: rgba(60, 192, 203, .35); --body-hi: rgba(60, 192, 203, .3); --body-sil: rgba(60, 192, 203, .12);
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
body { position: relative; isolation: isolate; overflow: hidden; font-family: var(--font); font-size: 17px; line-height: 1.3; -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; -webkit-user-select: none; user-select: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
input, textarea, [contenteditable] { -webkit-user-select: text; user-select: text; }
svg { display: block; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--petrol); outline-offset: 2px; border-radius: 12px; }
[dir="rtl"] { text-align: right; }
.result [dir], .tile [dir], .slide [dir], .answer-ov [dir], .vas [dir], .bigtext [dir] { text-align: center; }

.ambient { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
.ambient::before, .ambient::after { content: ""; position: absolute; border-radius: 50%; filter: blur(70px); }
.ambient::before { width: 120vw; height: 60vh; left: -40vw; top: -32vh; background: var(--glow-a); }
.ambient::after { width: 80vw; height: 44vh; right: -36vw; top: 4vh; background: var(--glow-b); }
.glass { background: var(--glass); -webkit-backdrop-filter: blur(26px) saturate(180%); backdrop-filter: blur(26px) saturate(180%); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-hi), 0 10px 30px -12px var(--glass-shadow); }

/* ---------- kostra ---------- */
#app { position: fixed; inset: 0; display: flex; flex-direction: column; padding: calc(var(--st) + 8px) max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left)); }
.topbar { flex: none; display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 2px 8px; }
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand b { font-family: var(--font-display); font-weight: 800; font-size: 22px; letter-spacing: -.03em; line-height: 1.05; white-space: nowrap; }
.brand small { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.seg { display: flex; gap: 2px; padding: 3px; border-radius: 16px; background: var(--fill); }
.seg button { height: 38px; padding: 0 16px; border-radius: 13px; font-size: 15.5px; font-weight: 650; color: var(--ink-2); display: flex; align-items: center; gap: 7px; white-space: nowrap; }
.seg button svg { width: 18px; height: 18px; }
.seg button[aria-selected="true"] { background: var(--glass-strong); color: var(--ink); box-shadow: 0 2px 8px -2px var(--glass-shadow); }
.top-seg { margin: 0 auto; }
.spacer { flex: 1; }
.lang-pill { display: flex; align-items: center; gap: 6px; height: 42px; padding: 0 14px; border-radius: 21px; font-size: 15px; font-weight: 650; white-space: nowrap; max-width: 100%; }
.lang-pill .fl { font-size: 19px; }
.lang-pill .arr { color: var(--ink-3); }
.round { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; flex: none; color: var(--ink); }
.round svg { width: 21px; height: 21px; }
.round:active, .tile:active, .big-btn:active { transform: scale(.96); }

main { flex: 1; min-height: 0; position: relative; }
.view { position: absolute; inset: 0; display: flex; flex-direction: column; min-height: 0; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }

.tabbar { flex: none; display: none; justify-content: space-around; padding: 6px 4px calc(var(--sb) + 4px); margin: 0 -12px; border-top: 1px solid var(--hairline); background: color-mix(in srgb, var(--bg) 70%, transparent); -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); }
.tabbar button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 0; font-size: 11.5px; font-weight: 600; color: var(--ink-3); }
.tabbar button svg { width: 25px; height: 25px; }
.tabbar button[aria-selected="true"] { color: var(--petrol); }

@media (max-width: 1000px) { .brand small { display: none; } .lang-pill .lb { display: none; } }
/* telefon */
body.phone .top-seg, body.phone .brand small { display: none; }
body.phone .tabbar { display: flex; }
body.phone .lang-pill .lb { display: none; }
body.phone .brand b { font-size: 20px; }

/* ---------- pacient ---------- */
.crumb { flex: none; display: flex; align-items: center; gap: 12px; min-height: 0; padding: 0 2px 10px; }
.back-btn { display: inline-flex; align-items: center; gap: 6px; height: 52px; padding: 0 20px 0 14px; border-radius: 26px; font-size: 18px; font-weight: 700; color: var(--ink); }
.back-btn svg { width: 22px; height: 22px; color: var(--petrol); }
.crumb h2 { margin: 0; font-family: var(--font-display); font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
.crumb h2 small { display: block; font-size: 15px; font-weight: 600; color: var(--ink-2); letter-spacing: 0; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 12px; padding: 2px 2px 16px; }
body.phone .tiles { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.tile { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 160px; padding: 16px 12px; border-radius: 26px; text-align: center; color: var(--ink); transition: transform .12s; overflow: hidden; }
body.phone .tile { min-height: 128px; border-radius: 22px; }
.tile::before { content: ""; position: absolute; inset: 0; background: var(--c, var(--petrol)); opacity: .1; }
.tile > * { position: relative; }
.tile .ic { font-size: 54px; line-height: 1; }
body.phone .tile .ic { font-size: 42px; }
.tile .pt { font-size: 21px; font-weight: 750; line-height: 1.18; letter-spacing: -.01em; color: color-mix(in srgb, var(--c, var(--petrol)) 72%, var(--ink)); }
body.phone .tile .pt { font-size: 17.5px; }
.tile .st { font-size: 14px; font-weight: 550; color: var(--ink-2); line-height: 1.2; }
.tile .more { position: absolute; top: 12px; right: 12px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--glass-strong); color: var(--ink-3); }
.tile .more svg { width: 14px; height: 14px; }
.tile.wide { grid-column: span 2; }

.answer-bar { flex: none; display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 10px; padding: 10px 2px calc(var(--sb) + 12px); }
body.phone .answer-bar { gap: 8px; padding-bottom: 10px; grid-template-columns: 1fr 1fr 1fr 64px; }
.big-btn { display: flex; align-items: center; justify-content: center; gap: 10px; height: 76px; border-radius: 24px; font-size: 26px; font-weight: 800; letter-spacing: -.01em; transition: transform .12s; }
body.phone .big-btn { height: 64px; font-size: 19px; border-radius: 20px; gap: 6px; }
.big-btn .ic { font-size: 32px; }
body.phone .big-btn .ic { font-size: 24px; }
.big-btn.yes { background: #12895A; color: #fff; box-shadow: 0 10px 24px -12px var(--green); }
.big-btn.no { background: #C9343A; color: #fff; box-shadow: 0 10px 24px -12px var(--red); }
.big-btn.dk { color: var(--ink); }
.big-btn.nurse { width: 96px; color: var(--amber); }
body.phone .big-btn.nurse { width: auto; }
.big-btn.nurse svg { width: 34px; height: 34px; }
body.phone .big-btn .lbl-dk { font-size: 17px; }

/* ---------- postava ---------- */
.body-wrap { flex: 1; min-height: 0; display: flex; gap: 14px; padding-bottom: 12px; }
.figs { flex: 1; min-width: 0; min-height: 0; display: flex; gap: 10px; justify-content: center; align-items: stretch; border-radius: 28px; padding: 14px 10px 8px; }
.fig { flex: 1; min-width: 0; min-height: 0; max-width: 340px; display: flex; flex-direction: column; align-items: center; overflow: hidden; }
.fig .cap { font-size: 14px; font-weight: 700; color: var(--ink-2); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
.fig svg { flex: 1 1 0; min-height: 0; width: 100%; height: 100%; touch-action: manipulation; }
.fig svg .sil { fill: var(--body-sil); stroke: var(--body-sil); stroke-width: 7; stroke-linejoin: round; pointer-events: none; }
.fig svg .sh { fill: var(--body); stroke: var(--body-edge); stroke-width: 1; transition: fill .15s, opacity .2s; cursor: pointer; }
.fig svg .grp:hover .sh, .fig svg .sh.hot { fill: var(--body-hi); }
.fig svg .sh.sel { fill: var(--petrol); }
.fig svg .deco { fill: none; stroke: var(--body-edge); stroke-width: 1.2; stroke-linecap: round; pointer-events: none; }
.fig svg.zoomed .grp.dim { opacity: .18; pointer-events: none; }
.fig svg .lbl { font-family: var(--font); font-size: 6px; font-weight: 700; fill: var(--ink-2); pointer-events: none; text-anchor: middle; }
.side-list { width: 300px; flex: none; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; padding: 2px; }
body.phone .body-wrap { flex-direction: column; }
body.phone .side-list { width: auto; max-height: 34%; flex-direction: row; flex-wrap: wrap; }
.part-btn { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 58px; padding: 10px 16px; border-radius: 18px; text-align: left; font-size: 18px; font-weight: 700; line-height: 1.2; }
.part-btn > svg { width: 22px; height: 22px; flex: none; }
.part-btn small { display: block; font-size: 13.5px; font-weight: 550; color: var(--ink-2); }
.part-btn.whole { background: var(--petrol); color: var(--on-petrol); border: 0; }
.part-btn.whole small { color: inherit; opacity: .8; }
body.phone .part-btn { min-height: 46px; font-size: 15px; padding: 8px 12px; border-radius: 14px; flex: 1 1 calc(50% - 8px); }
.mini-seg.view-toggle { display: none; }
body.phone .mini-seg.view-toggle { display: flex; align-self: center; margin-bottom: 8px; }
.mini-seg.view-toggle button { height: 40px; padding: 0 20px; font-size: 16px; }
body.phone .fig.off { display: none; }

/* ---------- VAS ---------- */
.vas { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 10px 0 20px; }
.vas-face { font-size: 110px; line-height: 1; }
body.phone .vas-face { font-size: 76px; }
.vas-lbl { font-size: 30px; font-weight: 800; text-align: center; }
.vas-lbl small { display: block; font-size: 17px; color: var(--ink-2); font-weight: 600; margin-top: 4px; }
.vas-nums { display: grid; grid-template-columns: repeat(11, 1fr); gap: 8px; width: 100%; max-width: 900px; }
body.phone .vas-nums { grid-template-columns: repeat(6, 1fr); }
.vas-nums button { height: 72px; border-radius: 18px; font-family: var(--font-round); font-size: 28px; font-weight: 800; color: #fff; background: var(--vc); opacity: .55; transition: transform .1s, opacity .1s, box-shadow .1s; }
body.phone .vas-nums button { height: 56px; font-size: 22px; }
.vas-nums button[aria-pressed="true"] { opacity: 1; transform: scale(1.08); box-shadow: 0 0 0 4px var(--bg), 0 0 0 7px var(--vc); }
.vas .confirm { min-width: 280px; height: 70px; padding: 0 30px; border-radius: 35px; background: var(--petrol); color: var(--on-petrol); font-size: 22px; font-weight: 800; }

/* ---------- výsledek ---------- */
.ov { position: fixed; inset: 0; z-index: 70; display: flex; align-items: center; justify-content: center; padding: calc(var(--st) + 20px) 20px calc(var(--sb) + 20px); background: rgba(2, 20, 24, .45); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.result { width: min(760px, 100%); border-radius: 34px; padding: 30px 28px 24px; text-align: center; background: var(--glass-strong); box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .5); animation: pop .3s cubic-bezier(.3, 1.4, .5, 1); }
@keyframes pop { from { transform: scale(.9); opacity: 0; } }
.result .ic { font-size: 84px; line-height: 1; }
.result .pt { margin-top: 14px; font-family: var(--font-display); font-size: clamp(28px, 5vw, 46px); font-weight: 800; letter-spacing: -.02em; line-height: 1.12; }
.result .path { margin-top: 6px; font-size: 18px; font-weight: 600; color: var(--ink-2); }
.result .stf { margin: 18px auto 0; padding: 14px 18px; border-radius: 20px; background: var(--petrol-soft); max-width: 560px; }
.result .stf .k { font-size: 12.5px; font-weight: 750; text-transform: uppercase; letter-spacing: .06em; color: var(--petrol); }
.result .stf .v { font-size: 22px; font-weight: 750; margin-top: 3px; }
.result .acts { display: flex; gap: 12px; justify-content: center; margin-top: 22px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 56px; padding: 0 26px; border-radius: 28px; font-size: 19px; font-weight: 750; }
.pill.pri { background: var(--petrol); color: var(--on-petrol); }
.pill.sec { background: var(--fill); color: var(--ink); }
.pill svg { width: 22px; height: 22px; }
.answer-ov { flex-direction: column; gap: 10px; text-align: center; color: #fff; background: var(--ac); -webkit-backdrop-filter: none; backdrop-filter: none; }
.answer-ov .w { font-family: var(--font-display); font-size: clamp(80px, 22vw, 220px); font-weight: 900; letter-spacing: -.04em; line-height: .95; }
.answer-ov .s { font-size: clamp(22px, 4vw, 40px); font-weight: 700; opacity: .85; }
.answer-ov .hint { position: absolute; bottom: calc(var(--sb) + 24px); font-size: 15px; opacity: .7; }
.nurse-ov { background: #B86E00; animation: flash 1.2s ease-in-out infinite; }
@keyframes flash { 50% { background: #E08A12; } }

/* ---------- pokyny ---------- */
.pk { flex: 1; min-height: 0; display: flex; gap: 14px; }
.cats { width: 210px; flex: none; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; padding: 8px; border-radius: 24px; }
.cats button { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 12px; border-radius: 14px; font-size: 16px; font-weight: 650; color: var(--ink-2); text-align: left; }
.cats button .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--c); }
.cats button .n { margin-left: auto; font-size: 13px; color: var(--ink-3); }
.cats button[aria-selected="true"] { background: var(--glass-strong); color: var(--ink); box-shadow: 0 2px 10px -4px var(--glass-shadow); }
body.phone .pk { flex-direction: column; gap: 8px; }
body.phone .cats { width: auto; flex-direction: row; overflow-x: auto; overflow-y: hidden; padding: 2px; border-radius: 0; background: none; border: 0; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; scrollbar-width: none; }
body.phone .cats::-webkit-scrollbar { display: none; }
body.phone .cats button { flex: none; min-height: 38px; border-radius: 19px; background: var(--glass); border: 1px solid var(--glass-edge); white-space: nowrap; font-size: 14.5px; }
body.phone .cats button .n { display: none; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; padding: 2px 2px 14px; align-content: start; }
body.phone .cards { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.card { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; min-height: 128px; padding: 14px; border-radius: 22px; text-align: left; color: var(--ink); }
.card .ic { font-size: 36px; line-height: 1; }
.card .pt { font-size: 16.5px; font-weight: 700; line-height: 1.25; }
.card .tr { font-size: 13.5px; color: var(--ink-2); line-height: 1.25; }
.card .tr { padding-right: 38px; }
.card .tr.miss { color: var(--amber); font-weight: 650; }
.card .num { position: absolute; top: 10px; right: 10px; min-width: 28px; height: 28px; padding: 0 6px; border-radius: 14px; display: grid; place-items: center; background: var(--petrol); color: var(--on-petrol); font-family: var(--font-round); font-size: 15px; font-weight: 800; }
.card.in { box-shadow: inset 0 0 0 2px var(--petrol), 0 10px 30px -12px var(--glass-shadow); }
.card .quick { position: absolute; bottom: 10px; right: 10px; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--petrol-soft); color: var(--petrol); }
.card .quick svg { width: 15px; height: 15px; }
.queue { flex: none; display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 14px; margin: 4px 0 calc(var(--sb) + 10px); border-radius: 24px; }
body.phone .queue { margin-bottom: 8px; }
.q-list { flex: 1; min-width: 0; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 4px 2px; }
.q-list::-webkit-scrollbar { display: none; }
.q-empty { color: var(--ink-3); font-size: 15px; padding: 14px 4px; }
.q-item { position: relative; flex: none; display: flex; align-items: center; gap: 6px; height: 46px; padding: 0 34px 0 10px; border-radius: 14px; background: var(--glass-strong); font-size: 14.5px; font-weight: 650; max-width: 220px; touch-action: none; cursor: grab; }
.q-item .i { font-size: 20px; }
.q-item .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.q-item .x { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--fill); color: var(--ink-2); }
.q-item .x svg { width: 10px; height: 10px; }
.q-item.drag { opacity: .4; }
.q-item.ghost { position: fixed; z-index: 90; pointer-events: none; box-shadow: 0 14px 30px -8px rgba(0, 0, 0, .35); transform: scale(1.04); }
.q-start { flex: none; display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 22px; border-radius: 26px; background: var(--petrol); color: var(--on-petrol); font-size: 17px; font-weight: 750; }
.q-start:disabled { opacity: .35; }
.q-start svg { width: 18px; height: 18px; }
.q-clear { flex: none; color: var(--ink-2); font-size: 14.5px; font-weight: 650; padding: 0 6px; }

/* ---------- prezentace ---------- */
.present { position: fixed; inset: 0; z-index: 75; display: flex; flex-direction: column; background: var(--bg); padding: calc(var(--st) + 10px) 16px calc(var(--sb) + 14px); }
.present .ph { display: flex; align-items: center; gap: 12px; }
.dots { flex: 1; display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
.dots i { width: 8px; height: 8px; border-radius: 4px; background: var(--hairline); transition: all .2s; }
.dots i.done { background: var(--body-hi); }
.dots i.on { width: 26px; background: var(--petrol); }
.slide { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 10px 10px 20px; }
.slide .cat { padding: 6px 16px; border-radius: 16px; font-size: 14px; font-weight: 750; letter-spacing: .05em; text-transform: uppercase; background: color-mix(in srgb, var(--c) 15%, transparent); color: var(--c); }
.slide .ic { font-size: clamp(90px, 18vh, 170px); line-height: 1; margin: 22px 0 18px; animation: pop .35s cubic-bezier(.3, 1.4, .5, 1); }
.slide .pt { font-family: var(--font-display); font-size: clamp(36px, 7vw, 76px); font-weight: 800; letter-spacing: -.025em; line-height: 1.08; max-width: 1000px; text-wrap: balance; }
.slide .ps { font-size: clamp(20px, 3vw, 30px); color: var(--ink-2); margin-top: 14px; font-weight: 550; }
.slide .st { margin-top: 24px; font-size: 17px; color: var(--ink-3); font-weight: 600; }
.pnav { display: flex; gap: 12px; }
.pnav button { height: 72px; border-radius: 24px; font-size: 21px; font-weight: 750; }
.pnav .prev { flex: 1; background: var(--fill); }
.pnav .next { flex: 2; background: var(--petrol); color: var(--on-petrol); }
.pnav button:disabled { opacity: .3; }

/* ---------- napsat ---------- */
.write { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; padding-bottom: calc(var(--sb) + 12px); }
.write textarea { flex: 1; min-height: 120px; resize: none; border-radius: 26px; padding: 20px 22px; border: 1px solid var(--glass-edge); background: var(--glass-strong); font-size: 34px; font-weight: 650; line-height: 1.25; outline: none; }
body.phone .write textarea { font-size: 26px; }
.write textarea:focus { box-shadow: 0 0 0 3px var(--petrol-soft); }
.write .acts { display: flex; gap: 10px; flex-wrap: wrap; }
.write .acts .pill { flex: 1 1 auto; }
.pill.rec { background: var(--red); color: #fff; animation: flash2 1s infinite; }
@keyframes flash2 { 50% { opacity: .7; } }
.bigtext { position: fixed; inset: 0; z-index: 75; display: flex; align-items: center; justify-content: center; padding: calc(var(--st) + 30px) 30px calc(var(--sb) + 30px); background: var(--bg); text-align: center; }
.bigtext .t { font-family: var(--font-display); font-weight: 800; letter-spacing: -.02em; line-height: 1.1; word-break: break-word; white-space: pre-wrap; }
.bigtext .close { position: absolute; top: calc(var(--st) + 14px); right: 16px; }

/* ---------- spodní panely ---------- */
.scrim { position: fixed; inset: 0; z-index: 80; background: rgba(2, 20, 24, .4); opacity: 0; pointer-events: none; transition: opacity .3s; }
.scrim.open { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 81; max-width: 680px; margin: 0 auto; max-height: calc(100% - var(--st) - 20px); display: flex; flex-direction: column; border-radius: 30px 30px 0 0; background: var(--bg); box-shadow: 0 -10px 40px rgba(0, 0, 0, .2); transform: translateY(105%); visibility: hidden; transition: transform .4s cubic-bezier(.32, .72, 0, 1), visibility 0s .4s; }
.sheet.open { transform: none; visibility: visible; transition: transform .4s cubic-bezier(.32, .72, 0, 1); }
.sheet.tall { height: calc(100% - var(--st) - 20px); }
.sheet::before { content: ""; position: absolute; inset: 0 0 auto; height: 200px; border-radius: inherit; pointer-events: none; background: radial-gradient(120% 100% at 50% 0%, var(--glow-b), transparent 70%); opacity: .45; }
.sheet > * { position: relative; }
.sh-head { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 14px 8px; }
.sh-head h3 { margin: 0; font-size: 18px; font-weight: 750; flex: 1; text-align: center; }
.sh-head .tbtn { min-width: 70px; height: 38px; padding: 0 14px; border-radius: 19px; font-size: 16px; font-weight: 650; color: var(--petrol); }
.sh-head .tbtn.pri { background: var(--petrol); color: var(--on-petrol); }
.sh-body { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 16px calc(var(--sb) + 28px); -webkit-user-select: text; user-select: text; }
.grp-lbl { margin: 18px 6px 8px; font-size: 13.5px; font-weight: 650; color: var(--ink-2); }
.grp-lbl:first-child { margin-top: 6px; }
.list { border-radius: 20px; overflow: hidden; }
.row { position: relative; display: flex; align-items: center; gap: 12px; min-height: 54px; padding: 8px 14px; width: 100%; text-align: left; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 14px; right: 0; border-top: 1px solid var(--hairline); }
.row .grow { flex: 1; min-width: 0; }
.row .grow small { display: block; font-size: 13px; color: var(--ink-2); margin-top: 1px; }
.row .val { color: var(--ink-2); font-size: 15px; }
.row > svg { width: 22px; height: 22px; flex: none; }
.row .ic { font-size: 24px; width: 30px; text-align: center; flex: none; }
.row .chev { color: var(--ink-3); width: 14px; flex: none; }
.row.indent { padding-left: 40px; }
.row.danger { color: var(--red); justify-content: center; font-weight: 650; }
.row.act { color: var(--petrol); font-weight: 650; }
.row select { border: 0; background: none; font-size: 16px; color: var(--ink-2); text-align: right; max-width: 60%; }
.mini-seg { display: flex; gap: 2px; padding: 2px; border-radius: 11px; background: var(--fill); }
.mini-seg button { height: 32px; padding: 0 11px; border-radius: 9px; font-size: 14px; font-weight: 600; color: var(--ink-2); }
.mini-seg button[aria-pressed="true"] { background: var(--glass-strong); color: var(--ink); box-shadow: 0 1px 4px rgba(0, 0, 0, .12); }
.switch { position: relative; width: 52px; height: 32px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: 32px; background: var(--fill); transition: background .2s; }
.switch span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 28px; height: 28px; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(0, 0, 0, .18); transition: transform .25s; }
.switch input:checked + span { background: var(--petrol); }

.ic-input { font-size: 34px !important; width: 72px !important; text-align: center; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; padding: 4px 0; }

.lang-grid button { display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 14px; border-radius: 16px; font-size: 16px; font-weight: 650; text-align: left; }
.lang-grid button .fl { font-size: 22px; }
.lang-grid button[aria-pressed="true"] { background: var(--petrol); color: var(--on-petrol); border-color: var(--petrol); }
.swap { display: flex; justify-content: center; margin: 14px 0 0; }
.note { margin: 10px 8px 0; font-size: 13px; color: var(--ink-3); line-height: 1.45; }
.order { display: flex; gap: 4px; }
.order button { width: 32px; height: 32px; border-radius: 10px; background: var(--fill); display: grid; place-items: center; color: var(--ink-2); }
.order button svg { width: 14px; height: 14px; }
.order button:disabled { opacity: .3; }

.pin-pad { display: grid; grid-template-columns: repeat(3, 72px); gap: 10px; justify-content: center; margin-top: 10px; }
.pin-pad button { height: 64px; border-radius: 20px; font-size: 26px; font-weight: 700; font-family: var(--font-round); }
.pin-dots { display: flex; gap: 14px; justify-content: center; margin: 14px 0 6px; }

.pin-dots i.on { background: var(--petrol); border-color: var(--petrol); }

const TTS = {
  ok: 'speechSynthesis' in window, voices: [],
  load() { if (this.ok) this.voices = speechSynthesis.getVoices() || []; },
  voice(lang) {
    const code = (LANG[lang] || {}).tts; if (!code || !this.voices.length) return null;
    const lc = code.toLowerCase(), pre = lang.toLowerCase();
    const list = this.voices.filter((v) => v.lang && (v.lang.toLowerCase().replace('_', '-') === lc || v.lang.toLowerCase().startsWith(pre)));
    return list.find((v) => /premium|enhanced|vylepšen/i.test(v.name)) || list.find((v) => v.localService) || list[0] || null;
  },
  can(lang) { return this.ok && !!this.voice(lang); },
  say(text, lang) {
    if (!this.ok || !text) return false;
    const v = this.voice(lang); if (!v) return false;
    speechSynthesis.cancel();

    speechSynthesis.speak(u); return true;

};

/* sestra – zvukový signál */
let audioCtx = null, nurseTimer = null;
function beep() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = audioCtx.currentTime;
    [0, .22].forEach((d, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = i ? 660 : 880;
      g.gain.setValueAtTime(0.0001, t0 + d); g.gain.exponentialRampToValueAtTime(0.5, t0 + d + .02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + .2);
      o.connect(g); g.connect(audioCtx.destination); o.start(t0 + d); o.stop(t0 + d + .22);
    });
  } catch (e) {}
}
function callNurse() {
  const ov = document.createElement('div');
  ov.className = 'ov answer-ov nurse-ov';
  ov.innerHTML = `<div style="font-size:120px;line-height:1">🔔</div><div class="w" style="font-size:clamp(44px,9vw,96px)"${dirAttr(S.pat)}>${esc(U('nurse_called'))}</div>${dual() ? `<div class="s"${dirAttr(S.staff)}>${esc(U('nurse_called', S.staff))}</div>` : ''}<div class="hint">Klepnutím zavřete</div>`;
  const stop = () => { clearInterval(nurseTimer); nurseTimer = null; ov.remove(); };
  ov.addEventListener('click', stop);
  document.body.appendChild(ov);
  beep(); clearInterval(nurseTimer); nurseTimer = setInterval(beep, 1500);
  setTimeout(() => { if (nurseTimer) { clearInterval(nurseTimer); nurseTimer = null; } }, 30000);
}

const K = { cat: null, queue: [] };
function renderPokyny() {
  if (!K.cat || !C.cats.some((c) => c.id === K.cat)) K.cat = C.cats[0] && C.cats[0].id;
  $('k-cats').innerHTML = C.cats.map((c) => `<button type="button" data-cat="${esc(c.id)}" aria-selected="${K.cat === c.id}" style="--c:${esc(c.color)}"><span class="dot"></span>${esc(c.name)}<span class="n">${C.inst.filter((i) => i.cat === c.id).length}</span></button>`).join('');
  const list = C.inst.filter((i) => i.cat === K.cat);
  $('k-cards').innerHTML = list.map((i) => {
    const qi = K.queue.indexOf(i.id);
    const miss = S.pat !== 'cs' && !has(i.t, S.pat);
    return `<div class="card glass${qi >= 0 ? ' in' : ''}" role="button" tabindex="0" data-inst="${i.id}">
      ${qi >= 0 ? `<span class="num">${qi + 1}</span>` : ''}
      <span class="ic">${esc(i.ic)}</span>
      <span class="pt">${esc(tx(i.t, 'cs'))}</span>
      ${S.pat !== 'cs' ? (miss ? `<span class="tr miss">Chybí překlad – ${esc(LANG[S.pat].lb)}</span>` : `<span class="tr"${dirAttr(S.pat)}>${esc(tx(i.t, S.pat))}</span>`) : ''}
      <button type="button" class="quick" data-quick="${i.id}" aria-label="Ukázat hned">${I.play}</button>
    </div>`;
  }).join('') || '<p class="note">V této kategorii nejsou žádné pokyny. Přidáš je v Nastavení → Upravit obsah.</p>';
  renderQueue();
}
$('k-cats').addEventListener('click', (e) => { const b = e.target.closest('[data-cat]'); if (b) { K.cat = b.dataset.cat; renderPokyny(); } });
$('k-cards').addEventListener('click', (e) => {
  const q = e.target.closest('[data-quick]'); if (q) { present([+q.dataset.quick]); return; }
  const c = e.target.closest('[data-inst]'); if (!c) return;
  const id = +c.dataset.inst; const i = K.queue.indexOf(id);
  if (i >= 0) K.queue.splice(i, 1); else K.queue.push(id);
  renderPokyny();
});
function renderQueue() {
  const items = K.queue.map((id) => C.inst.find((i) => i.id === id)).filter(Boolean);
  K.queue = items.map((i) => i.id);
  $('k-queue').innerHTML = `<div class="q-list" id="q-list">${items.length ? items.map((i, n) => `<div class="q-item" data-q="${i.id}"><span class="i">${esc(i.ic)}</span><span class="t">${n + 1}. ${esc(tx(i.t, 'cs'))}</span><button type="button" class="x" data-qx="${i.id}" aria-label="Odebrat">${I.x}</button></div>`).join('') : '<div class="q-empty">Klepáním na karty poskládej sekvenci pokynů</div>'}</div>
    ${items.length ? '<button type="button" class="q-clear" id="q-clear">Vymazat</button>' : ''}
    <button type="button" class="q-start" id="q-start"${items.length ? '' : ' disabled'}>${I.play}Spustit</button>`;
}
$('k-queue').addEventListener('click', (e) => {
  const x = e.target.closest('[data-qx]'); if (x) { K.queue = K.queue.filter((id) => id !== +x.dataset.qx); renderPokyny(); return; }
  if (e.target.closest('#q-clear')) { K.queue = []; renderPokyny(); return; }
  if (e.target.closest('#q-start') && K.queue.length) present(K.queue.slice());
});
/* přetahování v sekvenci */
(function () {
  let drag = null;
  $('k-queue').addEventListener('pointerdown', (e) => {
    const it = e.target.closest('.q-item'); if (!it || e.target.closest('.x')) return;
    drag = { el: it, id: +it.dataset.q, x0: e.clientX, y0: e.clientY, started: false, pid: e.pointerId };
  });
  window.addEventListener('pointermove', (e) => {
    if (!drag || e.pointerId !== drag.pid) return;
    if (!drag.started) {
      if (Math.abs(e.clientX - drag.x0) < 8) return;
      drag.started = true;
      const r = drag.el.getBoundingClientRect();
      drag.ghost = drag.el.cloneNode(true); drag.ghost.classList.add('ghost');
      drag.ghost.style.left = r.left + 'px'; drag.ghost.style.top = r.top + 'px'; drag.ghost.style.width = r.width + 'px';
      drag.dx = e.clientX - r.left; document.body.appendChild(drag.ghost); drag.el.classList.add('drag');
    }
    drag.ghost.style.left = (e.clientX - drag.dx) + 'px';
    const items = [...document.querySelectorAll('#q-list .q-item:not(.drag)')];
    let idx = items.length;
    for (let i = 0; i < items.length; i++) { const r = items[i].getBoundingClientRect(); if (e.clientX < r.left + r.width / 2) { idx = i; break; } }
    const order = items.map((n) => +n.dataset.q); order.splice(idx, 0, drag.id);
    if (order.join() !== K.queue.join()) {
      K.queue = order;
      const list = $('q-list'); const ref = items[idx] || null; list.insertBefore(drag.el, ref);
      [...list.querySelectorAll('.q-item')].forEach((n, i) => { n.querySelector('.t').textContent = (i + 1) + '. ' + tx(C.inst.find((x) => x.id === +n.dataset.q).t, 'cs'); });
    }
  });
  const end = () => { if (!drag) return; if (drag.started) { drag.ghost.remove(); drag.el.classList.remove('drag'); renderPokyny(); } drag = null; };
  window.addEventListener('pointerup', end); window.addEventListener('pointercancel', end);
})();

/* prezentace */
function present(ids) {
  const list = ids.map((id) => C.inst.find((i) => i.id === id)).filter(Boolean); if (!list.length) return;
  let n = 0;
  const box = document.createElement('div'); box.className = 'present';
  const draw = () => {
    const i = list[n], cat = C.cats.find((c) => c.id === i.cat) || { name: '', color: '#0B6E79' };
    const canSay = TTS.can(S.pat);
    box.innerHTML = `<div class="ph">
        <button type="button" class="back-btn glass" data-p="close">${I.back}<span>Konec</span></button>
        <div class="dots">${list.map((_, k) => `<i class="${k < n ? 'done' : k === n ? 'on' : ''}"></i>`).join('')}</div>
        ${canSay ? `<button type="button" class="round glass" data-p="say" aria-label="Přečíst">${I.speak}</button>` : '<span style="width:42px"></span>'}
      </div>
      <div class="slide" style="--c:${esc(cat.color)}">
        <span class="cat">${esc(n + 1)} / ${list.length}</span>
        <div class="ic">${esc(i.ic)}</div>
        <div class="pt"${dirAttr(S.pat)}>${esc(tx(i.t, S.pat))}</div>
        ${i.s && tx(i.s, S.pat) ? `<div class="ps"${dirAttr(S.pat)}>${esc(tx(i.s, S.pat))}</div>` : ''}
        ${dual() ? `<div class="st"${dirAttr(S.staff)}>${esc(tx(i.t, S.staff))}</div>` : ''}
      </div>
      <div class="pnav">
        <button type="button" class="prev" data-p="prev"${n ? '' : ' disabled'}${dirAttr(S.pat)}>${esc(U('prev'))}</button>
        <button type="button" class="next" data-p="${n < list.length - 1 ? 'next' : 'close'}"${dirAttr(S.pat)}>${esc(n < list.length - 1 ? U('next') : U('done'))}</button>
      </div>`;
    if (S.speak) TTS.say(tx(i.t, S.pat), S.pat);
  };
  box.addEventListener('click', (e) => {
    const b = e.target.closest('[data-p]'); if (!b) return;
    const a = b.dataset.p;
    if (a === 'close') { if (TTS.ok) speechSynthesis.cancel(); box.remove(); return; }
    if (a === 'say') { const i = list[n]; TTS.say(tx(i.t, S.pat) + (i.s && tx(i.s, S.pat) ? '. ' + tx(i.s, S.pat) : ''), S.pat); return; }
    n = Math.max(0, Math.min(list.length - 1, n + (a === 'next' ? 1 : -1))); draw();
  });
  let sx = null;
  box.addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; }, { passive: true });
  box.addEventListener('touchend', (e) => {
    if (sx == null) return; const dx = e.changedTouches[0].clientX - sx; sx = null;
    if (Math.abs(dx) > 60) { const nn = n + (dx < 0 ? 1 : -1); if (nn >= 0 && nn < list.length) { n = nn; draw(); } }
  });
  document.body.appendChild(box); draw();
}

/* ================= NAPSAT ================= */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
function renderWrite() {
  const ta = $('w-text');
  ta.placeholder = U('write_ph') + (dual() ? ' / ' + U('write_ph', S.staff) : '');
  const canSay = TTS.ok;
  $('w-acts').innerHTML = `
    <button type="button" class="pill pri" data-w="big">${I.expand}${esc(U('show_big', 'cs'))}</button>
    ${canSay ? `<button type="button" class="pill sec" data-w="say">${I.speak}Přečíst nahlas</button>` : ''}
    ${SR ? `<button type="button" class="pill sec${rec ? ' rec' : ''}" data-w="mic">${I.mic}${rec ? 'Poslouchám… (stop)' : 'Diktovat'}</button>` : ''}
    <button type="button" class="pill sec" data-w="clear">${I.x}${esc(U('clear', 'cs'))}</button>`;
}
$('w-acts').addEventListener('click', (e) => {
  const b = e.target.closest('[data-w]'); if (!b) return;
  const ta = $('w-text'), t = ta.value.trim();
  if (b.dataset.w === 'clear') { ta.value = ''; ta.focus(); }
  if (b.dataset.w === 'say') { if (!t) return; const l = detectLang(t); if (!TTS.say(t, l)) toast('Pro tento jazyk není v zařízení hlas.'); }
  if (b.dataset.w === 'big' && t) bigText(t);
  if (b.dataset.w === 'mic') toggleMic();
});
function detectLang(t) {
  if (/[؀-ۿ]/.test(t)) return 'ar';
  if (/[а-яё]/i.test(t)) return /[іїєґ]/i.test(t) ? 'uk' : /[өү]/i.test(t) ? 'mn' : (S.pat === 'ru' || S.staff === 'ru') ? 'ru' : (S.pat === 'uk' ? 'uk' : 'ru');
  if (/[ăâđêôơư]/i.test(t) && S.pat === 'vi') return 'vi';
  return /[ěščřžýůťďň]/i.test(t) ? 'cs' : (S.pat !== 'cs' && !/[áéí]/i.test(t) ? S.pat : 'cs');
}
function bigText(t) {
  const box = document.createElement('div'); box.className = 'bigtext';
  const size = Math.max(36, Math.min(160, Math.round(1400 / Math.sqrt(Math.max(t.length, 4) * 3.2))));
  box.innerHTML = `<div class="t" dir="auto" style="font-size:${size}px">${esc(t)}</div><button type="button" class="round glass close" aria-label="Zavřít">${I.x}</button>`;
  box.addEventListener('click', () => box.remove());
  document.body.appendChild(box);
}
function toggleMic() {
  if (rec) { try { rec.stop(); } catch (e) {} rec = null; renderWrite(); return; }
  try {
    rec = new SR(); rec.lang = LANG[S.staff].tts; rec.interimResults = true; rec.continuous = true;
    const ta = $('w-text'); const base = ta.value ? ta.value.replace(/\s*$/, ' ') : '';
    rec.onresult = (ev) => { let s = ''; for (let k = 0; k < ev.results.length; k++) s += ev.results[k][0].transcript; ta.value = base + s; ta.scrollTop = ta.scrollHeight; };
    rec.onerror = (ev) => { toast(ev.error === 'not-allowed' ? 'Mikrofon není povolený.' : 'Diktování se přerušilo.'); };
    rec.onend = () => { rec = null; renderWrite(); };
    rec.start(); renderWrite();
  } catch (e) { rec = null; toast('Diktování tady nefunguje.'); }
}

    sh.innerHTML = head('Zadej PIN', '<button type="button" class="tbtn" data-close>Zrušit</button>', '<span style="min-width:70px"></span>') + `<div class="sh-body" style="text-align:center">

      <div class="pin-pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9, '', 0, '⌫'].map((k) => k === '' ? '<span></span>' : `<button type="button" class="glass" data-k="${k}">${k}</button>`).join('')}</div></div>`;
    sh.querySelectorAll('[data-k]').forEach((b) => b.onclick = () => {
      const k = b.dataset.k;
      v = k === '⌫' ? v.slice(0, -1) : (v + k).slice(0, 4);
      if (v.length === 4) {
        if (v === S.pin) { pinOk = true; setTimeout(() => { pinOk = true; fn(); }, 120); }
        else { toast('Špatný PIN'); v = ''; }
      }
      draw(sh);
    });
  });
}
function pinSetSheet(sh) {
  let v = sh._v || '';
  sh.innerHTML = head(S.pin ? 'Zámek úprav' : 'Nastavit PIN', '<button type="button" class="tbtn" id="pin-back">Zpět</button>', '<span style="min-width:70px"></span>') + `<div class="sh-body" style="text-align:center">
    <p class="note" style="margin-top:0">${S.pin ? 'Zadej nový PIN, nebo zámek vypni.' : 'Čtyřmístný PIN ochrání úpravy obsahu a zálohy, aby je pacient omylem nezměnil.'}</p>
    <div class="pin-dots">${[0, 1, 2, 3].map((i) => `<i class="${i < v.length ? 'on' : ''}"></i>`).join('')}</div>
    <div class="pin-pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9, '', 0, '⌫'].map((k) => k === '' ? '<span></span>' : `<button type="button" class="glass" data-k="${k}">${k}</button>`).join('')}</div>
    ${S.pin ? '<div class="list glass" style="margin-top:20px"><button type="button" class="row danger" id="pin-off">Vypnout zámek</button></div>' : ''}</div>`;
  sh.querySelectorAll('[data-k]').forEach((b) => b.onclick = () => {
    const k = b.dataset.k; v = k === '⌫' ? v.slice(0, -1) : (v + k).slice(0, 4); sh._v = v;
    if (v.length === 4) { S.pin = v; pinOk = true; saveS(); sh._v = ''; toast('PIN nastaven'); openSheet(settingsSheet); return; }
    pinSetSheet(sh);
  });
  $('pin-back').onclick = () => { sh._v = ''; openSheet(settingsSheet); };
  if (S.pin) $('pin-off').onclick = () => { S.pin = ''; saveS(); sh._v = ''; toast('Zámek vypnut'); openSheet(settingsSheet); };
}

/* záloha */
function exportData() {
  const data = { app: 'aro-komunikator', v: 2, exported: new Date().toISOString(), content: C, settings: { langs: S.langs } };
  const json = JSON.stringify(data, null, 1);
  const name = 'aro-komunikator-zaloha-' + new Date().toISOString().slice(0, 10) + '.json';
  const blob = new Blob([json], { type: 'application/json' });
  try {
    const file = new File([blob], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file], title: 'Záloha ARO Komunikátoru' }).catch(() => {}); return; }
  } catch (e) {}
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast('Záloha uložena do Stažených souborů');
}
function validContent(c) { return c && Array.isArray(c.inst) && Array.isArray(c.comm) && Array.isArray(c.cats) && c.inst.every((i) => i && i.t && i.t.cs != null) && c.comm.every((x) => x && x.id && x.t); }
function importData(file) {
  const r = new FileReader();
  r.onload = () => {
    let d; try { d = JSON.parse(r.result); } catch (e) { toast('Soubor není platná záloha.'); return; }
    const c = d && d.app === 'aro-komunikator' ? d.content : null;
    if (!validContent(c)) { toast('Soubor není záloha ARO Komunikátoru.'); return; }
    if (!confirm(`Nahradit současný obsah zálohou z ${d.exported ? new Date(d.exported).toLocaleString('cs-CZ') : 'neznámého data'}?\n${c.inst.length} pokynů, ${c.comm.length} položek karty.`)) return;
    C = c; if (d.settings && Array.isArray(d.settings.langs)) S.langs = d.settings.langs; saveC(); saveS(); toast('Záloha načtena'); refreshAll(); rerenderSheet();
  };
  r.readAsText(file);
}
function migrateOld() {
  const o = (() => { try { return JSON.parse(localStorage.getItem(KEY_OLD)); } catch (e) { return null; } })();
  if (!o) { toast('Stará data nenalezena.'); return; }
  const known = new Set(C.inst.map((i) => (i.t.cs || '').toLowerCase().trim()));
  const catMap = { bolest: 'stav' }; let addI = 0, addC = 0;
  (o.CATS || []).forEach((c) => { const id = catMap[c.id] || c.id; if (!C.cats.some((x) => x.id === id)) C.cats.push({ id, name: c.name, color: c.color || COLORS[0] }); });
  let nid = Math.max(0, ...C.inst.map((i) => i.id)) + 1;
  (o.INST || []).forEach((i) => {
    if (!i.t || known.has((i.t.cs || '').toLowerCase().trim())) return;
    const t = Object.assign({}, i.t); delete t.ro; // ve staré verzi byla pod „ro“ romština
    C.inst.push({ id: nid++, cat: catMap[i.cat] || i.cat, ic: i.ic || '💬', t, s: i.sub ? { cs: i.sub } : undefined }); addI++;
  });
  const oldDefault = /^(c[1-9]|cs\d{1,2})$/;
  const knownC = new Set(C.comm.map((c) => (c.t.cs || '').toLowerCase().trim()));
  (o.COMM || []).forEach((c) => {
    if (oldDefault.test(c.id) || !c.t || knownC.has((c.t.cs || '').toLowerCase().trim())) return;
    const t = Object.assign({}, c.t); delete t.ro;
    const par = c.par && C.comm.some((x) => x.id === c.par) && c.par !== 'c1' ? c.par : null;
    C.comm.push({ id: 'o' + c.id, par, ic: c.ic || '💬', col: c.tc || COLORS[7], t }); addC++;
  });
  saveC(); toast(`Převzato: ${addI} pokynů, ${addC} položek karty`); refreshAll(); rerenderSheet();
}

/* ================= EDITOR ================= */
const E = { tab: 'inst' };
function editorSheet(sh) {
  const tabs = [['inst', 'Pokyny'], ['comm', 'Karta pacienta'], ['cats', 'Kategorie'], ['langs', 'Jazyky']];
  let body = '';
  if (E.tab === 'inst') {
    body = C.cats.map((cat) => {
      const list = C.inst.filter((i) => i.cat === cat.id);
      return `<div class="grp-lbl" style="display:flex;align-items:center;gap:8px"><span style="width:10px;height:10px;border-radius:50%;background:${esc(cat.color)}"></span>${esc(cat.name)}</div>
        <div class="list glass">${list.map((i, k) => `<div class="row"><span class="ic">${esc(i.ic)}</span><button type="button" class="grow" style="text-align:left" data-ei="${i.id}">${esc(i.t.cs)}<small>${missingLangs(i.t)}</small></button>
          <span class="order"><button type="button" data-mi="${i.id}" data-d="-1"${k ? '' : ' disabled'} aria-label="Nahoru">${I.up}</button><button type="button" data-mi="${i.id}" data-d="1"${k < list.length - 1 ? '' : ' disabled'} aria-label="Dolů">${I.down}</button></span></div>`).join('')}
          <button type="button" class="row act" data-newi="${esc(cat.id)}">＋ Přidat pokyn</button></div>`;
    }).join('');
  } else if (E.tab === 'comm') {
    const rows = [];
    const walk = (par, depth) => commChildren(par).forEach((c, k, arr) => {
      rows.push(`<div class="row${depth ? ' indent' : ''}"><span class="ic">${esc(c.ic)}</span><button type="button" class="grow" style="text-align:left" data-ec="${esc(c.id)}">${esc(c.t.cs)}${c.kind === 'pain' ? ' <small>Otevře postavu a škálu bolesti</small>' : `<small>${missingLangs(c.t)}</small>`}</button>
        <span class="order"><button type="button" data-mc="${esc(c.id)}" data-d="-1"${k ? '' : ' disabled'} aria-label="Nahoru">${I.up}</button><button type="button" data-mc="${esc(c.id)}" data-d="1"${k < arr.length - 1 ? '' : ' disabled'} aria-label="Dolů">${I.down}</button></span></div>`);
      walk(c.id, depth + 1);
    });
    walk(null, 0);
    body = `<p class="note" style="margin-top:0">Položky s podřízenými se otevřou jako další stránka. Odsazené = podřízené.</p><div class="list glass">${rows.join('')}<button type="button" class="row act" data-newc="1">＋ Přidat položku</button></div>`;
  } else if (E.tab === 'cats') {
    body = `<div class="list glass">${C.cats.map((c, k) => `<div class="row"><span style="width:14px;height:14px;border-radius:50%;background:${esc(c.color)};flex:none"></span><button type="button" class="grow" style="text-align:left" data-ek="${esc(c.id)}">${esc(c.name)}<small>${C.inst.filter((i) => i.cat === c.id).length} pokynů</small></button>
      <span class="order"><button type="button" data-mk="${esc(c.id)}" data-d="-1"${k ? '' : ' disabled'}>${I.up}</button><button type="button" data-mk="${esc(c.id)}" data-d="1"${k < C.cats.length - 1 ? '' : ' disabled'}>${I.down}</button></span></div>`).join('')}
      <button type="button" class="row act" data-newk="1">＋ Přidat kategorii</button></div>`;
  } else {
    body = `<p class="note" style="margin-top:0">Vypnuté jazyky se nenabízejí ve výběru ani v editoru. Čeština zůstává vždy.</p><div class="list glass">${LANGS.map((l) => `<label class="row"><span class="ic">${l.fl}</span><span class="grow">${esc(l.lb)}<small>${TTS.ok ? (TTS.can(l.id) ? 'Hlas v zařízení je' : 'Bez hlasu v zařízení') : ''}</small></span>${l.id === 'cs' ? '' : `<span class="switch"><input type="checkbox" data-lang="${l.id}"${S.langs.includes(l.id) ? ' checked' : ''}><span></span></span>`}</label>`).join('')}</div>`;
  }
  sh.innerHTML = head('Upravit obsah', '<button type="button" class="tbtn" id="ed-back">Zpět</button>') +
    `<div style="padding:0 16px 6px;display:flex;justify-content:center"><div class="mini-seg">${tabs.map(([id, l]) => `<button type="button" data-tab="${id}" aria-pressed="${E.tab === id}">${l}</button>`).join('')}</div></div>
    <div class="sh-body">${body}</div>`;
  $('ed-back').onclick = () => openSheet(settingsSheet);
  sh.querySelectorAll('[data-tab]').forEach((b) => b.onclick = () => { E.tab = b.dataset.tab; editorSheet(sh); });
  sh.querySelectorAll('[data-ei]').forEach((b) => b.onclick = () => openSheet((s) => itemSheet(s, 'inst', C.inst.find((i) => i.id === +b.dataset.ei)), true));
  sh.querySelectorAll('[data-newi]').forEach((b) => b.onclick = () => openSheet((s) => itemSheet(s, 'inst', null, { cat: b.dataset.newi }), true));
  sh.querySelectorAll('[data-ec]').forEach((b) => b.onclick = () => openSheet((s) => itemSheet(s, 'comm', C.comm.find((c) => c.id === b.dataset.ec)), true));
  sh.querySelectorAll('[data-newc]').forEach((b) => b.onclick = () => openSheet((s) => itemSheet(s, 'comm', null), true));
  sh.querySelectorAll('[data-ek]').forEach((b) => b.onclick = () => openSheet((s) => catSheet(s, C.cats.find((c) => c.id === b.dataset.ek))));
  sh.querySelectorAll('[data-newk]').forEach((b) => b.onclick = () => openSheet((s) => catSheet(s, null)));
  const move = (arr, item, d, same) => { const idx = arr.indexOf(item); let j = idx + d; while (j >= 0 && j < arr.length && !same(arr[j])) j += d; if (j < 0 || j >= arr.length) return; arr.splice(idx, 1); arr.splice(j, 0, item); saveC(); editorSheet(sh); };
  sh.querySelectorAll('[data-mi]').forEach((b) => b.onclick = () => { const it = C.inst.find((i) => i.id === +b.dataset.mi); move(C.inst, it, +b.dataset.d, (x) => x.cat === it.cat); });
  sh.querySelectorAll('[data-mc]').forEach((b) => b.onclick = () => { const it = C.comm.find((c) => c.id === b.dataset.mc); move(C.comm, it, +b.dataset.d, (x) => (x.par || null) === (it.par || null)); });
  sh.querySelectorAll('[data-mk]').forEach((b) => b.onclick = () => { const it = C.cats.find((c) => c.id === b.dataset.mk); move(C.cats, it, +b.dataset.d, () => true); });
  sh.querySelectorAll('[data-lang]').forEach((i) => i.onchange = () => { const l = i.dataset.lang; S.langs = i.checked ? [...new Set([...S.langs, l])] : S.langs.filter((x) => x !== l); if (!S.langs.includes(S.pat)) S.pat = 'cs'; if (!S.langs.includes(S.staff)) S.staff = 'cs'; saveS(); renderLangPill(); });
}
function missingLangs(t) {
  const miss = LANGS.filter((l) => l.id !== 'cs' && S.langs.includes(l.id) && !has(t, l.id));
  return miss.length ? 'Chybí: ' + miss.map((l) => l.fl).join(' ') : '';
}
function itemSheet(sh, kind, item, preset) {
  const isNew = !item;
  const d = item ? clone(item) : (kind === 'inst' ? { cat: preset.cat, ic: '', t: {}, s: {} } : { par: null, ic: '', col: COLORS[7], t: {} });
  const langs = LANGS.filter((l) => l.id === 'cs' || S.langs.includes(l.id));
  const parents = C.comm.filter((c) => c.id !== (item && item.id) && c.kind !== 'pain' && !isDesc(c.id, item && item.id));
  sh.innerHTML = head(isNew ? 'Nová položka' : 'Upravit', '<button type="button" class="tbtn" id="it-cancel">Zrušit</button>', '<button type="button" class="tbtn pri" id="it-save">Uložit</button>') + `<div class="sh-body">
    <div class="list glass">
      <div class="field"><label>Ikona (emoji)</label><input class="ic-input" id="it-ic" value="${esc(d.ic)}" maxlength="8" placeholder="🙂"></div>
      ${kind === 'inst' ? `<div class="field"><label>Kategorie</label><select id="it-cat">${C.cats.map((c) => `<option value="${esc(c.id)}"${c.id === d.cat ? ' selected' : ''}>${esc(c.name)}</option>`).join('')}</select></div>`
        : `<div class="field"><label>Patří pod</label><select id="it-par"><option value="">— hlavní stránka —</option>${parents.filter((c) => !c.par).map((c) => `<option value="${esc(c.id)}"${c.id === d.par ? ' selected' : ''}>${esc(c.ic + ' ' + c.t.cs)}</option>`).join('')}</select></div>
           <div class="field"><label>Barva</label><div class="swatches" id="it-col">${COLORS.map((c) => `<button type="button" style="--c:${c}" data-c="${c}" aria-pressed="${c === d.col}"></button>`).join('')}</div></div>`}
    </div>
    <div class="grp-lbl">${kind === 'inst' ? 'Text pokynu' : 'Text'}</div>
    <div class="list glass">${langs.map((l) => `<div class="field"><label>${l.fl} ${esc(l.lb)}${l.id === 'cs' ? ' *' : ''}</label><input data-t="${l.id}" value="${esc(d.t[l.id] || '')}"${l.rtl ? ' dir="rtl"' : ' dir="auto"'}></div>`).join('')}</div>
    ${kind === 'inst' ? `<div class="grp-lbl">Doplňující řádek (volitelný)</div><div class="list glass">${langs.map((l) => `<div class="field"><label>${l.fl} ${esc(l.lb)}</label><input data-s="${l.id}" value="${esc((d.s || {})[l.id] || '')}"${l.rtl ? ' dir="rtl"' : ' dir="auto"'}></div>`).join('')}</div>` : ''}
    ${!isNew && !(kind === 'comm' && d.kind === 'pain') ? '<div class="list glass" style="margin-top:20px"><button type="button" class="row danger" id="it-del">Smazat</button></div>' : ''}
    ${kind === 'comm' && d.kind === 'pain' ? '<p class="note">Tato položka otevírá postavu a škálu bolesti – nejde smazat.</p>' : ''}
    <p class="note">Překlady pro pacienty ideálně nech zkontrolovat rodilým mluvčím.</p>
  </div>`;
  let col = d.col;
  const back = () => openSheet(editorSheet, true);
  $('it-cancel').onclick = back;
  if ($('it-col')) $('it-col').onclick = (e) => { const b = e.target.closest('[data-c]'); if (!b) return; col = b.dataset.c; sh.querySelectorAll('#it-col button').forEach((x) => x.setAttribute('aria-pressed', x === b)); };
  $('it-save').onclick = () => {
    const t = {}, s = {};
    sh.querySelectorAll('[data-t]').forEach((i) => { if (i.value.trim()) t[i.dataset.t] = i.value.trim(); });
    sh.querySelectorAll('[data-s]').forEach((i) => { if (i.value.trim()) s[i.dataset.s] = i.value.trim(); });
    if (!t.cs) { toast('Vyplň aspoň český text.'); return; }
    const ic = $('it-ic').value.trim() || '💬';
    if (kind === 'inst') {
      const o = { id: item ? item.id : Math.max(0, ...C.inst.map((i) => i.id)) + 1, cat: $('it-cat').value, ic, t };
      if (Object.keys(s).length) o.s = s;
      if (item) C.inst[C.inst.findIndex((i) => i.id === item.id)] = o; else C.inst.push(o);
    } else {
      const o = Object.assign(item ? clone(item) : { id: 'u' + Date.now().toString(36) }, { par: $('it-par').value || null, ic, col, t });
      if (item) C.comm[C.comm.findIndex((c) => c.id === item.id)] = o; else C.comm.push(o);
    }
    saveC(); toast('Uloženo'); back();
  };
  if ($('it-del')) $('it-del').onclick = () => {
    if (kind === 'inst') { if (!confirm('Smazat pokyn?')) return; C.inst = C.inst.filter((i) => i.id !== item.id); K.queue = K.queue.filter((x) => x !== item.id); }
    else { const kids = C.comm.filter((c) => c.par === item.id).length; if (!confirm(kids ? `Smazat položku i s ${kids} podřízenými?` : 'Smazat položku?')) return; C.comm = C.comm.filter((c) => c.id !== item.id && c.par !== item.id); }
    saveC(); toast('Smazáno'); back();
  };
}
function isDesc(id, anc) { if (!anc) return false; let c = C.comm.find((x) => x.id === id); while (c && c.par) { if (c.par === anc) return true; c = C.comm.find((x) => x.id === c.par); } return false; }
function catSheet(sh, cat) {
  const d = cat ? clone(cat) : { name: '', color: COLORS[4] };
  sh.innerHTML = head(cat ? 'Kategorie' : 'Nová kategorie', '<button type="button" class="tbtn" id="ck-cancel">Zrušit</button>', '<button type="button" class="tbtn pri" id="ck-save">Uložit</button>') + `<div class="sh-body">
    <div class="list glass"><div class="field"><label>Název</label><input id="ck-name" value="${esc(d.name)}"></div>
    <div class="field"><label>Barva</label><div class="swatches" id="ck-col">${COLORS.map((c) => `<button type="button" style="--c:${c}" data-c="${c}" aria-pressed="${c === d.color}"></button>`).join('')}</div></div></div>
    ${cat ? '<div class="list glass" style="margin-top:20px"><button type="button" class="row danger" id="ck-del">Smazat kategorii</button></div>' : ''}</div>`;
  const back = () => openSheet(editorSheet, true);
  let col = d.color;
  $('ck-cancel').onclick = back;
  $('ck-col').onclick = (e) => { const b = e.target.closest('[data-c]'); if (!b) return; col = b.dataset.c; sh.querySelectorAll('#ck-col button').forEach((x) => x.setAttribute('aria-pressed', x === b)); };
  $('ck-save').onclick = () => {
    const name = $('ck-name').value.trim(); if (!name) { toast('Vyplň název.'); return; }
    if (cat) Object.assign(C.cats.find((c) => c.id === cat.id), { name, color: col });
    else C.cats.push({ id: 'k' + Date.now().toString(36), name, color: col });
    saveC(); back();
  };
  if ($('ck-del')) $('ck-del').onclick = () => {
    const n = C.inst.filter((i) => i.cat === cat.id).length;
    if (n) { toast(`Kategorie obsahuje ${n} pokynů – nejdřív je přesuň nebo smaž.`); return; }
    if (!confirm('Smazat kategorii?')) return;
    C.cats = C.cats.filter((c) => c.id !== cat.id); saveC(); back();
  };
}

showView(S.view || 'patient');
